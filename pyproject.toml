[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pim-check"
version = "2.0.0"
description = "iMX8MP 타겟 QA 자동화 도구"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=5.0",
]

[project.optional-dependencies]
windows = ["paramiko>=2.0"]
all = ["paramiko>=2.0", "rich>=13"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4"]
# pim_viewer TUI 용. 없으면 viewer 는 plain-text 폴백으로 동작한다.
viewer = ["rich>=13"]

[project.scripts]
pim-check = "pim_check:main"
pim-check-web = "web:main"
pim-viewer = "pim_viewer:main"

[tool.uv]
# 이 저장소는 flat-layout(루트에 다수의 최상위 .py 모듈)이라 setuptools 자동
# 패키지 탐색이 실패한다. 테스트/실행 시 빌드·설치가 필요 없으므로 uv 가 프로젝트를
# 빌드하지 않도록 한다(의존성만 가상환경에 동기화). 이로써 `uv run pytest` 가
# 빌드 백엔드 호출 없이 동작한다.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: 단위 테스트",
    "integration: 통합 테스트 (여러 모듈 연동)",
    "simulation: 장애 시뮬레이션 테스트",
]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "runner_loop.py",
    "web.py",
    "pim_check.py",
    # CLI/UI 진입점 — 렌더링·서버 루프라 unit test 커버 대상 아님 (pim_check.py/web.py 와 동급)
    "pim_viewer.py",
    "pim_web_viewer.py",
    "color.py",
    "stream.py",
    # 아래는 SSH + 실물 타겟 의존 스크립트/에이전트 — unit test 커버 불가
    "run_smart_verify.py",
    "run_comprehensive_verify.py",
    "run_channel_verify.py",
    "run_failed_retry.py",
    "run_mixed_combo_verify.py",
    "run_bps_quick.py",
    "infer_agent.py",
    "qa_agent.py",
    "setup.py",
    "verify_retry.py",
    "tools/*",
    "scripts/*",
]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "if __name__",
    "pragma: no cover",
]

[tool.ruff]
target-version = "py39"
line-length = 120
extend-exclude = [".base", ".claude", ".omc", ".serena"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402"]
