name: Gemini Scheduled Issue Triage

on:
  workflow_dispatch:

jobs:
  triage:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/gemini-scheduled-triage.yml@9bfe6f4a9991d21ae95472e939d9e6b197174e9f
    with:
      repo_write_auth: github_token
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
