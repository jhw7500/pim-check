name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install pyyaml pytest pytest-cov

      - name: Run tests with coverage
        run: |
          python -m pytest --cov --cov-report=term-missing --cov-fail-under=90 -q

      - name: Verify schema validity
        run: python -c "import yaml; yaml.safe_load(open('profiles/schema.yaml'))"

      - name: Regenerate profiles
        run: python pim_check.py --generate

      - name: Fail on profile drift
        run: |
          if ! git diff --exit-code profiles/generated/; then
            echo "::error::재생성된 프로파일이 커밋된 것과 다릅니다. 로컬에서 'python pim_check.py --generate' 실행 후 커밋하세요."
            exit 1
          fi

      - name: List generated cases
        run: python pim_check.py --list --include-generated
