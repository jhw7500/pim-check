name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install pyyaml pytest pytest-cov

      - name: Run tests with coverage
        # fail-under threshold는 pyproject.toml의 [tool.coverage.report]에서 관리
        run: |
          python -m pytest --cov --cov-report=term-missing -q

      - name: Verify schema validity
        run: python -c "import yaml; yaml.safe_load(open('profiles/schema.yaml'))"

      - name: Regenerate profiles
        run: python pim_check.py --generate

      - name: Fail on profile drift
        run: |
          if ! git diff --exit-code profiles/generated/; then
            echo "::error::재생성된 프로파일이 커밋된 것과 다릅니다. 로컬에서 'python pim_check.py --generate' 실행 후 커밋하세요."
            exit 1
          fi

      - name: List generated cases
        run: python pim_check.py --list --include-generated

  js-smoke:
    # tests/test_viewer_js_smoke.py — pim_web_viewer 의 임베디드 JS 가 실제
    # 브라우저에서 parse + 실행되는지 검증 (SyntaxError / ReferenceError 같은
    # silent JS regression 가드). pytest 단위 테스트 + ruff 가 못 잡는 영역.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install deps (lockfile-respecting)
        # uv sync 가 pyproject.toml [project.optional-dependencies] 의 js-smoke
        # extra (playwright>=1.40) 와 dev (pytest 등) 를 uv.lock 의 정확한 버전
        # 으로 설치 — `pip install playwright` 가 lockfile bypass 해 latest 가
        # 들어와 환경 drift 발생하는 것을 회피.
        run: uv sync --extra js-smoke --extra dev

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # uv.lock 해시를 key 에 포함 — playwright 버전 bump 시 cache 자동 무효화.
          # 안 그러면 stale chromium 으로 fail 가능 (Claude 권고).
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install chromium
        run: uv run playwright install --with-deps chromium

      - name: Run JS smoke test
        run: uv run pytest tests/test_viewer_js_smoke.py -v
