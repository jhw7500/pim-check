name: Gemini Auto PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  gemini-review:
    if: ${{ github.event.pull_request.head.repo.fork == false && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/gemini-auto-review.yml@9bfe6f4a9991d21ae95472e939d9e6b197174e9f
    with:
      pr_number: ${{ github.event.pull_request.number }}
      repo_write_auth: github_token
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
