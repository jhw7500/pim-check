# Auto-generated by pim-check generator
name: '[auto] 720p_rec2m'
description: 'Auto-generated: 720p rec2m'
setup:
  edgeconf_changes:
    .VHL_CAM.cam_width: 1280
    .VHL_CAM.cam_height: 720
    .VHL_CAM.i2c2.ch1.enable: false
    .VHL_CAM.i2c1.ch2.enable: false
    .VHL_CAM.i2c1.ch3.enable: false
    .VHL_CAM.i2c2.ch0.enable: true
    .VHL_CAM.recording_time: 2
  reboot_after: true
  stabilize_sec: 30
checks:
  cam_state:
    dir: /tmp/cam_state
    expected_state: healthy
    max_streak: 0
  custom_commands:
  - name: SD 쓰기 가능 확인
    command: test -w /mnt/sd_cam && echo OK || echo FAIL:NO_SD
    expected: OK
    on_fail: SD 미마운트 또는 쓰기 불가
  - name: 2분 녹화파일 생성 카운트
    command: sleep 135 && find /mnt/sd_cam -type f \( -name '*.mp4' -o -name '*.ts'
      \) -mmin -3 2>/dev/null | wc -l | tr -d ' '
    expected_min: 1
    on_fail: 2분 녹화파일 미생성
  - name: 2분 녹화 duration (115~125s)
    command: LATEST=$(find /mnt/sd_cam -type f \( -name '*.mp4' -o -name '*.ts' \)
      -mmin -3 -printf '%T@ %p\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-);
      [ -n "$LATEST" ] && ffprobe -v error -show_entries format=duration -of csv=p=0
      "$LATEST" 2>/dev/null | awk '{d=$1; if (d>=115 && d<=125) print "OK"; else printf
      "FAIL:%.1fs\n", d}' || echo FAIL:NO_FILE
    expected: OK
    on_fail: 2분 녹화 duration 범위(115~125s) 벗어남
