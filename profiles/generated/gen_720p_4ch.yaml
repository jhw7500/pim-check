# Auto-generated by pim-check generator
name: '[auto] 720p_4ch'
description: 'Auto-generated: 720p 4ch'
setup:
  edgeconf_changes:
    .VHL_CAM.capture.enable: false
    .VHL_CAM.cam_width: 1280
    .VHL_CAM.cam_height: 720
    .VHL_CAM.i2c2.ch0.enable: true
    .VHL_CAM.i2c2.ch1.enable: true
    .VHL_CAM.i2c1.ch2.enable: true
    .VHL_CAM.i2c1.ch3.enable: true
  reboot_after: true
  stabilize_sec: 30
checks:
  cam_state:
    dir: /tmp/cam_state
    expected_state: healthy
    max_streak: 0
  recording:
    expected_channels: 4
    session_progress: 4/4
  custom_commands:
  - name: i2c-2 dual mode (4ch → 11,12)
    command: i2cdetect -y 2 2>/dev/null | awk 'NR>1 {for(i=2;i<=NF;i++) if ($i=="11"
      || $i=="12") print $i}' | sort -u | tr '\n' ',' | sed 's/,$//'
    expected: 11,12
    on_fail: 4ch 기대 i2c-2 dual(11,12)이 아님
  - name: i2c-1 dual mode (4ch → 11,12)
    command: i2cdetect -y 1 2>/dev/null | awk 'NR>1 {for(i=2;i<=NF;i++) if ($i=="11"
      || $i=="12") print $i}' | sort -u | tr '\n' ',' | sed 's/,$//'
    expected: 11,12
    on_fail: 4ch 기대 i2c-1 dual(11,12)이 아님
