# Auto-generated by pim-check generator
name: '[auto] 720p_vflip_off'
description: 'Auto-generated: 720p vflip_off'
setup:
  edgeconf_changes:
    .VHL_CAM.cam_width: 1280
    .VHL_CAM.cam_height: 720
    .VHL_CAM.i2c2.ch0.enable: false
    .VHL_CAM.i2c2.ch1.enable: false
    .VHL_CAM.i2c1.ch2.enable: false
    .VHL_CAM.i2c1.ch3.enable: true
    .VHL_CAM.i2c1.ch3.vflip: false
  reboot_after: true
  stabilize_sec: 30
checks:
