# profiles/targets.yaml — 병렬 테스트 타겟 목록
# python3 pim_check.py --parallel --case 720p_2ch

targets:
  - host: 192.168.0.5
    user: root
    password: root
    # 타겟별 체크 기준 override (base.yaml 위에 덮어씀)
    overrides:
      thermal:
        max_temp_c: 95
        warn_temp_c: 90
      # 이 타겟은 cooling이 부족하여 thermal 기준을 높임

