  ord_vcm:
    path: /root/shared_v/ord_vcm_conf.json
    axes:
      ord_disk:
        keys:
          ".ORD.disk_manage": [true, false]
          ".ORD.event_auto_remove": [true, false]
        combinations:
          - name: "disk_on"
            values:
              ".ORD.disk_manage": true
              ".ORD.event_auto_remove": true
          - name: "disk_off"
            values:
              ".ORD.disk_manage": false
              ".ORD.event_auto_remove": false

      vcm_srt:
        keys:
          ".VCM.srt_enable": [true, false]
        combinations:
          - name: "srt_on"
            values:
              ".VCM.srt_enable": true
          - name: "srt_off"
            values:
              ".VCM.srt_enable": false

# 기대값 계산 규칙
# 우선순위: 정확한 키 매칭 > 와일드카드 매칭 (fnmatch 스타일)
# 와일드카드 충돌 시 가장 구체적인 패턴이 우선 (* 개수가 적은 것)
expectations:
  cpu:
    gst_range:
      # resolution + channels + fps 조합
      "720p+2ch+15fps": [5, 60]
      "720p+2ch+30fps": [10, 70]
      "720p+4ch+15fps": [20, 80]
      "720p+4ch+30fps": [30, 90]
      "fhd+2ch+15fps": [20, 80]
      "fhd+2ch+30fps": [30, 90]
      "fhd+4ch+15fps": [50, 95]
      "fhd+4ch+30fps": [60, 100]
      # ord_vcm 조합은 CPU 무관
  thermal:
    warn_temp_c:
      # shutdown=95°C 기준, warn=88°C
      "fhd+*": 88
  cam_state:
    dir: /tmp/cam_state
    expected_state: healthy
    max_streak: 0
  recording:
    from_axis: "channels.expect.channel_count"
  stabilize_sec:
    "720p+2ch+*": 30
    "720p+4ch+*": 40
    "fhd+2ch+*": 40
    "fhd+4ch+*": 60
    # ord_vcm은 재부팅 불필요
    "disk_*": 0
    "srt_*": 0

# 조합 생성 규칙
# edgeconf: resolution x channels x fps = 8 조합
# ord_vcm: ord_disk x vcm_srt = 4 조합 (별도 그룹)
generation:
  groups:
    - name: edgeconf_camera
      source: edgeconf
      cross: [resolution, channels, fps]
      output_dir: profiles/generated
      filename_pattern: "gen_{resolution}_{channels}_{fps}.yaml"

    - name: hflip_variants_ch0
      source: edgeconf
      cross: [resolution, hflip_ch0]
      output_dir: profiles/generated
      filename_pattern: "gen_{resolution}_ch0_{hflip_ch0}.yaml"

    - name: hflip_variants_ch1
      source: edgeconf
      cross: [resolution, hflip_ch1]
      output_dir: profiles/generated
      filename_pattern: "gen_{resolution}_ch1_{hflip_ch1}.yaml"

    - name: hflip_variants_ch2
      source: edgeconf
      cross: [resolution, hflip_ch2]
      output_dir: profiles/generated
      filename_pattern: "gen_{resolution}_ch2_{hflip_ch2}.yaml"

    - name: hflip_variants_ch3
      source: edgeconf
      cross: [resolution, hflip_ch3]
      output_dir: profiles/generated
      filename_pattern: "gen_{resolution}_ch3_{hflip_ch3}.yaml"

    - name: edgeconf_capture
      source: edgeconf
