                command: "LATEST=$(find /mnt/sd_cam -type f \\( -name '*.mp4' -o -name '*.ts' \\) -mmin -6 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); [ -n \"$LATEST\" ] && ffprobe -v error -show_entries format=duration -of csv=p=0 \"$LATEST\" 2>/dev/null | awk '{d=$1; if (d>=295 && d<=305) print \"OK\"; else printf \"FAIL:%.1fs\\n\", d}' || echo FAIL:NO_FILE"
