                command: "find /mnt/sd_cam -type f -name '*.mp4' -mmin -2 2>/dev/null | wc -l | tr -d ' '"
                expected: "0"
                on_fail: "muxer=ts 설정인데 MP4 파일이 함께 생성됨"

      # bitrate per-channel: edgeconf 반영 + ffprobe로 실측 bitrate 범위 검증.
      # FINDING #5 정정:
      #   - 기존 bitrate 단일 축(ch0만)을 bitrate_ch0~ch3 per-channel 축으로 확장
      #   - edgeconf 파일 값만 보던 검증에 ffprobe 실측 bitrate 범위 검증 추가
      #   - 각 축은 해당 채널만 enable(state isolation)
      # 전제: /mnt/sd_cam 마운트 + recording_time=1 + muxer=mp4로 75s 대기 후 파일 확보.
      # 실측 bitrate는 씬 복잡도에 따라 variance 크므로 ±50% 범위로 완화 검증.
      # bps[0]=high(kbps), bps[1]=low(kbps). 실측 범위: [low*0.5, high*1.1] kbps.

      bitrate_ch0:
        keys:
          ".VHL_CAM.i2c2.ch0.bps": [[1024, 512], [2048, 1024], [4096, 2048]]
        combinations:
          - name: "bps_low"
            values:
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": false
              ".VHL_CAM.i2c2.ch0.enable": true
              ".VHL_CAM.i2c2.ch0.bps": [1024, 512]
              ".VHL_CAM.recording_time": 1
              ".VHL_CAM.muxer": "mp4"
            verify:
              - name: "edgeconf bps ch0 high/low 반영"
                command: "jq -c '.VHL_CAM.i2c2.ch0.bps' /root/shared_v/edgeconf_pim.json"
                expected: "[1024,512]"
                on_fail: "edgeconf bps ch0 미반영"
              - name: "SD 쓰기 가능"
                command: "test -w /mnt/sd_cam && echo OK || echo FAIL:NO_SD"
                expected: "OK"
                on_fail: "SD 미마운트"
              - name: "실측 bitrate ch0 (256~1126 kbps)"
                command: "sleep 75 && F=$(find /mnt/sd_cam -type f -name '*ch0*.mp4' -mmin -2 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); [ -n \"$F\" ] && BR=$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$BR\" | awk '{k=$1/1000; if (k>=256 && k<=1126) print \"OK\"; else printf \"FAIL:%.0fkbps\\n\", k}' || echo FAIL:NO_FILE"
                expected: "OK"
                on_fail: "ch0 실측 bitrate 범위(256~1126 kbps) 벗어남"
          - name: "bps_default"
            values:
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": false
              ".VHL_CAM.i2c2.ch0.enable": true
              ".VHL_CAM.i2c2.ch0.bps": [2048, 1024]
              ".VHL_CAM.recording_time": 1
              ".VHL_CAM.muxer": "mp4"
            verify:
              - name: "edgeconf bps ch0 high/low 반영"
                command: "jq -c '.VHL_CAM.i2c2.ch0.bps' /root/shared_v/edgeconf_pim.json"
                expected: "[2048,1024]"
                on_fail: "edgeconf bps ch0 미반영"
              - name: "SD 쓰기 가능"
                command: "test -w /mnt/sd_cam && echo OK || echo FAIL:NO_SD"
                expected: "OK"
                on_fail: "SD 미마운트"
              - name: "실측 bitrate ch0 (512~2252 kbps)"
                command: "sleep 75 && F=$(find /mnt/sd_cam -type f -name '*ch0*.mp4' -mmin -2 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); [ -n \"$F\" ] && BR=$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$BR\" | awk '{k=$1/1000; if (k>=512 && k<=2252) print \"OK\"; else printf \"FAIL:%.0fkbps\\n\", k}' || echo FAIL:NO_FILE"
                expected: "OK"
                on_fail: "ch0 실측 bitrate 범위(512~2252 kbps) 벗어남"
          - name: "bps_high"
