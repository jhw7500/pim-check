                expected: "11,12"
                on_fail: "4ch 기대 i2c-1 dual(11,12)이 아님"
          - name: "1ch_ch3"
            values:
              ".VHL_CAM.i2c2.ch0.enable": false
              ".VHL_CAM.i2c2.ch1.enable": false
