      # vflip/hflip은 AP1302 ROTATION 레지스터(0x100c)로 병합 저장
      # bit0=hflip, bit1=vflip → 0x0000=없음, 0x0001=hflip, 0x0002=vflip, 0x0003=양쪽
      # 주소: dual mode(양 채널 enable)=ch0:0x11 ch1:0x12, single mode=0x3c (fallback)
      # ch0 → i2c-2, ch1 → i2c-2, ch2 → i2c-1, ch3 → i2c-1
      vflip_ch0:
        keys:
          ".VHL_CAM.i2c2.ch0.vflip": [true, false]
        combinations:
          - name: "vflip_off"
            values:
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": false
              ".VHL_CAM.i2c2.ch0.enable": true
              ".VHL_CAM.i2c2.ch0.vflip": false
            verify:
              - name: "edgeconf vflip_ch0 반영"
                command: "jq -r '.VHL_CAM.i2c2.ch0.vflip' /root/shared_v/edgeconf_pim.json"
                expected: "false"
                on_fail: "edgeconf vflip_ch0 미반영"
              - name: "ch0 ROTATION 레지스터 확인 (vflip off)"
                command: "i2ctransfer -f -y 2 w2@0x3c 0x10 0x0c r2 2>/dev/null | tr -d ' '"
                expected: "0x000x00"
                on_fail: "ch0 ISP ROTATION 레지스터에 vflip off 미반영"
          - name: "vflip_on"
            values:
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": false
              ".VHL_CAM.i2c2.ch0.enable": true
              ".VHL_CAM.i2c2.ch0.vflip": true
            verify:
              - name: "edgeconf vflip_ch0 반영"
                command: "jq -r '.VHL_CAM.i2c2.ch0.vflip' /root/shared_v/edgeconf_pim.json"
                expected: "true"
                on_fail: "edgeconf vflip_ch0 미반영"
              - name: "ch0 ROTATION 레지스터 확인 (vflip on, bit1)"
                command: "i2ctransfer -f -y 2 w2@0x3c 0x10 0x0c r2 2>/dev/null | tr -d ' '"
                expected: "0x000x02"
                on_fail: "ch0 ISP ROTATION 레지스터에 vflip on 미반영"

