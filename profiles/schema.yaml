# profiles/schema.yaml — 설정 축 정의 + 기대값 규칙
# pim-check 테스트 케이스 자동 생성용
# 실제 타겟 JSON 구조 확인 완료 (2026-04-05)
version: 1

sources:
  edgeconf:
    path: /root/shared_v/edgeconf_pim.json
    axes:
      resolution:
        keys:
          ".VHL_CAM.cam_width": [1280, 1920]
          ".VHL_CAM.cam_height": [720, 1080]
        combinations:
          - name: "720p"
            values:
              ".VHL_CAM.cam_width": 1280
              ".VHL_CAM.cam_height": 720
          - name: "fhd"
            values:
              ".VHL_CAM.cam_width": 1920
              ".VHL_CAM.cam_height": 1080

      channels:
        keys:
          ".VHL_CAM.i2c1.ch2.enable": [true, false]
          ".VHL_CAM.i2c1.ch3.enable": [true, false]
        combinations:
          - name: "2ch"
            values:
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": false
            expect:
              channel_count: 2
          - name: "4ch"
            values:
              ".VHL_CAM.i2c1.ch2.enable": true
              ".VHL_CAM.i2c1.ch3.enable": true
            expect:
              channel_count: 4

      # fps: edgeconf 반영 + ffprobe 기반 실제 스트림 framerate 검증.
      # FINDING #3 정정:
      #   - ch0만 enable (state isolation)
      #   - recording_time=1 + muxer=mp4 고정으로 75s 대기 후 완료 파일 확보
      #   - ffprobe r_frame_rate 실측 → 설정 fps와 일치해야 PASS
      fps:
        keys:
          ".VHL_CAM.fps": [15, 30]
        combinations:
          - name: "15fps"
            values:
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": false
              ".VHL_CAM.i2c2.ch0.enable": true
              ".VHL_CAM.fps": 15
              ".VHL_CAM.recording_time": 1
              ".VHL_CAM.muxer": "mp4"
            verify:
              - name: "edgeconf fps 반영"
                command: "jq -r '.VHL_CAM.fps' /root/shared_v/edgeconf_pim.json"
                expected: "15"
                on_fail: "edgeconf fps=15 미반영"
              - name: "SD 쓰기 가능 확인"
                command: "test -w /mnt/sd_cam && echo OK || echo FAIL:NO_SD"
                expected: "OK"
                on_fail: "SD 미마운트 — fps 실측 검증 전제 조건 불충족"
              - name: "실제 스트림 15fps 확인 (ffprobe r_frame_rate)"
                command: "sleep 75 && LATEST=$(find /mnt/sd_cam -type f \\( -name '*.mp4' -o -name '*.ts' \\) -mmin -2 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); [ -n \"$LATEST\" ] && FR=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 \"$LATEST\" 2>/dev/null) && echo \"$FR\" | awk -F/ '{n=$1/$2; if (n>=14.5 && n<=15.5) print \"OK\"; else printf \"FAIL:%.1f\\n\", n}' || echo FAIL:NO_FILE"
                expected: "OK"
                on_fail: "실제 스트림 fps가 15가 아님"
          - name: "30fps"
            values:
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": false
              ".VHL_CAM.i2c2.ch0.enable": true
              ".VHL_CAM.fps": 30
              ".VHL_CAM.recording_time": 1
              ".VHL_CAM.muxer": "mp4"
            verify:
              - name: "edgeconf fps 반영"
                command: "jq -r '.VHL_CAM.fps' /root/shared_v/edgeconf_pim.json"
                expected: "30"
                on_fail: "edgeconf fps=30 미반영"
              - name: "SD 쓰기 가능 확인"
                command: "test -w /mnt/sd_cam && echo OK || echo FAIL:NO_SD"
                expected: "OK"
                on_fail: "SD 미마운트 — fps 실측 검증 전제 조건 불충족"
              - name: "실제 스트림 30fps 확인 (ffprobe r_frame_rate)"
                command: "sleep 75 && LATEST=$(find /mnt/sd_cam -type f \\( -name '*.mp4' -o -name '*.ts' \\) -mmin -2 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); [ -n \"$LATEST\" ] && FR=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 \"$LATEST\" 2>/dev/null) && echo \"$FR\" | awk -F/ '{n=$1/$2; if (n>=29.5 && n<=30.5) print \"OK\"; else printf \"FAIL:%.1f\\n\", n}' || echo FAIL:NO_FILE"
                expected: "OK"
                on_fail: "실제 스트림 fps가 30이 아님"

      # hflip per-channel: vflip_chN과 대칭 커버리지.
      # FINDING #7 정정:
      #   - 기존 hflip 축(ch0 전용)을 hflip_ch0~ch3 per-channel 4개 축으로 확장
      #   - 각 축은 대상 채널만 enable(state isolation) + vflip=false 명시
      #     (ROTATION 레지스터는 hflip=bit0, vflip=bit1 공유이므로 vflip 명시 필수)
      # ROTATION 기대: hflip_off → 0x0000, hflip_on → 0x0001 (vflip=false 전제)
      hflip_ch0:
        keys:
          ".VHL_CAM.i2c2.ch0.hflip": [true, false]
        combinations:
          - name: "hflip_off"
            values:
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": false
              ".VHL_CAM.i2c2.ch0.enable": true
              ".VHL_CAM.i2c2.ch0.vflip": false
              ".VHL_CAM.i2c2.ch0.hflip": false
            verify:
              - name: "edgeconf hflip_ch0 반영"
                command: "jq -r '.VHL_CAM.i2c2.ch0.hflip' /root/shared_v/edgeconf_pim.json"
                expected: "false"
                on_fail: "edgeconf hflip_ch0=false 미반영"
              - name: "ch0 ROTATION 레지스터 확인 (hflip=off, vflip=off → 0x0000)"
                command: "i2ctransfer -f -y 2 w2@0x3c 0x10 0x0c r2 2>/dev/null | tr -d ' '"
                expected: "0x000x00"
                on_fail: "ch0 ISP ROTATION 레지스터에 hflip off 미반영"
          - name: "hflip_on"
            values:
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": false
              ".VHL_CAM.i2c2.ch0.enable": true
              ".VHL_CAM.i2c2.ch0.vflip": false
              ".VHL_CAM.i2c2.ch0.hflip": true
            verify:
              - name: "edgeconf hflip_ch0 반영"
                command: "jq -r '.VHL_CAM.i2c2.ch0.hflip' /root/shared_v/edgeconf_pim.json"
                expected: "true"
                on_fail: "edgeconf hflip_ch0=true 미반영"
              - name: "ch0 ROTATION 레지스터 확인 (hflip=on, vflip=off → 0x0001)"
                command: "i2ctransfer -f -y 2 w2@0x3c 0x10 0x0c r2 2>/dev/null | tr -d ' '"
                expected: "0x000x01"
                on_fail: "ch0 ISP ROTATION 레지스터에 hflip on 미반영"

      hflip_ch1:
        keys:
          ".VHL_CAM.i2c2.ch1.hflip": [true, false]
        combinations:
          - name: "hflip_off"
            values:
              ".VHL_CAM.i2c2.ch0.enable": false
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": false
              ".VHL_CAM.i2c2.ch1.enable": true
              ".VHL_CAM.i2c2.ch1.vflip": false
              ".VHL_CAM.i2c2.ch1.hflip": false
            verify:
              - name: "edgeconf hflip_ch1 반영"
                command: "jq -r '.VHL_CAM.i2c2.ch1.hflip' /root/shared_v/edgeconf_pim.json"
                expected: "false"
                on_fail: "edgeconf hflip_ch1=false 미반영"
              - name: "ch1 ROTATION 레지스터 확인 (hflip=off → 0x0000)"
                command: "i2ctransfer -f -y 2 w2@0x3c 0x10 0x0c r2 2>/dev/null | tr -d ' '"
                expected: "0x000x00"
                on_fail: "ch1 ISP ROTATION 레지스터에 hflip off 미반영"
          - name: "hflip_on"
            values:
              ".VHL_CAM.i2c2.ch0.enable": false
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": false
              ".VHL_CAM.i2c2.ch1.enable": true
              ".VHL_CAM.i2c2.ch1.vflip": false
              ".VHL_CAM.i2c2.ch1.hflip": true
            verify:
              - name: "edgeconf hflip_ch1 반영"
                command: "jq -r '.VHL_CAM.i2c2.ch1.hflip' /root/shared_v/edgeconf_pim.json"
                expected: "true"
                on_fail: "edgeconf hflip_ch1=true 미반영"
              - name: "ch1 ROTATION 레지스터 확인 (hflip=on → 0x0001)"
                command: "i2ctransfer -f -y 2 w2@0x3c 0x10 0x0c r2 2>/dev/null | tr -d ' '"
                expected: "0x000x01"
                on_fail: "ch1 ISP ROTATION 레지스터에 hflip on 미반영"

      hflip_ch2:
        keys:
          ".VHL_CAM.i2c1.ch2.hflip": [true, false]
        combinations:
          - name: "hflip_off"
            values:
              ".VHL_CAM.i2c2.ch0.enable": false
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch3.enable": false
              ".VHL_CAM.i2c1.ch2.enable": true
              ".VHL_CAM.i2c1.ch2.vflip": false
              ".VHL_CAM.i2c1.ch2.hflip": false
            verify:
              - name: "edgeconf hflip_ch2 반영"
                command: "jq -r '.VHL_CAM.i2c1.ch2.hflip' /root/shared_v/edgeconf_pim.json"
                expected: "false"
                on_fail: "edgeconf hflip_ch2=false 미반영"
              - name: "ch2 ROTATION 레지스터 확인 (hflip=off → 0x0000)"
                command: "i2ctransfer -f -y 1 w2@0x3c 0x10 0x0c r2 2>/dev/null | tr -d ' '"
                expected: "0x000x00"
                on_fail: "ch2 ISP ROTATION 레지스터에 hflip off 미반영"
          - name: "hflip_on"
            values:
              ".VHL_CAM.i2c2.ch0.enable": false
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch3.enable": false
              ".VHL_CAM.i2c1.ch2.enable": true
              ".VHL_CAM.i2c1.ch2.vflip": false
              ".VHL_CAM.i2c1.ch2.hflip": true
            verify:
              - name: "edgeconf hflip_ch2 반영"
                command: "jq -r '.VHL_CAM.i2c1.ch2.hflip' /root/shared_v/edgeconf_pim.json"
                expected: "true"
                on_fail: "edgeconf hflip_ch2=true 미반영"
              - name: "ch2 ROTATION 레지스터 확인 (hflip=on → 0x0001)"
                command: "i2ctransfer -f -y 1 w2@0x3c 0x10 0x0c r2 2>/dev/null | tr -d ' '"
                expected: "0x000x01"
                on_fail: "ch2 ISP ROTATION 레지스터에 hflip on 미반영"

      hflip_ch3:
        keys:
          ".VHL_CAM.i2c1.ch3.hflip": [true, false]
        combinations:
          - name: "hflip_off"
            values:
              ".VHL_CAM.i2c2.ch0.enable": false
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": true
              ".VHL_CAM.i2c1.ch3.vflip": false
              ".VHL_CAM.i2c1.ch3.hflip": false
            verify:
              - name: "edgeconf hflip_ch3 반영"
                command: "jq -r '.VHL_CAM.i2c1.ch3.hflip' /root/shared_v/edgeconf_pim.json"
                expected: "false"
                on_fail: "edgeconf hflip_ch3=false 미반영"
              - name: "ch3 ROTATION 레지스터 확인 (hflip=off → 0x0000)"
                command: "i2ctransfer -f -y 1 w2@0x3c 0x10 0x0c r2 2>/dev/null | tr -d ' '"
                expected: "0x000x00"
                on_fail: "ch3 ISP ROTATION 레지스터에 hflip off 미반영"
          - name: "hflip_on"
            values:
              ".VHL_CAM.i2c2.ch0.enable": false
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": true
              ".VHL_CAM.i2c1.ch3.vflip": false
              ".VHL_CAM.i2c1.ch3.hflip": true
            verify:
              - name: "edgeconf hflip_ch3 반영"
                command: "jq -r '.VHL_CAM.i2c1.ch3.hflip' /root/shared_v/edgeconf_pim.json"
                expected: "true"
                on_fail: "edgeconf hflip_ch3=true 미반영"
              - name: "ch3 ROTATION 레지스터 확인 (hflip=on → 0x0001)"
                command: "i2ctransfer -f -y 1 w2@0x3c 0x10 0x0c r2 2>/dev/null | tr -d ' '"
                expected: "0x000x01"
                on_fail: "ch3 ISP ROTATION 레지스터에 hflip on 미반영"

      # capture: 캡처 기능 enable/disable 검증.
      # FINDING #2 정정:
      #   - ch0만 enable (state isolation)
      #   - edgeconf 반영 확인 + 캡처 디렉토리 쓰기 가능 + 설정 일관성 검증 추가
      # 전제: 캡처는 이벤트 트리거 기반이라 automated run에서 실제 파일 생성 보장 어려움.
      #   → enable 상태에서는 "디렉토리 존재+쓰기 가능+ capture path가 edgeconf와 일치"만 확인.
      #   실제 트리거 기반 파일 생성 검증은 별도 end-to-end 테스트에서 수행.
      capture:
        keys:
          ".VHL_CAM.capture.enable": [true, false]
        combinations:
          - name: "cap_off"
            values:
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": false
              ".VHL_CAM.i2c2.ch0.enable": true
              ".VHL_CAM.capture.enable": false
            verify:
              - name: "edgeconf capture.enable 반영"
                command: "jq -r '.VHL_CAM.capture.enable' /root/shared_v/edgeconf_pim.json"
                expected: "false"
                on_fail: "edgeconf capture.enable=false 미반영"
              - name: "capture 비활성 시 최근 캡처 파일 없음 확인 (배타)"
                command: "PATH_C=$(jq -r '.VHL_CAM.capture.path' /root/shared_v/edgeconf_pim.json); [ -d \"$PATH_C\" ] && find \"$PATH_C\" -type f -mmin -2 2>/dev/null | wc -l | tr -d ' ' || echo 0"
                expected: "0"
                on_fail: "capture=off인데 최근 2분 내 캡처 파일 생성됨"
          - name: "cap_on"
            values:
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": false
              ".VHL_CAM.i2c2.ch0.enable": true
              ".VHL_CAM.capture.enable": true
            verify:
              - name: "edgeconf capture.enable 반영"
                command: "jq -r '.VHL_CAM.capture.enable' /root/shared_v/edgeconf_pim.json"
                expected: "true"
                on_fail: "edgeconf capture.enable=true 미반영"
              - name: "capture 경로 존재 및 쓰기 가능"
                command: "PATH_C=$(jq -r '.VHL_CAM.capture.path' /root/shared_v/edgeconf_pim.json); if [ -d \"$PATH_C\" ] && [ -w \"$PATH_C\" ]; then echo OK; else echo FAIL:$PATH_C; fi"
                expected: "OK"
                on_fail: "capture 디렉토리 존재하지 않거나 쓰기 불가"

      # recording_time: 각 설정 값(분)에 대해 실제 생성된 파일의 duration을 ffprobe로 실측.
      # FINDING #1, #9 (docs/03-analysis/verification-audit-2026-04-22.md) 정정:
      #   - ch0만 enable(나머지 3채널 disable)로 state isolation 강제
      #   - `|| echo 0` 실패 은폐 제거 — 파일 미생성/ffprobe 실패 시 FAIL로 명확히 표시
      #   - duration 범위 검증 (target ±5s) — 파일 존재만이 아닌 실제 녹화 길이 확인
      # 전제: /mnt/sd_cam 마운트 가능(SD 또는 tmpfs). 마운트 없으면 first verify가 명시적 FAIL.
      recording_time:
        keys:
          ".VHL_CAM.recording_time": [1, 2, 5]
        combinations:
          - name: "rec1m"
            values:
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": false
              ".VHL_CAM.i2c2.ch0.enable": true
              ".VHL_CAM.recording_time": 1
            verify:
              - name: "SD 쓰기 가능 확인"
                command: "test -w /mnt/sd_cam && echo OK || echo FAIL:NO_SD"
                expected: "OK"
                on_fail: "SD 미마운트 또는 쓰기 불가 — 녹화 검증 전제 조건 불충족"
              - name: "1분 녹화파일 생성 카운트"
                command: "sleep 75 && find /mnt/sd_cam -type f \\( -name '*.mp4' -o -name '*.ts' \\) -mmin -2 2>/dev/null | wc -l | tr -d ' '"
                expected_min: 1
                on_fail: "1분 녹화파일 미생성"
              - name: "1분 녹화 duration (55~65s)"
                command: "LATEST=$(find /mnt/sd_cam -type f \\( -name '*.mp4' -o -name '*.ts' \\) -mmin -2 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); [ -n \"$LATEST\" ] && ffprobe -v error -show_entries format=duration -of csv=p=0 \"$LATEST\" 2>/dev/null | awk '{d=$1; if (d>=55 && d<=65) print \"OK\"; else printf \"FAIL:%.1fs\\n\", d}' || echo FAIL:NO_FILE"
                expected: "OK"
                on_fail: "1분 녹화 duration 범위(55~65s) 벗어남"
          - name: "rec2m"
            values:
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": false
              ".VHL_CAM.i2c2.ch0.enable": true
              ".VHL_CAM.recording_time": 2
            verify:
              - name: "SD 쓰기 가능 확인"
                command: "test -w /mnt/sd_cam && echo OK || echo FAIL:NO_SD"
                expected: "OK"
                on_fail: "SD 미마운트 또는 쓰기 불가"
              - name: "2분 녹화파일 생성 카운트"
                command: "sleep 135 && find /mnt/sd_cam -type f \\( -name '*.mp4' -o -name '*.ts' \\) -mmin -3 2>/dev/null | wc -l | tr -d ' '"
                expected_min: 1
                on_fail: "2분 녹화파일 미생성"
              - name: "2분 녹화 duration (115~125s)"
                command: "LATEST=$(find /mnt/sd_cam -type f \\( -name '*.mp4' -o -name '*.ts' \\) -mmin -3 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); [ -n \"$LATEST\" ] && ffprobe -v error -show_entries format=duration -of csv=p=0 \"$LATEST\" 2>/dev/null | awk '{d=$1; if (d>=115 && d<=125) print \"OK\"; else printf \"FAIL:%.1fs\\n\", d}' || echo FAIL:NO_FILE"
                expected: "OK"
                on_fail: "2분 녹화 duration 범위(115~125s) 벗어남"
          - name: "rec5m"
            values:
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": false
              ".VHL_CAM.i2c2.ch0.enable": true
              ".VHL_CAM.recording_time": 5
            verify:
              - name: "SD 쓰기 가능 확인"
                command: "test -w /mnt/sd_cam && echo OK || echo FAIL:NO_SD"
                expected: "OK"
                on_fail: "SD 미마운트 또는 쓰기 불가"
              - name: "5분 녹화파일 생성 카운트"
