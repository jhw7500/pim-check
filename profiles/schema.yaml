                expected: "0x110x50"
                on_fail: "ch1 ISP AWB_CTRL 레지스터에 OFF 미반영"

      awb_ch2:
        keys:
          ".VHL_CAM.i2c1.ch2.awb": ["auto", "off"]
        combinations:
