      # channel_combo: 채널 enable 조합별 실제 ISP 동작 모드(single/dual/quad) 검증.
      # FINDING #6, #27 정정:
      #   - 모든 조합에 i2cdetect 기반 "실제 응답 주소 패턴" 검증 verify 추가
      #   - `1ch_ch1` combo 추가 (기존 누락)
      # 기대 패턴: 각 버스에서 AP1302 주소(0x11/0x12/0x3c) 중 응답하는 주소를 sorted comma-list로
      #   - "": AP1302 불활성 (해당 버스에 채널 없음)
      #   - "3c": single mode (해당 버스에 1채널만)
      #   - "11,12": dual mode (해당 버스에 2채널 모두)
      # 변환: i2cdetect 출력에서 "11"|"12"|"3c" 필터 후 sort -u하여 콤마 결합.
      channel_combo:
        keys:
          ".VHL_CAM.i2c2.ch0.enable": [true, false]
          ".VHL_CAM.i2c2.ch1.enable": [true, false]
          ".VHL_CAM.i2c1.ch2.enable": [true, false]
          ".VHL_CAM.i2c1.ch3.enable": [true, false]
        combinations:
          - name: "0ch"
            values:
              ".VHL_CAM.i2c2.ch0.enable": false
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": false
            expect:
              channel_count: 0
            verify:
              - name: "i2c-2 AP1302 미응답 (0ch)"
                command: "i2cdetect -y 2 2>/dev/null | awk 'NR>1 {for(i=2;i<=NF;i++) if ($i==\"11\" || $i==\"12\") print $i}' | sort -u | tr '\\n' ',' | sed 's/,$//'"
                expected: ""
                on_fail: "0ch인데 i2c-2에서 AP1302 주소 응답"
              - name: "i2c-1 AP1302 미응답 (0ch)"
                command: "i2cdetect -y 1 2>/dev/null | awk 'NR>1 {for(i=2;i<=NF;i++) if ($i==\"11\" || $i==\"12\") print $i}' | sort -u | tr '\\n' ',' | sed 's/,$//'"
                expected: ""
                on_fail: "0ch인데 i2c-1에서 AP1302 주소 응답"
          - name: "1ch_ch0"
            values:
              ".VHL_CAM.i2c2.ch0.enable": true
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": false
            expect:
              channel_count: 1
            verify:
              - name: "i2c-2 single mode 확인 (ch0 only → 3c)"
                command: "i2cdetect -y 2 2>/dev/null | awk 'NR>1 {for(i=2;i<=NF;i++) if ($i==\"11\" || $i==\"12\") print $i}' | sort -u | tr '\\n' ',' | sed 's/,$//'"
                expected: ""
                on_fail: "1ch_ch0 기대 single인데 0x11 또는 0x12가 응답함"
              - name: "i2c-1 AP1302 미응답 (1ch_ch0)"
                command: "i2cdetect -y 1 2>/dev/null | awk 'NR>1 {for(i=2;i<=NF;i++) if ($i==\"11\" || $i==\"12\") print $i}' | sort -u | tr '\\n' ',' | sed 's/,$//'"
                expected: ""
                on_fail: "1ch_ch0인데 i2c-1에 AP1302 응답"
          - name: "1ch_ch1"
            values:
              ".VHL_CAM.i2c2.ch0.enable": false
              ".VHL_CAM.i2c2.ch1.enable": true
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": false
            expect:
              channel_count: 1
            verify:
              - name: "i2c-2 single mode 확인 (ch1 only → 3c)"
                command: "i2cdetect -y 2 2>/dev/null | awk 'NR>1 {for(i=2;i<=NF;i++) if ($i==\"11\" || $i==\"12\") print $i}' | sort -u | tr '\\n' ',' | sed 's/,$//'"
                expected: ""
                on_fail: "1ch_ch1 기대 single인데 0x11 또는 0x12가 응답함"
              - name: "i2c-1 AP1302 미응답 (1ch_ch1)"
                command: "i2cdetect -y 1 2>/dev/null | awk 'NR>1 {for(i=2;i<=NF;i++) if ($i==\"11\" || $i==\"12\") print $i}' | sort -u | tr '\\n' ',' | sed 's/,$//'"
                expected: ""
                on_fail: "1ch_ch1인데 i2c-1에 AP1302 응답"
          - name: "1ch_ch2"
            values:
              ".VHL_CAM.i2c2.ch0.enable": false
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch2.enable": true
              ".VHL_CAM.i2c1.ch3.enable": false
            expect:
              channel_count: 1
            verify:
              - name: "i2c-2 AP1302 미응답 (1ch_ch2)"
                command: "i2cdetect -y 2 2>/dev/null | awk 'NR>1 {for(i=2;i<=NF;i++) if ($i==\"11\" || $i==\"12\") print $i}' | sort -u | tr '\\n' ',' | sed 's/,$//'"
                expected: ""
                on_fail: "1ch_ch2인데 i2c-2에 AP1302 응답"
              - name: "i2c-1 single mode 확인 (ch2 only → 3c)"
                command: "i2cdetect -y 1 2>/dev/null | awk 'NR>1 {for(i=2;i<=NF;i++) if ($i==\"11\" || $i==\"12\") print $i}' | sort -u | tr '\\n' ',' | sed 's/,$//'"
                expected: ""
                on_fail: "1ch_ch2 기대 single인데 0x11 또는 0x12가 응답함"
          - name: "2ch_cross"
            values:
              ".VHL_CAM.i2c2.ch0.enable": true
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch2.enable": true
              ".VHL_CAM.i2c1.ch3.enable": false
            expect:
              channel_count: 2
            verify:
              - name: "i2c-2 single mode (2ch_cross → 3c)"
                command: "i2cdetect -y 2 2>/dev/null | awk 'NR>1 {for(i=2;i<=NF;i++) if ($i==\"11\" || $i==\"12\") print $i}' | sort -u | tr '\\n' ',' | sed 's/,$//'"
                expected: ""
                on_fail: "2ch_cross 기대 i2c-2 single인데 0x11 또는 0x12가 응답함"
              - name: "i2c-1 single mode (2ch_cross → 3c)"
                command: "i2cdetect -y 1 2>/dev/null | awk 'NR>1 {for(i=2;i<=NF;i++) if ($i==\"11\" || $i==\"12\") print $i}' | sort -u | tr '\\n' ',' | sed 's/,$//'"
                expected: ""
                on_fail: "2ch_cross 기대 i2c-1 single인데 0x11 또는 0x12가 응답함"
          - name: "2ch_same_bus"
            values:
              ".VHL_CAM.i2c2.ch0.enable": true
              ".VHL_CAM.i2c2.ch1.enable": true
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": false
            expect:
              channel_count: 2
            verify:
              - name: "i2c-2 dual mode (2ch_same_bus → 11,12)"
                command: "i2cdetect -y 2 2>/dev/null | awk 'NR>1 {for(i=2;i<=NF;i++) if ($i==\"11\" || $i==\"12\") print $i}' | sort -u | tr '\\n' ',' | sed 's/,$//'"
                expected: "11,12"
                on_fail: "2ch_same_bus 기대 i2c-2 dual(11,12)이 아님"
              - name: "i2c-1 AP1302 미응답 (2ch_same_bus)"
                command: "i2cdetect -y 1 2>/dev/null | awk 'NR>1 {for(i=2;i<=NF;i++) if ($i==\"11\" || $i==\"12\") print $i}' | sort -u | tr '\\n' ',' | sed 's/,$//'"
                expected: ""
                on_fail: "2ch_same_bus인데 i2c-1에 AP1302 응답"
          - name: "3ch"
            values:
              ".VHL_CAM.i2c2.ch0.enable": true
              ".VHL_CAM.i2c2.ch1.enable": true
              ".VHL_CAM.i2c1.ch2.enable": true
              ".VHL_CAM.i2c1.ch3.enable": false
            expect:
              channel_count: 3
            verify:
              - name: "i2c-2 dual mode (3ch → 11,12)"
                command: "i2cdetect -y 2 2>/dev/null | awk 'NR>1 {for(i=2;i<=NF;i++) if ($i==\"11\" || $i==\"12\") print $i}' | sort -u | tr '\\n' ',' | sed 's/,$//'"
                expected: "11,12"
                on_fail: "3ch 기대 i2c-2 dual(11,12)이 아님"
              - name: "i2c-1 single mode (3ch ch2 only → 3c)"
                command: "i2cdetect -y 1 2>/dev/null | awk 'NR>1 {for(i=2;i<=NF;i++) if ($i==\"11\" || $i==\"12\") print $i}' | sort -u | tr '\\n' ',' | sed 's/,$//'"
                expected: ""
                on_fail: "3ch 기대 i2c-1 single인데 0x11 또는 0x12가 응답함"
          - name: "4ch"
            values:
              ".VHL_CAM.i2c2.ch0.enable": true
              ".VHL_CAM.i2c2.ch1.enable": true
              ".VHL_CAM.i2c1.ch2.enable": true
              ".VHL_CAM.i2c1.ch3.enable": true
            expect:
