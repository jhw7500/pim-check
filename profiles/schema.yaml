              ".VHL_CAM.i2c2.ch0.enable": true
              ".VHL_CAM.i2c2.ch1.enable": true
              ".VHL_CAM.i2c1.ch2.enable": true
              ".VHL_CAM.i2c1.ch3.enable": false
            expect:
              channel_count: 3
          - name: "4ch"
            values:
              ".VHL_CAM.i2c2.ch0.enable": true
              ".VHL_CAM.i2c2.ch1.enable": true
              ".VHL_CAM.i2c1.ch2.enable": true
              ".VHL_CAM.i2c1.ch3.enable": true
            expect:
              channel_count: 4
          - name: "1ch_ch3"
            values:
              ".VHL_CAM.i2c2.ch0.enable": false
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": true
            expect:
              channel_count: 1
          - name: "2ch_i2c1"
            values:
              ".VHL_CAM.i2c2.ch0.enable": false
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch2.enable": true
              ".VHL_CAM.i2c1.ch3.enable": true
            expect:
              channel_count: 2
          - name: "3ch_no_ch0"
