                command: "sleep 75 && F=$(find /mnt/sd_cam -type f -name '*ch0*.mp4' -mmin -2 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); [ -n \"$F\" ] && BR=$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$BR\" | awk '{k=$1/1000; if (k>=1024 && k<=4505) print \"OK\"; else printf \"FAIL:%.0fkbps\\n\", k}' || echo FAIL:NO_FILE"
