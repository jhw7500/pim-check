# profiles/schema.yaml — 설정 축 정의 + 기대값 규칙
# pim-check 테스트 케이스 자동 생성용
# 실제 타겟 JSON 구조 확인 완료 (2026-04-05)
version: 1

sources:
  edgeconf:
    path: /root/shared_v/edgeconf_pim.json
    axes:
      resolution:
        keys:
          ".VHL_CAM.cam_width": [1280, 1920]
          ".VHL_CAM.cam_height": [720, 1080]
        combinations:
          - name: "720p"
            values:
              ".VHL_CAM.cam_width": 1280
              ".VHL_CAM.cam_height": 720
          - name: "fhd"
            values:
              ".VHL_CAM.cam_width": 1920
              ".VHL_CAM.cam_height": 1080

      channels:
        keys:
          ".VHL_CAM.i2c1.ch2.enable": [true, false]
          ".VHL_CAM.i2c1.ch3.enable": [true, false]
        combinations:
          - name: "2ch"
            values:
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": false
            expect:
              channel_count: 2
          - name: "4ch"
            values:
              ".VHL_CAM.i2c1.ch2.enable": true
              ".VHL_CAM.i2c1.ch3.enable": true
            expect:
              channel_count: 4

      fps:
        keys:
          ".VHL_CAM.fps": [15, 30]
        combinations:
          - name: "15fps"
            values:
              ".VHL_CAM.fps": 15
          - name: "30fps"
            values:
              ".VHL_CAM.fps": 30

      hflip:
        keys:
          ".VHL_CAM.i2c2.ch0.hflip": [true, false]
        combinations:
          - name: "hflip_off"
            values:
              ".VHL_CAM.i2c2.ch0.hflip": false
          - name: "hflip_on"
            values:
              ".VHL_CAM.i2c2.ch0.hflip": true

      capture:
        keys:
          ".VHL_CAM.capture.enable": [true, false]
        combinations:
          - name: "cap_off"
            values:
              ".VHL_CAM.capture.enable": false
          - name: "cap_on"
            values:
              ".VHL_CAM.capture.enable": true

      recording_time:
        keys:
          ".VHL_CAM.recording_time": [1, 2, 5]
        combinations:
          - name: "rec1m"
            values:
              ".VHL_CAM.recording_time": 1
            verify:
              - name: "녹화파일 생성 확인 (1분)"
                command: "sleep 70 && find /mnt/sd_cam -name '*.mp4' -o -name '*.ts' 2>/dev/null | head -1 | xargs -I{} stat --printf='%s' {} 2>/dev/null || echo 0"
                expected_min: 1000
                on_fail: "1분 녹화파일 미생성 또는 크기 이상"
          - name: "rec2m"
            values:
              ".VHL_CAM.recording_time": 2
            verify:
              - name: "녹화파일 생성 확인 (2분)"
                command: "sleep 130 && find /mnt/sd_cam -name '*.mp4' -o -name '*.ts' 2>/dev/null | head -1 | xargs -I{} stat --printf='%s' {} 2>/dev/null || echo 0"
                expected_min: 1000
                on_fail: "2분 녹화파일 미생성 또는 크기 이상"
          - name: "rec5m"
            values:
              ".VHL_CAM.recording_time": 5
            verify:
              - name: "녹화파일 생성 확인 (5분)"
                command: "sleep 310 && find /mnt/sd_cam -name '*.mp4' -o -name '*.ts' 2>/dev/null | head -1 | xargs -I{} stat --printf='%s' {} 2>/dev/null || echo 0"
                expected_min: 1000
                on_fail: "5분 녹화파일 미생성 또는 크기 이상"

      muxer:
        keys:
          ".VHL_CAM.muxer": ["mp4", "ts"]
        combinations:
          - name: "mux_mp4"
            values:
              ".VHL_CAM.muxer": "mp4"
            verify:
              - name: "MP4 파일 생성 확인"
                command: "sleep 70 && find /mnt/sd_cam -name '*.mp4' -mmin -2 2>/dev/null | wc -l | tr -d ' '"
                expected_min: 1
                on_fail: "MP4 파일 미생성"
          - name: "mux_ts"
            values:
              ".VHL_CAM.muxer": "ts"
            verify:
              - name: "TS 파일 생성 확인"
                command: "sleep 70 && find /mnt/sd_cam -name '*.ts' -mmin -2 2>/dev/null | wc -l | tr -d ' '"
                expected_min: 1
                on_fail: "TS 파일 미생성"

      bitrate:
        keys:
          ".VHL_CAM.i2c2.ch0.bps": [[1024, 512], [2048, 1024], [4096, 2048]]
        combinations:
          - name: "bps_low"
            values:
              ".VHL_CAM.i2c2.ch0.bps": [1024, 512]
          - name: "bps_default"
            values:
              ".VHL_CAM.i2c2.ch0.bps": [2048, 1024]
          - name: "bps_high"
            values:
              ".VHL_CAM.i2c2.ch0.bps": [4096, 2048]

      vflip_ch0:
        keys:
          ".VHL_CAM.i2c2.ch0.vflip": [true, false]
        combinations:
          - name: "vflip_off"
            values:
              ".VHL_CAM.i2c2.ch0.vflip": false
            verify:
              - name: "vflip 설정 반영 확인"
                command: "jq -r '.VHL_CAM.i2c2.ch0.vflip' /root/shared_v/edgeconf_pim.json"
                expected: "false"
                on_fail: "vflip 설정 미반영"
          - name: "vflip_on"
            values:
              ".VHL_CAM.i2c2.ch0.vflip": true
            verify:
              - name: "vflip 설정 반영 확인"
                command: "jq -r '.VHL_CAM.i2c2.ch0.vflip' /root/shared_v/edgeconf_pim.json"
                expected: "true"
                on_fail: "vflip 설정 미반영"

      ae_ch0:
        keys:
          ".VHL_CAM.i2c2.ch0.ae_on": [true, false]
        combinations:
          - name: "ae_on"
            values:
              ".VHL_CAM.i2c2.ch0.ae_on": true
            verify:
              - name: "AE 설정 반영 확인"
                command: "jq -r '.VHL_CAM.i2c2.ch0.ae_on' /root/shared_v/edgeconf_pim.json"
                expected: "true"
                on_fail: "AE 설정 미반영"
          - name: "ae_off"
            values:
              ".VHL_CAM.i2c2.ch0.ae_on": false
            verify:
              - name: "AE 설정 반영 확인"
                command: "jq -r '.VHL_CAM.i2c2.ch0.ae_on' /root/shared_v/edgeconf_pim.json"
                expected: "false"
                on_fail: "AE 설정 미반영"

      channel_combo:
        keys:
          ".VHL_CAM.i2c2.ch0.enable": [true, false]
          ".VHL_CAM.i2c2.ch1.enable": [true, false]
          ".VHL_CAM.i2c1.ch2.enable": [true, false]
          ".VHL_CAM.i2c1.ch3.enable": [true, false]
        combinations:
          - name: "0ch"
            values:
              ".VHL_CAM.i2c2.ch0.enable": false
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": false
            expect:
              channel_count: 0
          - name: "1ch_ch0"
            values:
              ".VHL_CAM.i2c2.ch0.enable": true
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": false
            expect:
              channel_count: 1
          - name: "1ch_ch2"
            values:
              ".VHL_CAM.i2c2.ch0.enable": false
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch2.enable": true
              ".VHL_CAM.i2c1.ch3.enable": false
            expect:
              channel_count: 1
          - name: "2ch_cross"
            values:
              ".VHL_CAM.i2c2.ch0.enable": true
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch2.enable": true
              ".VHL_CAM.i2c1.ch3.enable": false
            expect:
              channel_count: 2
          - name: "2ch_same_bus"
            values:
              ".VHL_CAM.i2c2.ch0.enable": true
              ".VHL_CAM.i2c2.ch1.enable": true
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": false
            expect:
              channel_count: 2
          - name: "3ch"
            values:
              ".VHL_CAM.i2c2.ch0.enable": true
              ".VHL_CAM.i2c2.ch1.enable": true
              ".VHL_CAM.i2c1.ch2.enable": true
              ".VHL_CAM.i2c1.ch3.enable": false
            expect:
              channel_count: 3
          - name: "4ch"
            values:
              ".VHL_CAM.i2c2.ch0.enable": true
              ".VHL_CAM.i2c2.ch1.enable": true
              ".VHL_CAM.i2c1.ch2.enable": true
              ".VHL_CAM.i2c1.ch3.enable": true
            expect:
              channel_count: 4
          - name: "1ch_ch3"
            values:
              ".VHL_CAM.i2c2.ch0.enable": false
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": true
            expect:
              channel_count: 1
          - name: "2ch_i2c1"
            values:
              ".VHL_CAM.i2c2.ch0.enable": false
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch2.enable": true
              ".VHL_CAM.i2c1.ch3.enable": true
            expect:
              channel_count: 2
          - name: "3ch_no_ch0"
            values:
              ".VHL_CAM.i2c2.ch0.enable": false
              ".VHL_CAM.i2c2.ch1.enable": true
              ".VHL_CAM.i2c1.ch2.enable": true
              ".VHL_CAM.i2c1.ch3.enable": true
            expect:
              channel_count: 3

  ord_vcm:
    path: /root/shared_v/ord_vcm_conf.json
    axes:
      ord_disk:
        keys:
          ".ORD.disk_manage": [true, false]
          ".ORD.event_auto_remove": [true, false]
        combinations:
          - name: "disk_on"
            values:
              ".ORD.disk_manage": true
              ".ORD.event_auto_remove": true
          - name: "disk_off"
            values:
              ".ORD.disk_manage": false
              ".ORD.event_auto_remove": false

      vcm_srt:
        keys:
          ".VCM.srt_enable": [true, false]
        combinations:
          - name: "srt_on"
            values:
              ".VCM.srt_enable": true
          - name: "srt_off"
            values:
              ".VCM.srt_enable": false

# 기대값 계산 규칙
# 우선순위: 정확한 키 매칭 > 와일드카드 매칭 (fnmatch 스타일)
# 와일드카드 충돌 시 가장 구체적인 패턴이 우선 (* 개수가 적은 것)
expectations:
  cpu:
    gst_range:
      # resolution + channels + fps 조합
      "720p+2ch+15fps": [5, 60]
      "720p+2ch+30fps": [10, 70]
      "720p+4ch+15fps": [20, 80]
      "720p+4ch+30fps": [30, 90]
      "fhd+2ch+15fps": [20, 80]
      "fhd+2ch+30fps": [30, 90]
      "fhd+4ch+15fps": [50, 95]
      "fhd+4ch+30fps": [60, 100]
      # ord_vcm 조합은 CPU 무관
  thermal:
    warn_temp_c:
      # shutdown=95°C 기준, warn=88°C
      "fhd+*": 88
  cam_state:
    dir: /tmp/cam_state
    expected_state: healthy
    max_streak: 0
  recording:
    from_axis: "channels.expect.channel_count"
  stabilize_sec:
    "720p+2ch+*": 30
    "720p+4ch+*": 40
    "fhd+2ch+*": 40
    "fhd+4ch+*": 60
    # ord_vcm은 재부팅 불필요
    "disk_*": 0
    "srt_*": 0

# 조합 생성 규칙
# edgeconf: resolution x channels x fps = 8 조합
# ord_vcm: ord_disk x vcm_srt = 4 조합 (별도 그룹)
generation:
  groups:
    - name: edgeconf_camera
      source: edgeconf
      cross: [resolution, channels, fps]
      output_dir: profiles/generated
      filename_pattern: "gen_{resolution}_{channels}_{fps}.yaml"

    - name: edgeconf_hflip
      source: edgeconf
      cross: [resolution, hflip]
      output_dir: profiles/generated
      filename_pattern: "gen_{resolution}_{hflip}.yaml"

    - name: edgeconf_capture
      source: edgeconf
      cross: [resolution, capture]
      output_dir: profiles/generated
      filename_pattern: "gen_{resolution}_{capture}.yaml"

    - name: ord_vcm_config
      source: ord_vcm
      cross: [ord_disk, vcm_srt]
      output_dir: profiles/generated
      filename_pattern: "gen_ord_{ord_disk}_{vcm_srt}.yaml"
      # ord_vcm 케이스는 재부팅 불필요, 스냅샷만
      no_reboot: true

    - name: recording_time
      source: edgeconf
      cross: [resolution, recording_time]
      output_dir: profiles/generated
      filename_pattern: "gen_{resolution}_{recording_time}.yaml"

    - name: muxer_format
      source: edgeconf
      cross: [resolution, muxer]
      output_dir: profiles/generated
      filename_pattern: "gen_{resolution}_{muxer}.yaml"

    - name: bitrate_variants
      source: edgeconf
      cross: [resolution, channels, bitrate]
      output_dir: profiles/generated
      filename_pattern: "gen_{resolution}_{channels}_{bitrate}.yaml"

    - name: flip_variants
      source: edgeconf
      cross: [resolution, vflip_ch0]
      output_dir: profiles/generated
      filename_pattern: "gen_{resolution}_{vflip_ch0}.yaml"

    - name: ae_variants
      source: edgeconf
      cross: [resolution, ae_ch0]
      output_dir: profiles/generated
      filename_pattern: "gen_{resolution}_{ae_ch0}.yaml"

    - name: channel_combo
      source: edgeconf
      cross: [resolution, channel_combo]
      output_dir: profiles/generated
      filename_pattern: "gen_{resolution}_{channel_combo}.yaml"
