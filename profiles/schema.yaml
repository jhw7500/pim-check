                expected: "auto"
                on_fail: "edgeconf awb_ch2 미반영"
              - name: "ch2 AWB_CTRL 레지스터 확인 (AUTO)"
                command: "(i2ctransfer -f -y 1 w2@0x11 0x51 0x00 r2 2>/dev/null || i2ctransfer -f -y 1 w2@0x3c 0x51 0x00 r2 2>/dev/null) | tr -d ' '"
                expected: "0x110x5f"
                on_fail: "ch2 ISP AWB_CTRL 레지스터에 AUTO 미반영"
          - name: "awb_off"
            values:
              ".VHL_CAM.i2c1.ch2.enable": true
              ".VHL_CAM.i2c1.ch2.awb": "off"
            verify:
              - name: "edgeconf awb_ch2 반영"
                command: "jq -r '.VHL_CAM.i2c1.ch2.awb' /root/shared_v/edgeconf_pim.json"
                expected: "off"
                on_fail: "edgeconf awb_ch2 미반영"
              - name: "ch2 AWB_CTRL 레지스터 확인 (OFF)"
                command: "(i2ctransfer -f -y 1 w2@0x11 0x51 0x00 r2 2>/dev/null || i2ctransfer -f -y 1 w2@0x3c 0x51 0x00 r2 2>/dev/null) | tr -d ' '"
                expected: "0x110x50"
                on_fail: "ch2 ISP AWB_CTRL 레지스터에 OFF 미반영"

      awb_ch3:
        keys:
          ".VHL_CAM.i2c1.ch3.awb": ["auto", "off"]
        combinations:
          - name: "awb_auto"
            values:
              ".VHL_CAM.i2c1.ch3.enable": true
              ".VHL_CAM.i2c1.ch3.awb": "auto"
            verify:
              - name: "edgeconf awb_ch3 반영"
                command: "jq -r '.VHL_CAM.i2c1.ch3.awb' /root/shared_v/edgeconf_pim.json"
