                on_fail: "5분 녹화 duration 범위(295~305s) 벗어남"

      # muxer: mp4/ts 전환 시 대상 확장자만 생성되고 반대 확장자는 없어야 함(exclusivity).
      # FINDING #4 정정:
      #   - ch0만 enable로 state isolation
      #   - 반대 확장자 배타 검증 추가(count == 0)
      muxer:
        keys:
          ".VHL_CAM.muxer": ["mp4", "ts"]
        combinations:
          - name: "mux_mp4"
            values:
              ".VHL_CAM.muxer": "mp4"
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": false
              ".VHL_CAM.i2c2.ch0.enable": true
            verify:
              - name: "SD 쓰기 가능 확인"
                command: "test -w /mnt/sd_cam && echo OK || echo FAIL:NO_SD"
                expected: "OK"
                on_fail: "SD 미마운트 또는 쓰기 불가"
              - name: "MP4 파일 생성 확인"
                command: "sleep 70 && find /mnt/sd_cam -type f -name '*.mp4' -mmin -2 2>/dev/null | wc -l | tr -d ' '"
                expected_min: 1
                on_fail: "MP4 파일 미생성"
              - name: "TS 파일 없음 확인 (배타)"
                command: "find /mnt/sd_cam -type f -name '*.ts' -mmin -2 2>/dev/null | wc -l | tr -d ' '"
                expected: "0"
                on_fail: "muxer=mp4 설정인데 TS 파일이 함께 생성됨"
          - name: "mux_ts"
            values:
              ".VHL_CAM.muxer": "ts"
              ".VHL_CAM.i2c2.ch1.enable": false
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": false
              ".VHL_CAM.i2c2.ch0.enable": true
            verify:
