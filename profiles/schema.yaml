# profiles/schema.yaml — 설정 축 정의 + 기대값 규칙
# pim-check 테스트 케이스 자동 생성용
# 실제 타겟 JSON 구조 확인 완료 (2026-04-05)
version: 1

sources:
  edgeconf:
    path: /root/shared_v/edgeconf_pim.json
    axes:
      resolution:
        keys:
          ".VHL_CAM.cam_width": [1280, 1920]
          ".VHL_CAM.cam_height": [720, 1080]
        combinations:
          - name: "720p"
            values:
              ".VHL_CAM.cam_width": 1280
              ".VHL_CAM.cam_height": 720
          - name: "fhd"
            values:
              ".VHL_CAM.cam_width": 1920
              ".VHL_CAM.cam_height": 1080

      channels:
        keys:
          ".VHL_CAM.i2c1.ch2.enable": [true, false]
          ".VHL_CAM.i2c1.ch3.enable": [true, false]
        combinations:
          - name: "2ch"
            values:
              ".VHL_CAM.i2c1.ch2.enable": false
              ".VHL_CAM.i2c1.ch3.enable": false
            expect:
              channel_count: 2
          - name: "4ch"
            values:
              ".VHL_CAM.i2c1.ch2.enable": true
              ".VHL_CAM.i2c1.ch3.enable": true
            expect:
              channel_count: 4

      fps:
        keys:
          ".VHL_CAM.fps": [15, 30]
        combinations:
          - name: "15fps"
            values:
              ".VHL_CAM.fps": 15
          - name: "30fps"
            values:
              ".VHL_CAM.fps": 30

      # hflip (ch0, i2c-2 bus, ROTATION 0x100c bit0)
      # dual mode(ch0+ch1 enabled): 0x11, single mode: 0x3c
      hflip:
        keys:
          ".VHL_CAM.i2c2.ch0.hflip": [true, false]
        combinations:
          - name: "hflip_off"
            values:
              ".VHL_CAM.i2c2.ch0.hflip": false
            verify:
              - name: "ch0 ROTATION 레지스터 확인 (hflip off)"
                command: "(i2ctransfer -f -y 2 w2@0x11 0x10 0x0c r2 2>/dev/null || i2ctransfer -f -y 2 w2@0x3c 0x10 0x0c r2 2>/dev/null) | tr -d ' '"
                expected: "0x000x00"
                on_fail: "ch0 ISP ROTATION 레지스터에 hflip off 미반영"
          - name: "hflip_on"
            values:
              ".VHL_CAM.i2c2.ch0.hflip": true
            verify:
              - name: "ch0 ROTATION 레지스터 확인 (hflip on, bit0)"
                command: "(i2ctransfer -f -y 2 w2@0x11 0x10 0x0c r2 2>/dev/null || i2ctransfer -f -y 2 w2@0x3c 0x10 0x0c r2 2>/dev/null) | tr -d ' '"
                expected: "0x000x01"
                on_fail: "ch0 ISP ROTATION 레지스터에 hflip on 미반영"

      capture:
        keys:
          ".VHL_CAM.capture.enable": [true, false]
        combinations:
          - name: "cap_off"
            values:
              ".VHL_CAM.capture.enable": false
          - name: "cap_on"
            values:
              ".VHL_CAM.capture.enable": true

      recording_time:
        keys:
          ".VHL_CAM.recording_time": [1, 2, 5]
        combinations:
          - name: "rec1m"
            values:
              ".VHL_CAM.recording_time": 1
            verify:
              - name: "녹화파일 생성 확인 (1분)"
                command: "sleep 70 && find /mnt/sd_cam -name '*.mp4' -o -name '*.ts' 2>/dev/null | head -1 | xargs -I{} stat --printf='%s' {} 2>/dev/null || echo 0"
                expected_min: 1000
                on_fail: "1분 녹화파일 미생성 또는 크기 이상"
          - name: "rec2m"
            values:
              ".VHL_CAM.recording_time": 2
            verify:
              - name: "녹화파일 생성 확인 (2분)"
                command: "sleep 130 && find /mnt/sd_cam -name '*.mp4' -o -name '*.ts' 2>/dev/null | head -1 | xargs -I{} stat --printf='%s' {} 2>/dev/null || echo 0"
                expected_min: 1000
                on_fail: "2분 녹화파일 미생성 또는 크기 이상"
          - name: "rec5m"
            values:
              ".VHL_CAM.recording_time": 5
            verify:
              - name: "녹화파일 생성 확인 (5분)"
                command: "sleep 310 && find /mnt/sd_cam -name '*.mp4' -o -name '*.ts' 2>/dev/null | head -1 | xargs -I{} stat --printf='%s' {} 2>/dev/null || echo 0"
                expected_min: 1000
                on_fail: "5분 녹화파일 미생성 또는 크기 이상"

      muxer:
        keys:
          ".VHL_CAM.muxer": ["mp4", "ts"]
        combinations:
          - name: "mux_mp4"
            values:
              ".VHL_CAM.muxer": "mp4"
            verify:
              - name: "MP4 파일 생성 확인"
                command: "sleep 70 && find /mnt/sd_cam -name '*.mp4' -mmin -2 2>/dev/null | wc -l | tr -d ' '"
                expected_min: 1
                on_fail: "MP4 파일 미생성"
          - name: "mux_ts"
            values:
              ".VHL_CAM.muxer": "ts"
            verify:
              - name: "TS 파일 생성 확인"
                command: "sleep 70 && find /mnt/sd_cam -name '*.ts' -mmin -2 2>/dev/null | wc -l | tr -d ' '"
                expected_min: 1
                on_fail: "TS 파일 미생성"

      # bitrate는 gstApp이 edgeconf에서 읽어 gstreamer encoder에 전달
      # AP1302 ISP는 bitrate 무관 (encoder 영역)
      # 검증: edgeconf 반영만 확인 (실시간 파일크기 기반 검증은 녹화 완료 후 별도 수행)
      bitrate:
        keys:
          ".VHL_CAM.i2c2.ch0.bps": [[1024, 512], [2048, 1024], [4096, 2048]]
        combinations:
          - name: "bps_low"
            values:
              ".VHL_CAM.i2c2.ch0.bps": [1024, 512]
            verify:
              - name: "edgeconf bps high 반영"
                command: "jq -r '.VHL_CAM.i2c2.ch0.bps[0]' /root/shared_v/edgeconf_pim.json"
                expected: "1024"
                on_fail: "edgeconf bps high 미반영"
              - name: "edgeconf bps low 반영"
                command: "jq -r '.VHL_CAM.i2c2.ch0.bps[1]' /root/shared_v/edgeconf_pim.json"
                expected: "512"
                on_fail: "edgeconf bps low 미반영"
          - name: "bps_default"
            values:
              ".VHL_CAM.i2c2.ch0.bps": [2048, 1024]
            verify:
              - name: "edgeconf bps high 반영"
                command: "jq -r '.VHL_CAM.i2c2.ch0.bps[0]' /root/shared_v/edgeconf_pim.json"
                expected: "2048"
                on_fail: "edgeconf bps high 미반영"
              - name: "edgeconf bps low 반영"
                command: "jq -r '.VHL_CAM.i2c2.ch0.bps[1]' /root/shared_v/edgeconf_pim.json"
                expected: "1024"
                on_fail: "edgeconf bps low 미반영"
          - name: "bps_high"
            values:
              ".VHL_CAM.i2c2.ch0.bps": [4096, 2048]
            verify:
              - name: "edgeconf bps high 반영"
                command: "jq -r '.VHL_CAM.i2c2.ch0.bps[0]' /root/shared_v/edgeconf_pim.json"
                expected: "4096"
                on_fail: "edgeconf bps high 미반영"
              - name: "edgeconf bps low 반영"
                command: "jq -r '.VHL_CAM.i2c2.ch0.bps[1]' /root/shared_v/edgeconf_pim.json"
                expected: "2048"
                on_fail: "edgeconf bps low 미반영"

      # vflip/hflip은 AP1302 ROTATION 레지스터(0x100c)로 병합 저장
      # bit0=hflip, bit1=vflip → 0x0000=없음, 0x0001=hflip, 0x0002=vflip, 0x0003=양쪽
      # 주소: dual mode(양 채널 enable)=ch0:0x11 ch1:0x12, single mode=0x3c (fallback)
      # ch0 → i2c-2, ch1 → i2c-2, ch2 → i2c-1, ch3 → i2c-1
      vflip_ch0:
        keys:
          ".VHL_CAM.i2c2.ch0.vflip": [true, false]
        combinations:
          - name: "vflip_off"
            values:
              ".VHL_CAM.i2c2.ch0.enable": true
              ".VHL_CAM.i2c2.ch0.vflip": false
            verify:
              - name: "edgeconf vflip_ch0 반영"
                command: "jq -r '.VHL_CAM.i2c2.ch0.vflip' /root/shared_v/edgeconf_pim.json"
                expected: "false"
                on_fail: "edgeconf vflip_ch0 미반영"
              - name: "ch0 ROTATION 레지스터 확인 (vflip off)"
                command: "(i2ctransfer -f -y 2 w2@0x11 0x10 0x0c r2 2>/dev/null || i2ctransfer -f -y 2 w2@0x3c 0x10 0x0c r2 2>/dev/null) | tr -d ' '"
                expected: "0x000x00"
                on_fail: "ch0 ISP ROTATION 레지스터에 vflip off 미반영"
          - name: "vflip_on"
            values:
              ".VHL_CAM.i2c2.ch0.enable": true
              ".VHL_CAM.i2c2.ch0.vflip": true
            verify:
              - name: "edgeconf vflip_ch0 반영"
                command: "jq -r '.VHL_CAM.i2c2.ch0.vflip' /root/shared_v/edgeconf_pim.json"
                expected: "true"
                on_fail: "edgeconf vflip_ch0 미반영"
              - name: "ch0 ROTATION 레지스터 확인 (vflip on, bit1)"
                command: "(i2ctransfer -f -y 2 w2@0x11 0x10 0x0c r2 2>/dev/null || i2ctransfer -f -y 2 w2@0x3c 0x10 0x0c r2 2>/dev/null) | tr -d ' '"
                expected: "0x000x02"
                on_fail: "ch0 ISP ROTATION 레지스터에 vflip on 미반영"

      # vflip_ch1: i2c-2 bus, dual=0x12, single=0x3c
      vflip_ch1:
        keys:
          ".VHL_CAM.i2c2.ch1.vflip": [true, false]
        combinations:
          - name: "vflip_off"
            values:
              ".VHL_CAM.i2c2.ch1.enable": true
              ".VHL_CAM.i2c2.ch1.vflip": false
            verify:
              - name: "edgeconf vflip_ch1 반영"
                command: "jq -r '.VHL_CAM.i2c2.ch1.vflip' /root/shared_v/edgeconf_pim.json"
                expected: "false"
                on_fail: "edgeconf vflip_ch1 미반영"
              - name: "ch1 ROTATION 레지스터 확인 (vflip off)"
                command: "(i2ctransfer -f -y 2 w2@0x12 0x10 0x0c r2 2>/dev/null || i2ctransfer -f -y 2 w2@0x3c 0x10 0x0c r2 2>/dev/null) | tr -d ' '"
                expected: "0x000x00"
                on_fail: "ch1 ISP ROTATION 레지스터에 vflip off 미반영"
          - name: "vflip_on"
            values:
              ".VHL_CAM.i2c2.ch1.enable": true
              ".VHL_CAM.i2c2.ch1.vflip": true
            verify:
              - name: "edgeconf vflip_ch1 반영"
                command: "jq -r '.VHL_CAM.i2c2.ch1.vflip' /root/shared_v/edgeconf_pim.json"
                expected: "true"
                on_fail: "edgeconf vflip_ch1 미반영"
              - name: "ch1 ROTATION 레지스터 확인 (vflip on, bit1)"
                command: "(i2ctransfer -f -y 2 w2@0x12 0x10 0x0c r2 2>/dev/null || i2ctransfer -f -y 2 w2@0x3c 0x10 0x0c r2 2>/dev/null) | tr -d ' '"
                expected: "0x000x02"
                on_fail: "ch1 ISP ROTATION 레지스터에 vflip on 미반영"

      # vflip_ch2: i2c-1 bus, dual=0x11, single=0x3c
      vflip_ch2:
        keys:
          ".VHL_CAM.i2c1.ch2.vflip": [true, false]
        combinations:
          - name: "vflip_off"
            values:
              ".VHL_CAM.i2c1.ch2.enable": true
              ".VHL_CAM.i2c1.ch2.vflip": false
            verify:
              - name: "edgeconf vflip_ch2 반영"
                command: "jq -r '.VHL_CAM.i2c1.ch2.vflip' /root/shared_v/edgeconf_pim.json"
                expected: "false"
                on_fail: "edgeconf vflip_ch2 미반영"
              - name: "ch2 ROTATION 레지스터 확인 (vflip off)"
                command: "(i2ctransfer -f -y 1 w2@0x11 0x10 0x0c r2 2>/dev/null || i2ctransfer -f -y 1 w2@0x3c 0x10 0x0c r2 2>/dev/null) | tr -d ' '"
                expected: "0x000x00"
                on_fail: "ch2 ISP ROTATION 레지스터에 vflip off 미반영"
          - name: "vflip_on"
            values:
              ".VHL_CAM.i2c1.ch2.enable": true
              ".VHL_CAM.i2c1.ch2.vflip": true
            verify:
              - name: "edgeconf vflip_ch2 반영"
                command: "jq -r '.VHL_CAM.i2c1.ch2.vflip' /root/shared_v/edgeconf_pim.json"
                expected: "true"
                on_fail: "edgeconf vflip_ch2 미반영"
              - name: "ch2 ROTATION 레지스터 확인 (vflip on, bit1)"
                command: "(i2ctransfer -f -y 1 w2@0x11 0x10 0x0c r2 2>/dev/null || i2ctransfer -f -y 1 w2@0x3c 0x10 0x0c r2 2>/dev/null) | tr -d ' '"
                expected: "0x000x02"
                on_fail: "ch2 ISP ROTATION 레지스터에 vflip on 미반영"

      # vflip_ch3: i2c-1 bus, dual=0x12, single=0x3c
      vflip_ch3:
        keys:
          ".VHL_CAM.i2c1.ch3.vflip": [true, false]
        combinations:
          - name: "vflip_off"
            values:
              ".VHL_CAM.i2c1.ch3.enable": true
              ".VHL_CAM.i2c1.ch3.vflip": false
            verify:
              - name: "edgeconf vflip_ch3 반영"
                command: "jq -r '.VHL_CAM.i2c1.ch3.vflip' /root/shared_v/edgeconf_pim.json"
                expected: "false"
                on_fail: "edgeconf vflip_ch3 미반영"
              - name: "ch3 ROTATION 레지스터 확인 (vflip off)"
                command: "(i2ctransfer -f -y 1 w2@0x12 0x10 0x0c r2 2>/dev/null || i2ctransfer -f -y 1 w2@0x3c 0x10 0x0c r2 2>/dev/null) | tr -d ' '"
                expected: "0x000x00"
                on_fail: "ch3 ISP ROTATION 레지스터에 vflip off 미반영"
          - name: "vflip_on"
            values:
              ".VHL_CAM.i2c1.ch3.enable": true
              ".VHL_CAM.i2c1.ch3.vflip": true
            verify:
              - name: "edgeconf vflip_ch3 반영"
                command: "jq -r '.VHL_CAM.i2c1.ch3.vflip' /root/shared_v/edgeconf_pim.json"
                expected: "true"
                on_fail: "edgeconf vflip_ch3 미반영"
              - name: "ch3 ROTATION 레지스터 확인 (vflip on, bit1)"
                command: "(i2ctransfer -f -y 1 w2@0x12 0x10 0x0c r2 2>/dev/null || i2ctransfer -f -y 1 w2@0x3c 0x10 0x0c r2 2>/dev/null) | tr -d ' '"
                expected: "0x000x02"
                on_fail: "ch3 ISP ROTATION 레지스터에 vflip on 미반영"

      # AE_CTRL 레지스터 (0x5002): AUTO=0x0299, MANUAL=0x0290
      ae_ch0:
        keys:
          ".VHL_CAM.i2c2.ch0.ae_on": [true, false]
        combinations:
          - name: "ae_on"
            values:
              ".VHL_CAM.i2c2.ch0.enable": true
              ".VHL_CAM.i2c2.ch0.ae_on": true
            verify:
              - name: "edgeconf ae_ch0 반영"
                command: "jq -r '.VHL_CAM.i2c2.ch0.ae_on' /root/shared_v/edgeconf_pim.json"
                expected: "true"
                on_fail: "edgeconf ae_ch0 미반영"
              - name: "ch0 AE_CTRL 레지스터 확인 (AUTO)"
                command: "(i2ctransfer -f -y 2 w2@0x11 0x50 0x02 r2 2>/dev/null || i2ctransfer -f -y 2 w2@0x3c 0x50 0x02 r2 2>/dev/null) | tr -d ' '"
                expected: "0x020x99"
                on_fail: "ch0 ISP AE_CTRL 레지스터에 AUTO 미반영"
          - name: "ae_off"
            values:
              ".VHL_CAM.i2c2.ch0.enable": true
              ".VHL_CAM.i2c2.ch0.ae_on": false
            verify:
              - name: "edgeconf ae_ch0 반영"
                command: "jq -r '.VHL_CAM.i2c2.ch0.ae_on' /root/shared_v/edgeconf_pim.json"
                expected: "false"
                on_fail: "edgeconf ae_ch0 미반영"
              - name: "ch0 AE_CTRL 레지스터 확인 (MANUAL)"
                command: "(i2ctransfer -f -y 2 w2@0x11 0x50 0x02 r2 2>/dev/null || i2ctransfer -f -y 2 w2@0x3c 0x50 0x02 r2 2>/dev/null) | tr -d ' '"
                expected: "0x020x90"
                on_fail: "ch0 ISP AE_CTRL 레지스터에 MANUAL 미반영"

      # ae_ch1: i2c-2 bus, dual=0x12, single=0x3c
      ae_ch1:
        keys:
          ".VHL_CAM.i2c2.ch1.ae_on": [true, false]
        combinations:
          - name: "ae_on"
            values:
              ".VHL_CAM.i2c2.ch1.enable": true
              ".VHL_CAM.i2c2.ch1.ae_on": true
            verify:
              - name: "edgeconf ae_ch1 반영"
                command: "jq -r '.VHL_CAM.i2c2.ch1.ae_on' /root/shared_v/edgeconf_pim.json"
                expected: "true"
                on_fail: "edgeconf ae_ch1 미반영"
              - name: "ch1 AE_CTRL 레지스터 확인 (AUTO)"
                command: "(i2ctransfer -f -y 2 w2@0x12 0x50 0x02 r2 2>/dev/null || i2ctransfer -f -y 2 w2@0x3c 0x50 0x02 r2 2>/dev/null) | tr -d ' '"
                expected: "0x020x99"
                on_fail: "ch1 ISP AE_CTRL 레지스터에 AUTO 미반영"
          - name: "ae_off"
            values:
              ".VHL_CAM.i2c2.ch1.enable": true
              ".VHL_CAM.i2c2.ch1.ae_on": false
            verify:
              - name: "edgeconf ae_ch1 반영"
                command: "jq -r '.VHL_CAM.i2c2.ch1.ae_on' /root/shared_v/edgeconf_pim.json"
                expected: "false"
                on_fail: "edgeconf ae_ch1 미반영"
              - name: "ch1 AE_CTRL 레지스터 확인 (MANUAL)"
                command: "(i2ctransfer -f -y 2 w2@0x12 0x50 0x02 r2 2>/dev/null || i2ctransfer -f -y 2 w2@0x3c 0x50 0x02 r2 2>/dev/null) | tr -d ' '"
                expected: "0x020x90"
                on_fail: "ch1 ISP AE_CTRL 레지스터에 MANUAL 미반영"

      # ae_ch2: i2c-1 bus, dual=0x11, single=0x3c
      ae_ch2:
        keys:
          ".VHL_CAM.i2c1.ch2.ae_on": [true, false]
        combinations:
          - name: "ae_on"
            values:
              ".VHL_CAM.i2c1.ch2.enable": true
              ".VHL_CAM.i2c1.ch2.ae_on": true
            verify:
              - name: "edgeconf ae_ch2 반영"
                command: "jq -r '.VHL_CAM.i2c1.ch2.ae_on' /root/shared_v/edgeconf_pim.json"
                expected: "true"
                on_fail: "edgeconf ae_ch2 미반영"
              - name: "ch2 AE_CTRL 레지스터 확인 (AUTO)"
                command: "(i2ctransfer -f -y 1 w2@0x11 0x50 0x02 r2 2>/dev/null || i2ctransfer -f -y 1 w2@0x3c 0x50 0x02 r2 2>/dev/null) | tr -d ' '"
                expected: "0x020x99"
                on_fail: "ch2 ISP AE_CTRL 레지스터에 AUTO 미반영"
          - name: "ae_off"
            values:
              ".VHL_CAM.i2c1.ch2.enable": true
              ".VHL_CAM.i2c1.ch2.ae_on": false
            verify:
              - name: "edgeconf ae_ch2 반영"
                command: "jq -r '.VHL_CAM.i2c1.ch2.ae_on' /root/shared_v/edgeconf_pim.json"
                expected: "false"
                on_fail: "edgeconf ae_ch2 미반영"
              - name: "ch2 AE_CTRL 레지스터 확인 (MANUAL)"
                command: "(i2ctransfer -f -y 1 w2@0x11 0x50 0x02 r2 2>/dev/null || i2ctransfer -f -y 1 w2@0x3c 0x50 0x02 r2 2>/dev/null) | tr -d ' '"
                expected: "0x020x90"
                on_fail: "ch2 ISP AE_CTRL 레지스터에 MANUAL 미반영"

      # ae_ch3: i2c-1 bus, dual=0x12, single=0x3c
      ae_ch3:
        keys:
          ".VHL_CAM.i2c1.ch3.ae_on": [true, false]
        combinations:
          - name: "ae_on"
            values:
              ".VHL_CAM.i2c1.ch3.enable": true
              ".VHL_CAM.i2c1.ch3.ae_on": true
            verify:
              - name: "edgeconf ae_ch3 반영"
                command: "jq -r '.VHL_CAM.i2c1.ch3.ae_on' /root/shared_v/edgeconf_pim.json"
                expected: "true"
                on_fail: "edgeconf ae_ch3 미반영"
              - name: "ch3 AE_CTRL 레지스터 확인 (AUTO)"
                command: "(i2ctransfer -f -y 1 w2@0x12 0x50 0x02 r2 2>/dev/null || i2ctransfer -f -y 1 w2@0x3c 0x50 0x02 r2 2>/dev/null) | tr -d ' '"
                expected: "0x020x99"
                on_fail: "ch3 ISP AE_CTRL 레지스터에 AUTO 미반영"
          - name: "ae_off"
            values:
