# base.yaml — 공통 기본값 (모든 케이스가 상속)
target:
  host: 192.168.0.5
  user: root
  password: root

monitor:
  duration_sec: 300
  interval_sec: 5

checks:
  processes:
    required:
      - gstApp
      - BG_Check_for_pim
      - chk_cam_operate
    optional:
      - ord
      - vcm

  cam_state:
    dir: /tmp/cam_state
    valid_states:
      - healthy
      - degraded
      - recovering
      - failed
    expected_state: healthy
    max_streak: 0

  legacy_files:
    must_not_exist:
      - /tmp/bg_cam_err_streak
      - /tmp/pim_cam_start_ts
      - /tmp/cam_state.json

  cpu:
    bg_check_max_pct: 3.0
    gst_range: [0, 400]  # multi-core 합산 가능 (4 cores × 100%)

  thermal:
    max_temp_c: 93
    warn_temp_c: 88

  jq:
    max_forks_per_sample: 2

  recording:
    expected_channels: null
    session_progress: null

  logs:
    error_patterns:
      - "kernel panic"
      - "Oops"
      - "oom-kill"
      - "CAM_STATE.*invalid"

# 체크별 재시도 횟수 (SSH 에러 시)
retry_policy:
  process: 2
  cam_state: 2
  thermal: 0
  recording: 1
  custom_commands: 1

# 알려진 이슈: FAIL 대신 WARN으로 표시
known_issues:
  - check: thermal
    reason_contains: "Temperature"
    label: "HW cooling issue (ISSUES.md #4)"
