# Fault: CPU 이상 사용량 감지
# gstApp 또는 BG_Check의 CPU가 비정상적으로 높거나 낮은 상태
name: "Fault: High CPU"
description: "CPU 사용량 이상 감지 (범위 벗어남)"

checks:
  cpu:
    bg_check_max_pct: 2.0
    gst_range: [20, 320]

  thermal:
    max_temp_c: 80
    warn_temp_c: 75

  custom_commands:
    - name: "System load average"
      command: "cat /proc/loadavg | awk '{print $1}'"
      expected_min: 0
      on_fail: "Cannot read system load"

    - name: "No OOM kills"
      command: "I=$(cat /proc/sys/kernel/random/boot_id 2>/dev/null); BOOT=$(awk -v i=\"$I\" 'NR==1{a=$0} NR==2 && $0==i{print a}' /tmp/pim_check_anchor 2>/dev/null); [ -z \"$BOOT\" ] && BOOT=$(uptime -s); grep -aiE 'oom-kill|out of memory' /var/log/cantops/kern.log 2>/dev/null | awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt' | wc -l"
      expected: "0"
      on_fail: "OOM killer has been triggered"
