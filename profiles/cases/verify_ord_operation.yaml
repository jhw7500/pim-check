# ORD 동작 검증
# OHT Recording Daemon이 정상적으로 동작하는지 확인
name: "Verify: ORD Operation"
description: "ORD 프로세스 동작, OHT 통신, 디스크 관리 검증"

tags: [ord, read_only]

monitor:
  duration_sec: 0

checks:
  processes:
    required:
      - gstApp
      - chk_cam_operate
    optional:
      - ord
      - vcm

  custom_commands:
    # === ORD 프로세스 상태 ===
    - name: "ORD 프로세스 실행 중"
      command: "pgrep -x ord > /dev/null && echo RUNNING || echo STOPPED"
      expected: "RUNNING"
      on_fail: "ORD 프로세스 미실행"

    - name: "ORD 설정 포트 리슨"
      command: >-
        P=$(jq -er '.ORD.port_num | tonumber | select(. >= 1 and . <= 65535 and . == floor)' /root/shared_v/ord_vcm_conf.json 2>/dev/null) || { echo INVALID_PORT; exit 0; }; ss -H -tln 2>/dev/null | awk -v p=":$P" '$4 ~ (p "$") {n++} END {print n+0}'
      expected_min: 1
      on_fail: "ORD 설정 포트가 리슨하지 않음 또는 잘못된 포트 설정"

    # expected_min: 0 은 출력이 어떤 값이어도 PASS 이므로 실제 liveness 확인으로 교체.
    - name: "ORD PID stable over 2s"
      command: "P=$(pgrep -x ord | head -1); [ -n \"$P\" ] && sleep 2 && kill -0 \"$P\" 2>/dev/null && echo STABLE || echo UNSTABLE"
      expected: "STABLE"
      on_fail: "ORD 프로세스가 2초 사이에 종료되거나 PID가 유효하지 않음"

    # === ORD 디스크 관리 ===
    - name: "disk_manage 활성화 확인"
      command: "jq '.ORD.disk_manage' /root/shared_v/ord_vcm_conf.json"
      expected: "true"
      on_fail: "ORD 디스크 관리 비활성화"

    - name: "disk_limit_per 설정 확인"
      command: "jq '.ORD.disk_limit_per' /root/shared_v/ord_vcm_conf.json"
      expected_min: 80
      expected_max: 100
      on_fail: "ORD 디스크 제한 비율이 80~100% 범위 밖"

    # === OHT 통신 포트 ===
    - name: "ORD TCP 연결 가능"
      command: >-
        P=$(jq -er '.ORD.port_num | tonumber | select(. >= 1 and . <= 65535 and . == floor)' /root/shared_v/ord_vcm_conf.json 2>/dev/null) || { echo INVALID_PORT; exit 0; }; timeout 3 bash -c ": </dev/tcp/127.0.0.1/$P" 2>/dev/null && echo OK || echo FAIL
      expected: "OK"
      on_fail: "ORD 설정 TCP 포트 연결 불가 또는 잘못된 포트 설정"

    # === edgeconf event_auto_remove 일관성 ===
    - name: "edgeconf↔ord event_auto_remove 일치"
      command: >-
        jq -es 'length == 2 and (.[0].VHL_CAM.event_auto_remove | type == "boolean") and (.[1].ORD.event_auto_remove | type == "boolean") and (.[0].VHL_CAM.event_auto_remove == .[1].ORD.event_auto_remove)' /root/shared_v/edgeconf_pim.json /root/shared_v/ord_vcm_conf.json >/dev/null 2>&1 && echo MATCH || echo MISMATCH
      expected: "MATCH"
      on_fail: "edgeconf와 ord_vcm_conf의 event_auto_remove 불일치"
