# Multi-channel unique-settings (2ch '2ch_03', 720p)
# 1 reboot으로 채널별 다른 설정 동시 검증 (channel isolation + setting reflection).
# Resolution: 720p (1280x720, 30fps)
# Active channels: [0, 3]
# i2c addrs: [(0, '0x3c'), (3, '0x3c')]
# bps 검증: file-size-delta 5s, tolerance ±20%
# fps 검증: dmesg max9296_fsync fps : 30 패턴
# 자동 생성: /tmp/gen_multi_cases.py (1회용 scaffolding, 폐기됨)
name: '[multi] 2ch 2ch_03 720p'
description: '2-channel "2ch_03" combination at 720p with channel-unique settings'
tags: [multi, comprehensive]

setup:
  edgeconf_changes:
    .VHL_CAM.cam_width: 1280
    .VHL_CAM.cam_height: 720
    .VHL_CAM.fps: 30
    .VHL_CAM.recording_time: 1
    .VHL_CAM.muxer: mp4
    .VHL_CAM.i2c1.exp_time: 20000
    .VHL_CAM.i2c2.exp_time: 5000
    .VHL_CAM.i2c2.ch0.enable: true
    .VHL_CAM.i2c2.ch1.enable: false
    .VHL_CAM.i2c1.ch2.enable: false
    .VHL_CAM.i2c1.ch3.enable: true
    .VHL_CAM.i2c2.ch0.vflip: false
    .VHL_CAM.i2c2.ch0.hflip: true
    .VHL_CAM.i2c2.ch0.ae_on: false
    .VHL_CAM.i2c2.ch0.ae_gain: 8192
    .VHL_CAM.i2c2.ch0.bps:
      - 1024
      - 1024
    .VHL_CAM.i2c2.ch0.awb: "auto"
    .VHL_CAM.i2c1.ch3.vflip: false
    .VHL_CAM.i2c1.ch3.hflip: false
    .VHL_CAM.i2c1.ch3.ae_on: false
    .VHL_CAM.i2c1.ch3.ae_gain: 512
    .VHL_CAM.i2c1.ch3.bps:
      - 2048
      - 2048
    .VHL_CAM.i2c1.ch3.awb: "d75"
  reboot_after: true
  stabilize_sec: 30

checks:
  cam_state:
    dir: /tmp/cam_state
    expected_state: healthy
    max_streak: 0
  recording:
    expected_channels: 2
    session_progress: '2/2'
  custom_commands:
  - name: ch0 ROTATION (vflip=false, hflip=true)
    command: i2ctransfer -f -y 2 w2@0x3c 0x10 0x0c r2 2>/dev/null | tr -d ' '
    expected: '0x000x01'
    on_fail: ch0 ROTATION 미반영
  - name: ch0 AE_CTRL (ae_on=false)
    command: i2ctransfer -f -y 2 w2@0x3c 0x50 0x02 r2 2>/dev/null | tr -d ' '
    expected: '0x020x90'
    on_fail: ch0 AE_CTRL 미반영
  - name: ch0 AWB_CTRL (awb=auto)
    command: i2ctransfer -f -y 2 w2@0x3c 0x51 0x00 r2 2>/dev/null | tr -d ' '
    expected: '0x110x5f'
    on_fail: ch0 AWB_CTRL 미반영
  - name: ch0 AE_GAIN (gain=8192, manual mode)
    command: i2ctransfer -f -y 2 w2@0x3c 0x50 0x06 r2 2>/dev/null | tr -d ' '
    expected: '0x200x00'
    on_fail: ch0 AE_GAIN 미반영
  - name: ch3 ROTATION (vflip=false, hflip=false)
    command: i2ctransfer -f -y 1 w2@0x3c 0x10 0x0c r2 2>/dev/null | tr -d ' '
    expected: '0x000x00'
    on_fail: ch3 ROTATION 미반영
  - name: ch3 AE_CTRL (ae_on=false)
    command: i2ctransfer -f -y 1 w2@0x3c 0x50 0x02 r2 2>/dev/null | tr -d ' '
    expected: '0x020x90'
    on_fail: ch3 AE_CTRL 미반영
  - name: ch3 AWB_CTRL (awb=d75)
    command: i2ctransfer -f -y 1 w2@0x3c 0x51 0x00 r2 2>/dev/null | tr -d ' '
    expected: '0x110x56'
    on_fail: ch3 AWB_CTRL 미반영
  - name: ch3 AE_GAIN (gain=512, manual mode)
    command: i2ctransfer -f -y 1 w2@0x3c 0x50 0x06 r2 2>/dev/null | tr -d ' '
    expected: '0x020x00'
    on_fail: ch3 AE_GAIN 미반영
  - name: bus1 EXP_TIME (20000us)
    command: i2ctransfer -f -y 1 w2@0x3c 0x50 0x0c r4 2>/dev/null | tr -d ' '
    expected: '0x000x000x4e0x20'
    on_fail: bus1 EXP_TIME 미반영
  - name: bus2 EXP_TIME (5000us)
    command: i2ctransfer -f -y 2 w2@0x3c 0x50 0x0c r4 2>/dev/null | tr -d ' '
    expected: '0x000x000x130x88'
    on_fail: bus2 EXP_TIME 미반영
  - name: ch0 BITRATE (~1024kbps ±20%, file-delta 5s)
    command: |-
      F=$(find /dev/shm/recordings /mnt/sd_cam -name '*-ch0.mp4' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)
      [ -z "$F" ] && echo FAIL:NO_FILE && exit 0
      S1=$(stat -c %s "$F" 2>/dev/null); sleep 5; S2=$(stat -c %s "$F" 2>/dev/null)
      K=$(( (S2 - S1) * 8 / 5 / 1000 )); [ $K -ge 819 ] && [ $K -le 1228 ] && echo OK || echo FAIL:${K}kbps
    expected: 'OK'
    on_fail: 'ch0 실측 bitrate 범위(819~1228kbps) 벗어남'
  - name: ch3 BITRATE (~2048kbps ±20%, file-delta 5s)
    command: |-
      F=$(find /dev/shm/recordings /mnt/sd_cam -name '*-ch3.mp4' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)
      [ -z "$F" ] && echo FAIL:NO_FILE && exit 0
      S1=$(stat -c %s "$F" 2>/dev/null); sleep 5; S2=$(stat -c %s "$F" 2>/dev/null)
      K=$(( (S2 - S1) * 8 / 5 / 1000 )); [ $K -ge 1638 ] && [ $K -le 2457 ] && echo OK || echo FAIL:${K}kbps
    expected: 'OK'
    on_fail: 'ch3 실측 bitrate 범위(1638~2457kbps) 벗어남'
  - name: dmesg max9296_fsync fps (expected 30)
    command: |-
      F=$(dmesg 2>/dev/null | grep -oE 'max9296_fsync fps : [0-9]+' | grep -oE '[0-9]+$' | sort -u | tr '\n' ',' | sed 's/,$//')
      [ -z "$F" ] && echo FAIL:NO_DMESG && exit 0
      [ "$F" = "30" ] && echo OK || echo FAIL:got=$F
    expected: 'OK'
    on_fail: 'dmesg max9296_fsync fps 30와 다름 (단일 fps 값 기대)'
