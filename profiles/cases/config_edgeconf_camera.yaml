# edgeconf 카메라 설정 일관성 검증
# VHL_CAM 설정값이 실제 동작과 일치하는지 확인
name: "Config: Camera Settings"
description: "edgeconf VHL_CAM 설정값과 실제 카메라 동작 일관성 검증"

# 설정값을 한 번 읽는 point-in-time 검사 — base.yaml 300s 모니터 불필요.
monitor:
  duration_sec: 0

checks:
  custom_commands:
    # === 해상도 설정 확인 ===
    - name: "cam_width is valid (720 or 1920)"
      command: "jq '.VHL_CAM.cam_width' /root/shared_v/edgeconf_pim.json"
      expected_min: 720
      on_fail: "cam_width 값 이상"

    - name: "cam_height is valid (480+)"
      command: "jq '.VHL_CAM.cam_height' /root/shared_v/edgeconf_pim.json"
      expected_min: 480
      on_fail: "cam_height 값 이상"

    # === 채널 Enable 설정 ===
    - name: "ch0 enable 설정 읽기 가능"
      command: "jq '.VHL_CAM.i2c2.ch0.enable' /root/shared_v/edgeconf_pim.json 2>/dev/null || echo null"
      expected: "true"
      on_fail: "ch0 비활성화 또는 설정 누락"

    - name: "ch1 enable 설정 읽기 가능"
      command: "jq '.VHL_CAM.i2c2.ch1.enable' /root/shared_v/edgeconf_pim.json 2>/dev/null || echo null"
      expected: "true"
      on_fail: "ch1 비활성화 또는 설정 누락"

    # === 저장 경로 ===
    - name: "final_path 디렉토리 존재"
      command: "FP=$(jq -r '.VHL_CAM.final_path' /root/shared_v/edgeconf_pim.json); test -d \"$FP\" && echo OK || echo MISSING"
      expected: "OK"
      on_fail: "edgeconf final_path 디렉토리가 존재하지 않음"

    - name: "tmp_path 디렉토리 존재"
      command: "TP=$(jq -r '.VHL_CAM.tmp_path' /root/shared_v/edgeconf_pim.json); test -d \"$TP\" && echo OK || echo MISSING"
      expected: "OK"
      on_fail: "edgeconf tmp_path 디렉토리가 존재하지 않음"

    # === 녹화 시간 ===
    - name: "recording_time 유효 (1-10분)"
      command: "jq '.VHL_CAM.recording_time' /root/shared_v/edgeconf_pim.json"
      expected_min: 1
      on_fail: "recording_time이 0 이하"

    # === FPS ===
    - name: "fps 유효 (1+)"
      command: "jq '.VHL_CAM.fps' /root/shared_v/edgeconf_pim.json"
      expected_min: 1
      on_fail: "fps가 0 이하"

    # === app 설정 ===
    - name: "app이 gstApp으로 설정"
      command: "jq -r '.VHL_CAM.app' /root/shared_v/edgeconf_pim.json"
      expected: "gstApp"
      on_fail: "카메라 앱이 gstApp이 아님"

    # === gstApp 프로세스가 설정과 일치하는지 ===
    - name: "gstApp 실행 중"
      command: "pgrep -x gstApp > /dev/null && echo RUNNING || echo STOPPED"
      expected: "RUNNING"
      on_fail: "edgeconf app=gstApp인데 프로세스 미실행"

    # === event_auto_remove ===
    - name: "event_auto_remove 설정 읽기"
      command: "jq '.VHL_CAM.event_auto_remove' /root/shared_v/edgeconf_pim.json"
      expected: "true"
      on_fail: "event_auto_remove가 비활성화됨"

    # === VHL 정보 ===
    - name: "vhl_name 설정됨"
      command: "V=$(jq -r '.VHL_CAM.vhl_name' /root/shared_v/edgeconf_pim.json); [ -n \"$V\" ] && [ \"$V\" != \"null\" ] && echo OK || echo EMPTY"
      expected: "OK"
      on_fail: "vhl_name이 비어있음"
