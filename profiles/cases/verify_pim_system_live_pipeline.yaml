# READ-ONLY S0/S1 system baseline: no config writes, faults or service restarts.
# This is not S2-S6 configuration/OHT/fault/soak physical E2E acceptance.
name: "PIM installed system live pipeline observation"
description: >-
  Installed package, owner services, config-to-runtime, camera frame flow,
  and same-session finalized MP4/VCM-SRT across all active channels.
tags: [system, integration, read_only, media]

target:
  host: 192.168.214.4

monitor:
  duration_sec: 210
  interval_sec: 10

checks:
  processes:
    required: [gstApp, BG_Check_for_pim, chk_cam_operate, ord, vcm, vsd]
    optional: []

  frame_flow:
    enabled: true
    path: /run/pim-camera/gstApp.json
    sample_sec: 3
    fps_tolerance_pct: 10

  recording:
    session_progress: required

  custom_commands:
    - name: installed pim-mp package and binary identity observed
      # Literal shell plus closed stdin keeps each read-only query noninteractive.
      command: |-
        {
          set +e
          set -f
          OK=1
          valid_hash() {
            [ "${#1}" -eq 64 ] || return 1
            case "$1" in *[!0-9a-f]*) return 1;; esac
            return 0
          }
          STATUS=$(dpkg-query -W -f='${Status}' pim-mp 2>/dev/null); STATUS_RC=$?
          VERSION=$(dpkg-query -W -f='${Version}' pim-mp 2>/dev/null); VERSION_RC=$?
          printf 'PACKAGE:pim-mp STATUS_RC:%s STATUS:<%.160s> VERSION_RC:%s VERSION:<%.160s>\n' \
            "$STATUS_RC" "$STATUS" "$VERSION_RC" "$VERSION"
          if [ "$STATUS_RC" -ne 0 ] || [ "$STATUS" != 'install ok installed' ]; then
            echo FAIL:PACKAGE_NOT_INSTALLED; OK=0
          fi
          if [ "$VERSION_RC" -ne 0 ] || [ -z "$VERSION" ]; then
            echo FAIL:PACKAGE_EMPTY; OK=0
          fi
          case "$VERSION" in *[!A-Za-z0-9.+:~_-]*) echo FAIL:PACKAGE_VERSION_INVALID; OK=0;; esac
          if [ "${#STATUS}" -gt 160 ] || [ "${#VERSION}" -gt 160 ]; then
            echo FAIL:PACKAGE_EVIDENCE_TRUNCATED; OK=0
          fi
          for APP in ord vsd vcm; do
            INSTALLED="/usr/local/bin/$APP"
            RAW=$(sha256sum "$INSTALLED" 2>/dev/null); F_RC=$?
            F=${RAW%% *}
            printf 'APP:%s INSTALLED_PATH:%s INSTALLED_SHA256:%.64s INSTALLED_SHA256_RC:%s\n' \
              "$APP" "$INSTALLED" "${F:-UNAVAILABLE}" "$F_RC"
            IDENTITY_OK=1
            if [ "$F_RC" -ne 0 ] || ! valid_hash "$F"; then IDENTITY_OK=0; fi
            PIDS=$(pgrep -x "$APP" 2>/dev/null); PGREP_RC=$?
            set -- $PIDS
            COUNT=$#
            printf 'APP:%s PGREP_RC:%s PROCESS_COUNT:%s\n' "$APP" "$PGREP_RC" "$COUNT"
            if [ "$PGREP_RC" -ne 0 ] || [ "$COUNT" -ne 1 ]; then
              printf 'FAIL:PROCESS_COUNT:%s\n' "$APP"; OK=0
            fi
            SEEN=0
            for PID in "$@"; do
              [ "$SEEN" -lt 8 ] || break
              SEEN=$((SEEN + 1))
              case "$PID" in ''|*[!0-9]*)
                printf 'APP:%s PID:%.20s INVALID_PID:yes\n' "$APP" "$PID"
                IDENTITY_OK=0; continue;;
              esac
              LINK=$(readlink "/proc/$PID/exe" 2>/dev/null); LINK_RC=$?
              RAW=$(sha256sum "/proc/$PID/exe" 2>/dev/null); P_RC=$?
              P=${RAW%% *}
              MATCH=no
              if [ "$F_RC" -eq 0 ] && [ "$P_RC" -eq 0 ] &&
                 valid_hash "$F" && valid_hash "$P" && [ "$F" = "$P" ]; then
                MATCH=yes
              else
                IDENTITY_OK=0
              fi
              printf 'APP:%s PID:%.20s EXE_LINK:<%.256s> EXE_LINK_RC:%s RUNNING_SHA256:%.64s RUNNING_SHA256_RC:%s MATCH:%s\n' \
                "$APP" "$PID" "$LINK" "$LINK_RC" "${P:-UNAVAILABLE}" "$P_RC" "$MATCH"
              if [ "$LINK_RC" -ne 0 ] || [ -z "$LINK" ] || [ "${#LINK}" -gt 256 ]; then
                printf 'FAIL:EXECUTABLE_LINK:%s\n' "$APP"; IDENTITY_OK=0
              fi
            done
            TRUNCATED=no
            [ "$COUNT" -le "$SEEN" ] || TRUNCATED=yes
            printf 'APP:%s PIDS_SHOWN:%s PIDS_TRUNCATED:%s\n' "$APP" "$SEEN" "$TRUNCATED"
            if [ "$IDENTITY_OK" -ne 1 ]; then
              printf 'FAIL:EXECUTABLE_MISMATCH:%s\n' "$APP"; OK=0
            fi
          done
          # Historical diagnostics only; never execute maintainer scripts.
          if [ "$STATUS" = 'install ok half-configured' ]; then
            if command -v timeout >/dev/null 2>&1; then
              TRACE=$(LC_ALL=C timeout -k 1s 8s journalctl --utc --no-pager \
                -o short-iso --since '30 days ago' \
                --grep '\[PKG\].*(preinst|postinst):|IIM-42652|post-installation script subprocess' \
                -n 80 2>&1); TRACE_RC=$?
              printf 'PACKAGE_JOURNAL_BEGIN SINCE:30-days LIMIT:80 RC:%s\n' "$TRACE_RC"
              printf '%s\n' "$TRACE" | LC_ALL=C cut -b 1-320 | head -c 16000
              printf '\nPACKAGE_JOURNAL_END\n'
              BOOTS=$(LC_ALL=C timeout -k 1s 4s journalctl --utc --list-boots --no-pager 2>&1); BOOTS_RC=$?
              printf 'PACKAGE_JOURNAL_BOOTS_BEGIN RC:%s\n' "$BOOTS_RC"
              printf '%s\n' "$BOOTS" | tail -n 8 | LC_ALL=C cut -b 1-320
              printf 'PACKAGE_JOURNAL_BOOTS_END\n'
              if command -v zgrep >/dev/null 2>&1; then
                SLOG=$(set +f; LC_ALL=C timeout -k 1s 8s zgrep -n -H -E \
                  '(Oct (24|26)|2026-10-(24|26)).*(\[PKG\]|IIM-42652|[Ff]ailed to create .* directory\.)|(2026-10-24 13:0[01]:|2026-10-26 04:3[56]:).*update_network' \
                  /var/log/cantops/local0.log* 2>&1); SLOG_RC=$?
                printf 'PACKAGE_SYSLOG_BEGIN DATES:2026-10-24,2026-10-26 RC:%s\n' "$SLOG_RC"
                printf '%s\n' "$SLOG" | LC_ALL=C cut -b 1-320 | head -c 16000
                printf '\nPACKAGE_SYSLOG_END\n'
              else
                echo PACKAGE_SYSLOG_UNAVAILABLE:zgrep
              fi
            else
              echo PACKAGE_JOURNAL_UNAVAILABLE:timeout
            fi
          fi
          if [ "$OK" -eq 1 ]; then
            echo VERDICT:PACKAGE_IDENTITY_OK
          else
            echo VERDICT:PACKAGE_IDENTITY_FAIL
          fi
        } </dev/null
      expected_regex: '(?:^|\n)VERDICT:PACKAGE_IDENTITY_OK$'
      on_fail: "pim-mp package or installed binary identity unavailable. A SHA alone does not prove reviewed source or installed service provenance."

    - name: owner cam/ORD/VSD systemd services active
      command: >-
        for U in cam-operate.service ord-operate.service vsd-operate.service; do
          systemctl is-active --quiet "$U" ||
            { echo "FAIL:SERVICE:$U"; exit 0; };
        done;
        echo OK
      expected: OK
      on_fail: "A required PIM service is not active"

    - name: edgeconf camera settings reflected in merged runtime
      command: >-
        jq -en
        --slurpfile cfg /root/shared_v/edgeconf_pim.json
        --slurpfile rt /run/pim-camera/config/pim_runtime.json
        '
          def view: .VHL_CAM |
            [.cam_width,.cam_height,.fps,.enc,.recording_time,
             (.i2c2.ch0 | {enable,bps,vflip,hflip,ae_on,ae_gain,awb}),
             (.i2c2.ch1 | {enable,bps,vflip,hflip,ae_on,ae_gain,awb}),
             (.i2c1.ch2 | {enable,bps,vflip,hflip,ae_on,ae_gain,awb}),
             (.i2c1.ch3 | {enable,bps,vflip,hflip,ae_on,ae_gain,awb})];
          ($cfg|length) == 1 and ($rt|length) == 1 and
          ($cfg[0].VHL_CAM.fps|type) == "number" and
          ($cfg[0].VHL_CAM.cam_width|type) == "number" and
          ($cfg[0].VHL_CAM.cam_height|type) == "number" and
          ($cfg[0].VHL_CAM.recording_time|type) == "number" and
          ($cfg[0].VHL_CAM.enc|type) == "string" and
          ([ $cfg[0].VHL_CAM.i2c2.ch0.enable,
             $cfg[0].VHL_CAM.i2c2.ch1.enable,
             $cfg[0].VHL_CAM.i2c1.ch2.enable,
             $cfg[0].VHL_CAM.i2c1.ch3.enable ] | all(type == "boolean")) and
          ($cfg[0]|view) == ($rt[0]|view)
        ' >/dev/null 2>&1 && echo OK || echo FAIL:ACTIVE_RUNTIME_MISMATCH
      expected: OK
      on_fail: "Actual merged camera runtime does not match edgeconf configuration"

    - name: same-current-boot finalized channel MP4 and configured SRT
      # Preserve explicit shell continuations; folded YAML can detach argv.
      command: |-
        S=$(journalctl -t gstApp -b --no-pager -n 500 2>/dev/null |
            sed -n 's/.*Session complete: \([0-9]\{8\}_[0-9]\{4\}\).*/\1/p' |
            tail -1);
        [ -n "$S" ] || { echo NEED_2_FINALIZES_AFTER_BOOT; exit 0; };
        E=$(jq -er '.VHL_CAM.fps|select(type=="number" and .>0)' /root/shared_v/edgeconf_pim.json 2>/dev/null) ||
          { echo FAIL:FPS_CONFIG; exit 0; };
        W=$(jq -er '.VHL_CAM.cam_width|select(type=="number" and .>0)' /root/shared_v/edgeconf_pim.json 2>/dev/null) ||
          { echo FAIL:WIDTH_CONFIG; exit 0; };
        H=$(jq -er '.VHL_CAM.cam_height|select(type=="number" and .>0)' /root/shared_v/edgeconf_pim.json 2>/dev/null) ||
          { echo FAIL:HEIGHT_CONFIG; exit 0; };
        R=$(jq -er '.VHL_CAM.recording_time|select(type=="number" and .>0)' /root/shared_v/edgeconf_pim.json 2>/dev/null) ||
          { echo FAIL:SEGMENT_CONFIG; exit 0; };
        T=$(jq -r '.VHL_CAM.enc' /root/shared_v/edgeconf_pim.json 2>/dev/null);
        case "$T" in h265) CODEC=hevc;; h264) CODEC=h264;; *)
          echo FAIL:CODEC_CONFIG; exit 0;; esac;
        CH=$(jq -r '[.VHL_CAM.i2c2.ch0.enable,.VHL_CAM.i2c2.ch1.enable,
                      .VHL_CAM.i2c1.ch2.enable,.VHL_CAM.i2c1.ch3.enable] |
                      to_entries|map(select(.value==true)|.key)|join(" ")' \
                      /root/shared_v/edgeconf_pim.json 2>/dev/null) ||
          { echo FAIL:CHANNEL_CONFIG; exit 0; };
        [ -n "$CH" ] || { echo FAIL:NO_ENABLED_CHANNEL; exit 0; };
        for ch in $CH; do
          F=$(find /mnt/sd_cam /dev/shm -maxdepth 3 -type f \
                    -name "*$S*-ch$ch.mp4" -mmin -5 \
                    -printf '%T@ %p\n' 2>/dev/null |
                    sort -nr | head -1 | cut -d' ' -f2-);
          [ -n "$F" ] && [ -s "$F" ] ||
            { echo "FAIL:MP4_MISSING:ch$ch:$S"; exit 0; };
          B=$(jq -r --argjson ch "$ch" \
                '[.VHL_CAM.i2c2.ch0.bps[1],.VHL_CAM.i2c2.ch1.bps[1],
                  .VHL_CAM.i2c1.ch2.bps[1],.VHL_CAM.i2c1.ch3.bps[1]]
                 | .[$ch] // 0' /root/shared_v/edgeconf_pim.json 2>/dev/null);
          M=$(ffprobe -v error -select_streams v:0 \
                -show_entries stream=codec_name,width,height,avg_frame_rate,bit_rate \
                -show_entries format=duration,size -of json "$F" 2>/dev/null);
          DATA=$(printf '%s\n' "$M" | jq -c \
                --arg session "$S" --arg channel "ch$ch" --arg path "$F" '
             {session:$session,channel:$channel,path:$path,
              codec_name:.streams[0].codec_name,width:.streams[0].width,
              height:.streams[0].height,avg_frame_rate:.streams[0].avg_frame_rate,
              bit_rate:.streams[0].bit_rate,duration:.format.duration,size:.format.size}
          ' 2>/dev/null);
          [ -n "$DATA" ] || DATA=UNAVAILABLE;
          printf 'MEDIA:%s\n' "$DATA";
          D=$(LC_ALL=C df -P "$F" 2>/dev/null | sed -n '1,2p');
          [ -n "$D" ] || D=UNAVAILABLE;
          printf 'MEDIA_DF:ch%s\n%s\n' "$ch" "$D";
          printf '%s\n' "$M" | jq -e \
                --arg codec "$CODEC" --argjson w "$W" --argjson h "$H" \
                --argjson fps "$E" --argjson minutes "$R" \
                --argjson bps "$B" '
             (.streams[0] // {}) as $v | (.format // {}) as $f |
             (try ($v.avg_frame_rate | split("/") | map(tonumber)) catch []) as $rate |
             (try ($v.bit_rate | tonumber) catch 0) as $bit |
             (try ($f.duration | tonumber) catch 0) as $dur |
             ($v.codec_name==$codec and $v.width==$w and $v.height==$h and
              ($rate|length)==2 and $rate[1]>0 and
              ($rate[0]/$rate[1])>=($fps*0.9) and
              ($rate[0]/$rate[1])<=($fps*1.1) and
              $dur>=($minutes*60-10) and $dur<=($minutes*60+10) and
              $bps>0 and $bit>=($bps*800) and $bit<=($bps*1200))
          ' >/dev/null 2>&1 ||
            { echo "FAIL:MP4_METADATA:ch$ch:$S"; exit 0; };
        done;
        ENABLE=$(jq -r '.VCM.srt_enable' /root/shared_v/ord_vcm_conf.json 2>/dev/null);
        printf 'SRT_ENABLED:%s\n' "$ENABLE";
        case "$ENABLE" in
          true)
            F=$(find /mnt/sd_cam /dev/shm -maxdepth 3 -type f \
                      -name "*${S}00-data.srt" -mmin -5 -size +0c \
                      -printf '%T@ %p\n' 2>/dev/null |
                      sort -nr | head -1 | cut -d' ' -f2-);
            [ -n "$F" ] && [ -s "$F" ] ||
              { echo FAIL:SRT_MISSING; exit 0; };
            Z=$(stat -c %s "$F" 2>/dev/null) || Z=UNAVAILABLE;
            DATA=$(jq -cn \
                  --arg session "$S" --arg path "$F" --arg size "$Z" '
                {session:$session,path:$path,size:$size}
            ' 2>/dev/null);
            [ -n "$DATA" ] || DATA=UNAVAILABLE;
            printf 'SRT:%s\n' "$DATA";
            D=$(LC_ALL=C df -P "$F" 2>/dev/null | sed -n '1,2p');
            [ -n "$D" ] || D=UNAVAILABLE;
            printf 'SRT_DF:\n%s\n' "$D";;
          false) ;;
          *) echo FAIL:SRT_CONFIG; exit 0;;
        esac;
        echo VERDICT:MEDIA_OK
      expected_regex: '(?:^|\n)VERDICT:MEDIA_OK\Z'
      on_fail: >-
        Same-current-boot finalized MP4 for every active channel, measured
        metadata and SRT co-occurrence are not confirmed.
        These observations alone cannot prove fsync/EOS writer closure.
