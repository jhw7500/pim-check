# Board 에러 상태 감지 (체크리스트 Board 탭 이상 감지)
# 에러 파일 존재, SD 비정상, 네트워크 단절 등 감지
name: "Board Error Detect"
description: "Board 탭 체크리스트 — 에러/비정상 상태 감지 전용"

checks:
  legacy_files:
    must_not_exist:
      - /tmp/err_cam0.log
      - /tmp/err_cam1.log
      - /tmp/err_cam2.log
      - /tmp/err_cam3.log
      - /tmp/err_sdcard.log
      - /tmp/err_cpu_temp.log
      - /tmp/err_wifi.log
      - /tmp/err_voltage.log
    must_exist:
      - /sys/devices/platform/leds/leds/gpio1_led/brightness
      - /sys/devices/platform/leds/leds/gpio2_led/brightness
      - /sys/devices/platform/leds/leds/gpio3_led/brightness

  thermal:
    max_temp_c: 85
    warn_temp_c: 80

  custom_commands:
    - name: "네트워크 인터페이스 up 수"
      command: "ip -br link show 2>/dev/null | grep -c ' UP ' || echo 0"
      expected_min: 1
      on_fail: "UP 상태 네트워크 인터페이스 없음"

    - name: "영상 저장 파티션 RO 체크"
      command: "mount | grep sd_cam | grep -q 'rw' && echo RW || echo NOT_MOUNTED"
      expected: "RW"
      on_fail: "CAM SD 카드 미마운트 또는 Read-Only"

    # 주의: 한 결함이 여러 줄로 찍힐 수 있다 — 예) MCP4018 쓰기 실패는

    #   `max9296.c:1456`(MCP4018 쓰기 실패)와 `:3468`(적용 실패)이 같은 사건의 연속일 수 있다.

    # 주의: 스코프가 세션 앵커라, 앵커보다 **먼저** 난 오류(카메라 init ~26s)는

    #   앵커 기록 시점에 따라 잡히기도 놓치기도 한다 — 실행마다 결과가 갈릴 수

    #   있다(#73 후속). 앵커가 없으면 부팅 시각 폴백이라 잡힌다.

    - name: "커널 하드웨어 오류 (세션 앵커 또는 현재 부팅)"
      evidence_format: kernel_log_v1
      command: >-
        I=$(cat /proc/sys/kernel/random/boot_id 2>/dev/null);
        if ! printf '%s\n' "$I" | grep -aEq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then echo INVALID_BOOT_ID; exit 0; fi;
        SCOPE=SESSION;
        BOOT=$(awk -v i="$I" 'NR==1{a=$0} NR==2 && $0==i{print a}' /tmp/pim_check_anchor 2>/dev/null); [ -z "$BOOT" ] && BOOT=$(uptime -s) && SCOPE=BOOT_FALLBACK;
        if [ ! -f /var/log/cantops/kern.log ] || [ ! -r /var/log/cantops/kern.log ] || [ ! -s /var/log/cantops/kern.log ]; then echo NO_SOURCE;
        elif ! printf '%s\n' "$BOOT" | grep -aEq '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$'; then echo INVALID_START_TIME;
        elif [ "$(date -d "$BOOT" '+%Y-%m-%d %H:%M:%S' 2>/dev/null)" != "$BOOT" ]; then echo INVALID_START_TIME;
        else OUT=$(LC_ALL=C awk -v scope="$SCOPE" -v bt="$BOOT" -v id="$I" -v exclude='samsung-hdmi-phy|imx8-pcie-phy|i\.MX clk|imx-sdma|spi-nor|fsl-asoc-card|fsl-easrc|audio-xcvr|fsl-aud2htx|imx-xcvr|imx-micfil|imx-cdnhdmi|wm8960|imx_sec_dsim_drv|lrdmwl_pcie'
        ' tolower($0) ~ /error|fail|fault/ && $0 !~ exclude {
        if (substr($0,1,19) !~ /^[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9] [0-9][0-9]:[0-9][0-9]:[0-9][0-9]$/) {bad++; next;}
        if (substr($0,1,19) > bt) {n++; if(n==1) first=substr($0,1,180); last=substr($0,1,180); if(n<=32) {samples[n]=substr($0,1,512); if(length($0)>512) clipped++;}}
        }
        END {if(NR==0) print "NO_SOURCE"; else if(bad) print "INVALID_LOG_TIME"; else if(!n) print 0;
        else {printf "COUNT=%d SCOPE=%s START=%s BOOT_ID=%s FIRST=%s LAST=%s\n",n,scope,bt,id,first,last;
        k=(n<32?n:32); for(i=1;i<=k;i++) printf "RECORD=%s\n",samples[i];
        printf "SAMPLES=%d OMITTED=%d CLIPPED=%d\n",k,n-k,clipped;}}'
        /var/log/cantops/kern.log 2>/dev/null); RC=$?;
        J=$(cat /proc/sys/kernel/random/boot_id 2>/dev/null);
        if [ "$RC" -ne 0 ]; then echo READ_ERROR; elif [ "$J" != "$I" ]; then echo BOOT_CHANGED; else printf '%s\n' "$OUT"; fi;
        fi
      expected: "0"
      on_fail: "실제 커널 오류 또는 로그 원본/시간범위 미검증 (COUNT/SCOPE/START/FIRST/LAST 확인, 부팅 오류를 세션 중 오류로 오인하지 말 것)"

    - name: "vsftpd 프로세스"
      command: "pgrep -x vsftpd > /dev/null && echo RUNNING || echo STOPPED"
      expected: "RUNNING"
      on_fail: "FTP 서버(vsftpd) 미실행"
