# Fault: SD 카드 강제 unmount + 시스템 감지 검증
# inject: umount /mnt/sd_cam 강제 (lazy unmount)
# verify: 시스템이 SD missing을 인지하고 재mount/에러 보고하는지
# recovery: 강제 재mount로 복구 (real /dev/mmcblk1p1 → /mnt/sd_cam)
name: "Fault: SD Unmount (injected)"
description: "SD 강제 unmount 후 시스템의 감지 + 자동/수동 회복 검증"
tags: [fault, injection, storage]

setup:
  inject_command:
    - "sync"
    # 주입 시각 앵커(모노토닉 초). 이 체크는 "주입 뒤 커널이 반응했는가" 를 묻는데,
    # 세션/부팅 앵커로는 부팅 잡음이 조건을 만족해 주입 없이도 통과한다 — 실제로
    # 커널 커맨드라인(root=/dev/mmcblk…, t=0.000000)이 mmcblk 에 매칭됐다. (#73)
    - "cut -d' ' -f1 /proc/uptime > /tmp/pim_inject_anchor"
    # 저널 조회용 벽시계 앵커 (아래 감지 체크).
    - "date '+%Y-%m-%d %H:%M:%S' > /tmp/pim_inject_wall"
    # 분리 효과는 주입 직후에 기록한다. 체크는 monitor(base 300s) 뒤에 도는데, 그때는
    # SD 감시 루프(automnt_sd_for_emmc_boot.sh, 3s 주기)가 이미 재마운트한 뒤라
    # 체크 시점의 mountpoint 는 주입 결과가 아니라 재마운트 결과다 (2026-10-16 실측).
    - "umount -l /mnt/sd_cam 2>&1 || echo 'already unmounted'; mountpoint -q /mnt/sd_cam && echo STILL_MOUNTED > /tmp/pim_umount_state || echo UNMOUNTED > /tmp/pim_umount_state"
    - "sleep 3"
    - "echo 'SD unmounted'"

checks:
  custom_commands:
    - name: "umount actually happened"
      command: "cat /tmp/pim_umount_state 2>/dev/null || echo NO_STATE"
      expected: "UNMOUNTED"
      on_fail: "umount did not take effect — inject failed"

    # 주입 뒤 시스템이 SD 분리를 감지했는지 — **감지되어야** 하므로 expected_min: 1.
    # 감시 루프(mnt_dev mismatch)와 chk_sd_mount(SD MOUNT ERR)의 저널 기록을 센다.
    # 깨끗한 lazy umount 는 커널 메시지를 남기지 않고, 재마운트의 EXT4 메시지는 INFO 라
    # kern.log(notice 이상)에 없다 — 기존 kern.log 기준 체크는 구조적으로 0 이었다
    # (2026-10-16 실측: kern.log 'mounted filesystem' 0건, journal -k 에는 있음).
    - name: "SD 분리 감지 기록 (주입 이후, 저널)"
      command: "[ -r /tmp/pim_inject_wall ] || { echo 0; exit 0; }; journalctl --no-pager -o cat --since \"$(cat /tmp/pim_inject_wall)\" 2>/dev/null | grep -cE 'SD MOUNT ERR|mnt_dev mismatch' || true"
      expected_min: 1
      on_fail: "SD 분리 후 시스템 감지 기록 없음"

    - name: "SD auto-remount within 60s OR /tmp/cam_state 에 보고"
      command: "for i in $(seq 1 12); do mountpoint -q /mnt/sd_cam && { echo REMOUNTED:$((i*5))s; exit 0; }; sleep 5; done; ls /tmp/cam_state/ 2>&1 | head -1; echo NOT_REMOUNTED"
      expected_regex: "^REMOUNTED:|NOT_REMOUNTED"  # PASS 둘 다 허용 (감지만 되면 OK)
      on_fail: "예상치 못한 응답"

    - name: "no kernel panic"
      # dmesg --level 을 kern.log 로 옮긴 형태 (#69). rsyslog 는 severity 를 줄 안에
      # `kernel[emerg]` 처럼 적으므로 emerg/alert/crit(0/1/2)를 직접 고른다 — 셋 다
      # kern.notice(0–5) 안이라 파일에 반드시 들어온다.
      # 축은 이 파일의 다른 체크와 같은 **inject 앵커**(monotonic) — "SD 를 내린 뒤
      # 커널 긴급 로그가 났는가"가 질문이므로 주입 시각이 경계다.
      command: "[ -r /tmp/pim_inject_anchor ] || { echo 0; exit 0; }; A=$(cat /tmp/pim_inject_anchor); cat /var/log/cantops/kern.log 2>/dev/null | awk -v a=\"$A\" 'match($0, /\\[ *[0-9]+\\.[0-9]+\\]/) { t=substr($0,RSTART+1,RLENGTH-2)+0; if (t<prev) n=0; prev=t; if (t>a+0 && $0 ~ /kernel\\[(emerg|alert|crit)\\]/) n++ } END { print n+0 }'"
      expected: "0"
      on_fail: "SD unmount triggered kernel emergency"

teardown:
  recovery_command:
    # teardown: 섹션이 recovery_command 의 정본 자리다 (#75 에서 실행되도록 고침).
    # 앵커 정리는 여기서 하되, 주입이 매번 덮어쓰고 재부팅 시 /tmp 가 비워지는
    # 이중 안전망은 그대로 남는다.
    - "rm -f /tmp/pim_inject_anchor /tmp/pim_inject_wall /tmp/pim_umount_state"
    - "mountpoint -q /mnt/sd_cam || mount /dev/mmcblk1p1 /mnt/sd_cam 2>&1"
    - "sleep 2"
    - "mountpoint -q /mnt/sd_cam && echo 'SD remounted OK' || echo 'remount FAILED'"
    - "ls /mnt/sd_cam | head -3"
