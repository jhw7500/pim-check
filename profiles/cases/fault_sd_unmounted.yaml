# Fault: SD 카드 강제 unmount + 시스템 감지 검증
# inject: umount /mnt/sd_cam 강제 (lazy unmount)
# verify: 시스템이 SD missing을 인지하고 재mount/에러 보고하는지
# recovery: 강제 재mount로 복구 (real /dev/mmcblk1p1 → /mnt/sd_cam)
name: "Fault: SD Unmount (injected)"
description: "SD 강제 unmount 후 시스템의 감지 + 자동/수동 회복 검증"
tags: [fault, injection, storage]

setup:
  inject_command:
    - "sync"
    # 주입 시각 앵커(모노토닉 초). 이 체크는 "주입 뒤 커널이 반응했는가" 를 묻는데,
    # 세션/부팅 앵커로는 부팅 잡음이 조건을 만족해 주입 없이도 통과한다 — 실제로
    # 커널 커맨드라인(root=/dev/mmcblk…, t=0.000000)이 mmcblk 에 매칭됐다. (#73)
    - "cut -d' ' -f1 /proc/uptime > /tmp/pim_inject_anchor"
    - "umount -l /mnt/sd_cam 2>&1 || echo 'already unmounted'"
    - "sleep 3"
    - "echo 'SD unmounted'"

checks:
  custom_commands:
    - name: "umount actually happened"
      command: "mountpoint -q /mnt/sd_cam && echo STILL_MOUNTED || echo UNMOUNTED"
      expected: "UNMOUNTED"
      on_fail: "umount did not take effect — inject failed"

    # umount 주입 뒤 커널이 반응했는지 — **감지되어야** 하므로 expected_min: 1.
    # 축은 **inject 시각**(모노토닉) — 세션/부팅 앵커면 부팅 잡음이 통과시킨다.
    # (기존 expected_min: 0 은 아예 항상 참이었다. #73)
    - name: "dmesg/journal records SD I/O 에러 or remount attempt"
      command: "A=$(cat /tmp/pim_inject_anchor 2>/dev/null || echo 999999); awk -v a=\"$A\" 'match($0, /\\[ *[0-9]+\\.[0-9]+\\]/) { t=substr($0,RSTART+1,RLENGTH-2)+0; if (t<prev) n=0; prev=t; if (t>a+0 && tolower($0) ~ /mmcblk|sd_cam|i\\/o error|remount/) n++ } END { print n+0 }' /var/log/cantops/kern.log"
      expected_min: 1
      on_fail: "SD unmount 후 kernel 응답 없음 (감지 안 됨)"

    - name: "SD auto-remount within 60s OR /tmp/cam_state 에 보고"
      command: "for i in $(seq 1 12); do mountpoint -q /mnt/sd_cam && { echo REMOUNTED:$((i*5))s; exit 0; }; sleep 5; done; ls /tmp/cam_state/ 2>&1 | head -1; echo NOT_REMOUNTED"
      expected_regex: "^REMOUNTED:|NOT_REMOUNTED"  # PASS 둘 다 허용 (감지만 되면 OK)
      on_fail: "예상치 못한 응답"

    - name: "no kernel panic"
      command: "dmesg --level=emerg,alert,crit 2>/dev/null | wc -l"
      expected: "0"
      on_fail: "SD unmount triggered kernel emergency"

teardown:
  recovery_command:
    - "rm -f /tmp/pim_inject_anchor"
    - "mountpoint -q /mnt/sd_cam || mount /dev/mmcblk1p1 /mnt/sd_cam 2>&1"
    - "sleep 2"
    - "mountpoint -q /mnt/sd_cam && echo 'SD remounted OK' || echo 'remount FAILED'"
    - "ls /mnt/sd_cam | head -3"
