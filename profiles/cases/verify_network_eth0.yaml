# 동작 검증: ETH0 IP 변경
# ETH0 IP를 변경하고 재부팅 후 실제 적용 확인
# WiFi(wlp1s0)로 접속하므로 ETH0 변경은 SSH에 영향 없음
name: "Verify: ETH0 IP Change"
description: "ETH0 IP 변경 + 재부팅 + 실제 적용 확인"

setup:
  edgeconf_changes:
    ".NETWORK.ETH0.address": "192.168.214.100"
  reboot_after: true
  stabilize_sec: 30

checks:
  custom_commands:
    - name: "edgeconf ETH0 IP 변경됨"
      command: "jq -r '.NETWORK.ETH0.address' /root/shared_v/edgeconf_pim.json"
      expected: "192.168.214.100"
      on_fail: "edgeconf ETH0 IP가 변경되지 않음"

    - name: "실제 ETH0 IP 적용됨"
      command: "ip -br addr show eth0 | awk '{print $3}' | cut -d/ -f1"
      expected: "192.168.214.100"
      on_fail: "ETH0 실제 IP가 설정값과 다름"

    - name: "ETH0 link UP 유지"
      command: "ip -br link show eth0 | awk '{print $2}'"
      expected: "UP"
      on_fail: "ETH0 인터페이스가 UP이 아님"

    - name: "WiFi 연결 유지 (SSH 경로)"
      command: "ip -br addr show wlp1s0 | grep -c 'UP' || echo 0"
      expected_min: 1
      on_fail: "WiFi 연결 끊김 — SSH 접속 불안정"

    - name: "ORD 프로세스 안정"
      command: "pgrep -x ord > /dev/null && echo RUNNING || echo STOPPED"
      expected: "RUNNING"
      on_fail: "ETH0 IP 변경 후 ORD 크래시"
