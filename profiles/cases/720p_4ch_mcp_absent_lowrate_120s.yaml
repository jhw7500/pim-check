# REVIEW ONLY: experimental bitrate not proven by hardware. NOT part of smoke plans.
# MCP4018 physically absent PIM board (192.168.214.4) only. Never use on equipped boards.
# 720p 4ch isolated acceptance: original settings restored by setup teardown.
name: "720p 4채널 저비트레이트 120초 (미검증 후보)"
description: "MCP4018 미장착 보드 한정, 4x512kbps 물리 하드웨어 미검증 후보 / 녹화·복구 승인은 별도"
tags: [camera, mcp_absent, capacity_review_only, experimental_lowrate]

target:
  host: 192.168.214.4

setup:
  # Structural guard: SetupManager refuses this profile on every execution path.
  # Do not remove for physical tests; use a separately reviewed approved profile.
  qa_review_only: true
  edgeconf_changes:
    ".VHL_CAM.cam_width": 1280
    ".VHL_CAM.cam_height": 720
    ".VHL_CAM.fps": 30
    ".VHL_CAM.recording_time": 1
    ".VHL_CAM.muxer": mp4
    # 인코더 상태 명시 고정 — enc/qp 드리프트로 bitrate 검증이
    # 비결정화되는 것 차단 (qp [0,0]=무클램프, quant [-1,-1]=auto).
    ".VHL_CAM.enc": "h265"
    ".VHL_CAM.i2c2.ch0.qp_min": [0, 0]
    ".VHL_CAM.i2c2.ch0.qp_max": [0, 0]
    ".VHL_CAM.i2c2.ch0.quant": [-1, -1]
    ".VHL_CAM.i2c2.ch0.profile": [0, 0]
    ".VHL_CAM.i2c2.ch1.qp_min": [0, 0]
    ".VHL_CAM.i2c2.ch1.qp_max": [0, 0]
    ".VHL_CAM.i2c2.ch1.quant": [-1, -1]
    ".VHL_CAM.i2c2.ch1.profile": [0, 0]
    ".VHL_CAM.i2c1.ch2.qp_min": [0, 0]
    ".VHL_CAM.i2c1.ch2.qp_max": [0, 0]
    ".VHL_CAM.i2c1.ch2.quant": [-1, -1]
    ".VHL_CAM.i2c1.ch2.profile": [0, 0]
    ".VHL_CAM.i2c1.ch3.qp_min": [0, 0]
    ".VHL_CAM.i2c1.ch3.qp_max": [0, 0]
    ".VHL_CAM.i2c1.ch3.quant": [-1, -1]
    ".VHL_CAM.i2c1.ch3.profile": [0, 0]
    ".VHL_CAM.capture.enable": false
    ".VHL_CAM.i2c2.exp_time": 5000
    ".VHL_CAM.i2c1.exp_time": 10000
    ".VHL_CAM.i2c2.ch0.enable": true
    ".VHL_CAM.i2c2.ch1.enable": true
    ".VHL_CAM.i2c1.ch2.enable": true
    ".VHL_CAM.i2c1.ch3.enable": true
    ".VHL_CAM.i2c2.ch0.vflip": false
    ".VHL_CAM.i2c2.ch0.hflip": true
    ".VHL_CAM.i2c2.ch0.ae_on": false
    ".VHL_CAM.i2c2.ch0.ae_gain": 512
    ".VHL_CAM.i2c2.ch0.awb": "auto"
    ".VHL_CAM.i2c2.ch1.vflip": false
    ".VHL_CAM.i2c2.ch1.hflip": false
    ".VHL_CAM.i2c2.ch1.ae_on": true
    ".VHL_CAM.i2c2.ch1.awb": "d65"
    ".VHL_CAM.i2c1.ch2.vflip": true
    ".VHL_CAM.i2c1.ch2.hflip": false
    ".VHL_CAM.i2c1.ch2.ae_on": true
    ".VHL_CAM.i2c1.ch2.awb": "off"
    ".VHL_CAM.i2c1.ch3.vflip": true
    ".VHL_CAM.i2c1.ch3.hflip": true
    # 이 저비트레이트 4x512kbps는 하드웨어 인코더/장면별 bitrate 수렴 미검증 실험값이다.
    ".VHL_CAM.i2c1.ch3.ae_on": true
    ".VHL_CAM.i2c1.ch3.awb": "d75"
    ".VHL_CAM.i2c2.ch0.bps":
      - 512
      - 512
    ".VHL_CAM.i2c2.ch1.bps":
      - 512
      - 512
    ".VHL_CAM.i2c1.ch2.bps":
      - 512
      - 512
    ".VHL_CAM.i2c1.ch3.bps":
      - 512
      - 512
    ".VHL_CAM.i2c2.ch0.led_flash.enable": false
    ".VHL_CAM.i2c2.ch0.led_flash.wiper": 16
    ".VHL_CAM.i2c2.ch1.led_flash.enable": false
    ".VHL_CAM.i2c2.ch1.led_flash.wiper": 32
    ".VHL_CAM.i2c1.ch2.led_flash.enable": false
    ".VHL_CAM.i2c1.ch2.led_flash.wiper": 48
    ".VHL_CAM.i2c1.ch3.led_flash.enable": false
    ".VHL_CAM.i2c1.ch3.led_flash.wiper": 63
  ord_vcm_changes:
    .VCM.srt_enable: true
  reboot_after: true
  stabilize_sec: 200

checks:
  frame_flow:
    enabled: true
    path: /run/pim-camera/gstApp.json
    sample_sec: 3
  cpu:
    gst_range: [0, 320]
  recording:
    expected_channels: 4
    session_progress: 'required'
  custom_commands:
    - name: ch0 BPS QP auto precondition
      command: >-
        Q=$(jq -c '[.VHL_CAM.i2c2.ch0.qp_min,.VHL_CAM.i2c2.ch0.qp_max,.VHL_CAM.i2c2.ch0.quant]' /root/shared_v/edgeconf_pim.json 2>/dev/null);
        [ "$Q" = '[[0,0],[0,0],[-1,-1]]' ] && echo OK || echo "FAIL:QP_NOT_AUTO:$Q"
      expected: OK
    - name: ch1 BPS QP auto precondition
      command: >-
        Q=$(jq -c '[.VHL_CAM.i2c2.ch1.qp_min,.VHL_CAM.i2c2.ch1.qp_max,.VHL_CAM.i2c2.ch1.quant]' /root/shared_v/edgeconf_pim.json 2>/dev/null);
        [ "$Q" = '[[0,0],[0,0],[-1,-1]]' ] && echo OK || echo "FAIL:QP_NOT_AUTO:$Q"
      expected: OK
    - name: ch2 BPS QP auto precondition
      command: >-
        Q=$(jq -c '[.VHL_CAM.i2c1.ch2.qp_min,.VHL_CAM.i2c1.ch2.qp_max,.VHL_CAM.i2c1.ch2.quant]' /root/shared_v/edgeconf_pim.json 2>/dev/null);
        [ "$Q" = '[[0,0],[0,0],[-1,-1]]' ] && echo OK || echo "FAIL:QP_NOT_AUTO:$Q"
      expected: OK
    - name: ch3 BPS QP auto precondition
      command: >-
        Q=$(jq -c '[.VHL_CAM.i2c1.ch3.qp_min,.VHL_CAM.i2c1.ch3.qp_max,.VHL_CAM.i2c1.ch3.quant]' /root/shared_v/edgeconf_pim.json 2>/dev/null);
        [ "$Q" = '[[0,0],[0,0],[-1,-1]]' ] && echo OK || echo "FAIL:QP_NOT_AUTO:$Q"
      expected: OK
    - name: ch0 mp4 fps == edgeconf fps (±0.5)
      command: "EX=$(jq -r '.VHL_CAM.fps' /root/shared_v/edgeconf_pim.json); I=$(cat /proc/sys/kernel/random/boot_id 2>/dev/null); BOOT=$(awk -v i=\"$I\" 'NR==1{a=$0} NR==2 && $0==i{print a}' /tmp/pim_check_anchor 2>/dev/null); [ -z \"$BOOT\" ] && BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recordings -name \"*${SESS}*-ch0.mp4\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$F\" ] && FR=$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$FR\" | awk -F/ -v ex=\"$EX\" '{if ($2 == 0) { print \"FAIL:BAD_AVG\"; exit } n=$1/$2; if (n>=ex-0.5 && n<=ex+0.5) print \"OK\"; else printf \"FAIL:%.1f_ex=%s\\n\", n, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch1 mp4 fps == edgeconf fps (±0.5)
      command: "EX=$(jq -r '.VHL_CAM.fps' /root/shared_v/edgeconf_pim.json); I=$(cat /proc/sys/kernel/random/boot_id 2>/dev/null); BOOT=$(awk -v i=\"$I\" 'NR==1{a=$0} NR==2 && $0==i{print a}' /tmp/pim_check_anchor 2>/dev/null); [ -z \"$BOOT\" ] && BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recordings -name \"*${SESS}*-ch1.mp4\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$F\" ] && FR=$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$FR\" | awk -F/ -v ex=\"$EX\" '{if ($2 == 0) { print \"FAIL:BAD_AVG\"; exit } n=$1/$2; if (n>=ex-0.5 && n<=ex+0.5) print \"OK\"; else printf \"FAIL:%.1f_ex=%s\\n\", n, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch2 mp4 fps == edgeconf fps (±0.5)
      command: "EX=$(jq -r '.VHL_CAM.fps' /root/shared_v/edgeconf_pim.json); I=$(cat /proc/sys/kernel/random/boot_id 2>/dev/null); BOOT=$(awk -v i=\"$I\" 'NR==1{a=$0} NR==2 && $0==i{print a}' /tmp/pim_check_anchor 2>/dev/null); [ -z \"$BOOT\" ] && BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recordings -name \"*${SESS}*-ch2.mp4\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$F\" ] && FR=$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$FR\" | awk -F/ -v ex=\"$EX\" '{if ($2 == 0) { print \"FAIL:BAD_AVG\"; exit } n=$1/$2; if (n>=ex-0.5 && n<=ex+0.5) print \"OK\"; else printf \"FAIL:%.1f_ex=%s\\n\", n, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch3 mp4 fps == edgeconf fps (±0.5)
      command: "EX=$(jq -r '.VHL_CAM.fps' /root/shared_v/edgeconf_pim.json); I=$(cat /proc/sys/kernel/random/boot_id 2>/dev/null); BOOT=$(awk -v i=\"$I\" 'NR==1{a=$0} NR==2 && $0==i{print a}' /tmp/pim_check_anchor 2>/dev/null); [ -z \"$BOOT\" ] && BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recordings -name \"*${SESS}*-ch3.mp4\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$F\" ] && FR=$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$FR\" | awk -F/ -v ex=\"$EX\" '{if ($2 == 0) { print \"FAIL:BAD_AVG\"; exit } n=$1/$2; if (n>=ex-0.5 && n<=ex+0.5) print \"OK\"; else printf \"FAIL:%.1f_ex=%s\\n\", n, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch0 bitrate ~ edgeconf bps[1] (±20%)
      command: "EX=$(jq -r '.VHL_CAM.i2c2.ch0.bps[1] // 0' /root/shared_v/edgeconf_pim.json); [ \"$EX\" = \"0\" ] && { echo OK; exit 0; }; I=$(cat /proc/sys/kernel/random/boot_id 2>/dev/null); BOOT=$(awk -v i=\"$I\" 'NR==1{a=$0} NR==2 && $0==i{print a}' /tmp/pim_check_anchor 2>/dev/null); [ -z \"$BOOT\" ] && BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recordings -name \"*${SESS}*-ch0.mp4\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$F\" ] && BR=$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$BR\" | awk -v ex=\"$EX\" '{br=$1/1000; if (br>=ex*0.8 && br<=ex*1.2) print \"OK\"; else printf \"FAIL:%dkbps_ex=%dkbps\\n\", br, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch1 bitrate ~ edgeconf bps[1] (±20%)
      command: "EX=$(jq -r '.VHL_CAM.i2c2.ch1.bps[1] // 0' /root/shared_v/edgeconf_pim.json); [ \"$EX\" = \"0\" ] && { echo OK; exit 0; }; I=$(cat /proc/sys/kernel/random/boot_id 2>/dev/null); BOOT=$(awk -v i=\"$I\" 'NR==1{a=$0} NR==2 && $0==i{print a}' /tmp/pim_check_anchor 2>/dev/null); [ -z \"$BOOT\" ] && BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recordings -name \"*${SESS}*-ch1.mp4\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$F\" ] && BR=$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$BR\" | awk -v ex=\"$EX\" '{br=$1/1000; if (br>=ex*0.8 && br<=ex*1.2) print \"OK\"; else printf \"FAIL:%dkbps_ex=%dkbps\\n\", br, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch2 bitrate ~ edgeconf bps[1] (±20%)
      command: "EX=$(jq -r '.VHL_CAM.i2c1.ch2.bps[1] // 0' /root/shared_v/edgeconf_pim.json); [ \"$EX\" = \"0\" ] && { echo OK; exit 0; }; I=$(cat /proc/sys/kernel/random/boot_id 2>/dev/null); BOOT=$(awk -v i=\"$I\" 'NR==1{a=$0} NR==2 && $0==i{print a}' /tmp/pim_check_anchor 2>/dev/null); [ -z \"$BOOT\" ] && BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recordings -name \"*${SESS}*-ch2.mp4\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$F\" ] && BR=$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$BR\" | awk -v ex=\"$EX\" '{br=$1/1000; if (br>=ex*0.8 && br<=ex*1.2) print \"OK\"; else printf \"FAIL:%dkbps_ex=%dkbps\\n\", br, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch3 bitrate ~ edgeconf bps[1] (±20%)
      command: "EX=$(jq -r '.VHL_CAM.i2c1.ch3.bps[1] // 0' /root/shared_v/edgeconf_pim.json); [ \"$EX\" = \"0\" ] && { echo OK; exit 0; }; I=$(cat /proc/sys/kernel/random/boot_id 2>/dev/null); BOOT=$(awk -v i=\"$I\" 'NR==1{a=$0} NR==2 && $0==i{print a}' /tmp/pim_check_anchor 2>/dev/null); [ -z \"$BOOT\" ] && BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recordings -name \"*${SESS}*-ch3.mp4\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$F\" ] && BR=$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$BR\" | awk -v ex=\"$EX\" '{br=$1/1000; if (br>=ex*0.8 && br<=ex*1.2) print \"OK\"; else printf \"FAIL:%dkbps_ex=%dkbps\\n\", br, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: 최근 2분 내 .srt 파일 ≥1 (srt_enable=true 실측)
      command: >-
        ANCHOR=$(awk -v i="$(cat /proc/sys/kernel/random/boot_id 2>/dev/null)" 'NR==1{a=$0} NR==2 && $0==i{print a}' /tmp/pim_check_anchor 2>/dev/null);
        [ -z "$ANCHOR" ] && echo FAIL:NO_SESSION_ANCHOR && exit 0;
        find /mnt/sd_cam /dev/shm/recordings \( -name '*.srt' -o -name '*.srt.part' \) -newermt "$ANCHOR" 2>/dev/null | wc -l | tr -d ' '
      expected_min: 1
      on_fail: srt_enable=true인데 .srt 파일 미생성
    # === i2c register (vflip/hflip/AE/AWB) — 4ch unique signature ===
    - name: ch0 ROTATION (FT → 0x0001)
      command: i2ctransfer -f -y 2 w2@0x11 0x10 0x0c r2 2>/dev/null | tr -d ' '
      expected: '0x000x01'
    - name: ch1 ROTATION (FF → 0x0000)
      command: i2ctransfer -f -y 2 w2@0x12 0x10 0x0c r2 2>/dev/null | tr -d ' '
      expected: '0x000x00'
    - name: ch2 ROTATION (TF → 0x0002)
      command: i2ctransfer -f -y 1 w2@0x11 0x10 0x0c r2 2>/dev/null | tr -d ' '
      expected: '0x000x02'
    - name: ch3 ROTATION (TT → 0x0003)
      command: i2ctransfer -f -y 1 w2@0x12 0x10 0x0c r2 2>/dev/null | tr -d ' '
      expected: '0x000x03'
    - name: ch0 AE_CTRL (ae=F)
      command: i2ctransfer -f -y 2 w2@0x11 0x50 0x02 r2 2>/dev/null | tr -d ' '
      expected: '0x020x90'
    - name: ch0 AE_GAIN (gain=512, manual)
      command: i2ctransfer -f -y 2 w2@0x11 0x50 0x06 r2 2>/dev/null | tr -d ' '
      expected: '0x020x00'
    - name: ch1 AE_CTRL (ae=T)
      command: i2ctransfer -f -y 2 w2@0x12 0x50 0x02 r2 2>/dev/null | tr -d ' '
      expected: '0x020x99'
    - name: ch2 AE_CTRL (ae=T)
      command: i2ctransfer -f -y 1 w2@0x11 0x50 0x02 r2 2>/dev/null | tr -d ' '
      expected: '0x020x99'
    - name: ch3 AE_CTRL (ae=T)
      command: i2ctransfer -f -y 1 w2@0x12 0x50 0x02 r2 2>/dev/null | tr -d ' '
      expected: '0x020x99'
    - name: ch0 AWB_CTRL (auto)
      command: i2ctransfer -f -y 2 w2@0x11 0x51 0x00 r2 2>/dev/null | tr -d ' '
      expected: '0x110x5f'
    - name: ch1 AWB_CTRL (d65)
      command: i2ctransfer -f -y 2 w2@0x12 0x51 0x00 r2 2>/dev/null | tr -d ' '
      expected: '0x110x55'
    - name: ch2 AWB_CTRL (off)
      command: i2ctransfer -f -y 1 w2@0x11 0x51 0x00 r2 2>/dev/null | tr -d ' '
      expected: '0x110x50'
    - name: ch3 AWB_CTRL (d75)
      command: i2ctransfer -f -y 1 w2@0x12 0x51 0x00 r2 2>/dev/null | tr -d ' '
      expected: '0x110x56'
    - name: bus2 EXP_TIME (5000us = 0x1388)
      command: i2ctransfer -f -y 2 w2@0x11 0x50 0x0c r4 2>/dev/null | tr -d ' '
      expected: '0x000x000x130x88'
    - name: bus1 EXP_TIME (10000us = 0x2710)
      command: i2ctransfer -f -y 1 w2@0x11 0x50 0x0c r4 2>/dev/null | tr -d ' '
      expected: '0x000x000x270x10'
    - name: 'dmesg max9296_fsync fps (진단: 기대 30, 게이팅 없음)'
      command: "I=$(cat /proc/sys/kernel/random/boot_id 2>/dev/null); BOOT=$(awk -v i=\"$I\" 'NR==1{a=$0} NR==2 && $0==i{print a}' /tmp/pim_check_anchor 2>/dev/null); [ -z \"$BOOT\" ] && BOOT=$(uptime -s); [ -r /var/log/cantops/kern.log ] || { echo NO_SOURCE; exit 0; }; L=$(grep -a 'max9296_fsync' /var/log/cantops/kern.log 2>/dev/null | awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt'); F=$(printf '%s\\n' \"$L\" | grep -oE 'max9296_fsync( [a-z-]+)? fps : [0-9]+' | grep -oE '[0-9]+$' | sort -u | tr '\\n' ',' | sed 's/,$//'); [ -n \"$F\" ] && echo \"got=$F\" || echo NO_MARKER"
      on_fail: 'fsync 마커 진단 항목(#85) — 게이팅은 파일 무결성 fps 실측이 담당'
    - name: ch0 led_flash (F/16)
      command: jq -r '.VHL_CAM.i2c2.ch0.led_flash | "\(.enable)|\(.wiper)"' /root/shared_v/edgeconf_pim.json
      expected: 'false|16'
    - name: ch1 led_flash (F/32)
      command: jq -r '.VHL_CAM.i2c2.ch1.led_flash | "\(.enable)|\(.wiper)"' /root/shared_v/edgeconf_pim.json
      expected: 'false|32'
    - name: ch2 led_flash (F/48)
      command: jq -r '.VHL_CAM.i2c1.ch2.led_flash | "\(.enable)|\(.wiper)"' /root/shared_v/edgeconf_pim.json
      expected: 'false|48'
    - name: ch3 led_flash (F/63)
      command: jq -r '.VHL_CAM.i2c1.ch3.led_flash | "\(.enable)|\(.wiper)"' /root/shared_v/edgeconf_pim.json
      expected: 'false|63'
    - name: ch0 mp4 duration ~ recording_time*60s (±5s)
      command: "EX=$(jq -r '.VHL_CAM.recording_time' /root/shared_v/edgeconf_pim.json); I=$(cat /proc/sys/kernel/random/boot_id 2>/dev/null); BOOT=$(awk -v i=\"$I\" 'NR==1{a=$0} NR==2 && $0==i{print a}' /tmp/pim_check_anchor 2>/dev/null); [ -z \"$BOOT\" ] && BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recordings -name \"*${SESS}*-ch0.mp4\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$F\" ] && D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 \"$F\" 2>/dev/null | cut -d. -f1) && echo \"$D\" | awk -v ex=$((EX*60)) '{if ($1>=ex-5 && $1<=ex+5) print \"OK\"; else printf \"FAIL:%ds_ex=%ds\\n\", $1, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch0 mp4와 srt sync (NR==2 session에서 둘 다 finalize)
      command: "I=$(cat /proc/sys/kernel/random/boot_id 2>/dev/null); BOOT=$(awk -v i=\"$I\" 'NR==1{a=$0} NR==2 && $0==i{print a}' /tmp/pim_check_anchor 2>/dev/null); [ -z \"$BOOT\" ] && BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; M=$(find /mnt/sd_cam /dev/shm/recordings -name \"*${SESS}*-ch0.mp4\" ! -name '*.part' 2>/dev/null | head -1); S=$(find /mnt/sd_cam /dev/shm/recordings -name \"*${SESS}*-data.srt\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$M\" ] && [ -n \"$S\" ] && echo OK || echo \"MISMATCH sess=$SESS mp4=$M srt=$S\""
      expected: OK
      on_fail: 같은 session prefix에 mp4 또는 srt 누락 (보드 fw finalize 불일치)

