# 720p 2채널 모니터링 (fps + bps 통합 검증)
name: "720p 2채널"
description: "1280x720 2채널 + fps/bps 실측 검증"
tags: [smoke, camera]

setup:
  edgeconf_changes:
    ".VHL_CAM.cam_width": 1280
    ".VHL_CAM.cam_height": 720
    ".VHL_CAM.fps": 30
    ".VHL_CAM.recording_time": 2
    ".VHL_CAM.muxer": mp4
    ".VHL_CAM.capture.enable": false
    ".VHL_CAM.i2c2.exp_time": 2000
    ".VHL_CAM.i2c2.ch0.enable": true
    ".VHL_CAM.i2c2.ch1.enable": true
    ".VHL_CAM.i2c1.ch2.enable": false
    ".VHL_CAM.i2c1.ch3.enable": false
    ".VHL_CAM.i2c2.ch0.vflip": false
    ".VHL_CAM.i2c2.ch0.hflip": true
    ".VHL_CAM.i2c2.ch0.ae_on": false
    ".VHL_CAM.i2c2.ch0.ae_gain": 8192
    ".VHL_CAM.i2c2.ch0.awb": "auto"
    ".VHL_CAM.i2c2.ch1.vflip": false
    ".VHL_CAM.i2c2.ch1.hflip": false
    ".VHL_CAM.i2c2.ch1.ae_on": true
    ".VHL_CAM.i2c2.ch1.awb": "d65"
    ".VHL_CAM.i2c2.ch0.bps":
      - 1024
      - 1024
    ".VHL_CAM.i2c2.ch1.bps":
      - 2048
      - 2048
    ".VHL_CAM.i2c2.ch0.led_flash.enable": true
    ".VHL_CAM.i2c2.ch0.led_flash.wiper": 16
    ".VHL_CAM.i2c2.ch1.led_flash.enable": false
    ".VHL_CAM.i2c2.ch1.led_flash.wiper": 32
  ord_vcm_changes:
    .VCM.srt_enable: false
  reboot_after: true
  # recording_time=2 (120s segment) 검증을 위해 두 번째 finalize까지 대기 필요.
  # 측정: SSH OK 후 +61s 첫 finalize → +181s 두 번째 finalize → +30s buffer = 211s.
  # 보수적으로 260s 설정.
  stabilize_sec: 260

checks:
  cpu:
    gst_range: [0, 240]
  recording:
    expected_channels: 2
  custom_commands:
    - name: ch0 mp4 fps == edgeconf fps (±0.5) — latest finalized session
      command: "EX=$(jq -r '.VHL_CAM.fps' /root/shared_v/edgeconf_pim.json); BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recording -name \"*${SESS}*-ch0.mp4\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$F\" ] && FR=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$FR\" | awk -F/ -v ex=\"$EX\" '{n=$1/$2; if (n>=ex-0.5 && n<=ex+0.5) print \"OK\"; else printf \"FAIL:%.1f_ex=%s\\n\", n, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch1 mp4 fps == edgeconf fps (±0.5) — latest finalized session
      command: "EX=$(jq -r '.VHL_CAM.fps' /root/shared_v/edgeconf_pim.json); BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recording -name \"*${SESS}*-ch1.mp4\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$F\" ] && FR=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$FR\" | awk -F/ -v ex=\"$EX\" '{n=$1/$2; if (n>=ex-0.5 && n<=ex+0.5) print \"OK\"; else printf \"FAIL:%.1f_ex=%s\\n\", n, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch0 bitrate ~ edgeconf bps[1] (±20%) — latest finalized session
      command: "EX=$(jq -r '.VHL_CAM.i2c2.ch0.bps[1] // 0' /root/shared_v/edgeconf_pim.json); [ \"$EX\" = \"0\" ] && { echo OK; exit 0; }; BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recording -name \"*${SESS}*-ch0.mp4\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$F\" ] && BR=$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$BR\" | awk -v ex=\"$EX\" '{br=$1/1000; if (br>=ex*0.8 && br<=ex*1.2) print \"OK\"; else printf \"FAIL:%dkbps_ex=%dkbps\\n\", br, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch1 bitrate ~ edgeconf bps[1] (±20%) — latest finalized session
      command: "EX=$(jq -r '.VHL_CAM.i2c2.ch1.bps[1] // 0' /root/shared_v/edgeconf_pim.json); [ \"$EX\" = \"0\" ] && { echo OK; exit 0; }; BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recording -name \"*${SESS}*-ch1.mp4\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$F\" ] && BR=$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$BR\" | awk -v ex=\"$EX\" '{br=$1/1000; if (br>=ex*0.8 && br<=ex*1.2) print \"OK\"; else printf \"FAIL:%dkbps_ex=%dkbps\\n\", br, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: 최근 2분 내 .srt 파일 0건 (srt_enable=false 실측)
      command: find /mnt/sd_cam /dev/shm/recording \( -name '*.srt' -o -name '*.srt.part' \) -mmin -2 2>/dev/null | wc -l | tr -d ' '
      expected: '0'
      on_fail: srt_enable=false인데 .srt 파일 생성됨
    # === i2c register (vflip/hflip/AE/AWB) ===
    - name: ch0 ROTATION (vflip=F hflip=T → 0x0001)
      command: i2ctransfer -f -y 2 w2@0x11 0x10 0x0c r2 2>/dev/null | tr -d ' '
      expected: '0x000x01'
    - name: ch1 ROTATION (vflip=F hflip=F → 0x0000)
      command: i2ctransfer -f -y 2 w2@0x12 0x10 0x0c r2 2>/dev/null | tr -d ' '
      expected: '0x000x00'
    - name: ch0 AE_CTRL (ae_on=false)
      command: i2ctransfer -f -y 2 w2@0x11 0x50 0x02 r2 2>/dev/null | tr -d ' '
      expected: '0x020x90'
    - name: ch1 AE_CTRL (ae_on=true)
      command: i2ctransfer -f -y 2 w2@0x12 0x50 0x02 r2 2>/dev/null | tr -d ' '
      expected: '0x020x99'
    - name: ch0 AWB_CTRL (auto)
      command: i2ctransfer -f -y 2 w2@0x11 0x51 0x00 r2 2>/dev/null | tr -d ' '
      expected: '0x110x5f'
    - name: ch1 AWB_CTRL (d65)
      command: i2ctransfer -f -y 2 w2@0x12 0x51 0x00 r2 2>/dev/null | tr -d ' '
      expected: '0x110x55'
    - name: bus2 EXP_TIME (2000us = 0x07d0)
      command: i2ctransfer -f -y 2 w2@0x11 0x50 0x0c r4 2>/dev/null | tr -d ' '
      expected: '0x000x000x070xd0'
    - name: dmesg max9296_fsync fps (expected 30)
      command: "dmesg 2>/dev/null | grep -oE 'max9296_fsync( [a-z-]+)? fps : [0-9]+' | grep -oE '[0-9]+$' | sort -u | tr '\\n' ',' | sed 's/,$//'"
      expected: '30'
      on_fail: dmesg max9296_fsync fps 30과 다름 (HW level)
    - name: ch0 led_flash (enable=T, wiper=16)
      command: jq -r '.VHL_CAM.i2c2.ch0.led_flash | "\(.enable)|\(.wiper)"' /root/shared_v/edgeconf_pim.json
      expected: 'true|16'
    - name: ch1 led_flash (enable=F, wiper=32)
      command: jq -r '.VHL_CAM.i2c2.ch1.led_flash | "\(.enable)|\(.wiper)"' /root/shared_v/edgeconf_pim.json
      expected: 'false|32'
    - name: ch0 mp4 duration ~ recording_time*60s (±5s) — boot 이후 두 번째 finalize (분 경계 정렬 segment)
      command: "EX=$(jq -r '.VHL_CAM.recording_time' /root/shared_v/edgeconf_pim.json); BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recording -name \"*${SESS}*-ch0.mp4\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$F\" ] && D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 \"$F\" 2>/dev/null | cut -d. -f1) && echo \"$D\" | awk -v ex=$((EX*60)) '{if ($1>=ex-5 && $1<=ex+5) print \"OK\"; else printf \"FAIL:%ds_ex=%ds\\n\", $1, ex}' || echo FAIL:NO_FILE"
      expected: OK
    # === disabled channels (ch enable=false → mp4 0건이어야 함) ===
    - name: ch2 disabled (i2c1.ch2.enable=false → mp4 0건)
      command: find /mnt/sd_cam /dev/shm/recording \( -name '*-ch2.mp4' -o -name '*-ch2.mp4.part' \) -mmin -3 2>/dev/null | wc -l | tr -d ' '
      expected: '0'
      on_fail: ch2 disabled인데 mp4 생성됨
    - name: ch3 disabled (i2c1.ch3.enable=false → mp4 0건)
      command: find /mnt/sd_cam /dev/shm/recording \( -name '*-ch3.mp4' -o -name '*-ch3.mp4.part' \) -mmin -3 2>/dev/null | wc -l | tr -d ' '
      expected: '0'
      on_fail: ch3 disabled인데 mp4 생성됨
