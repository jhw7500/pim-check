# Multi-channel unique-settings (1ch '1ch_3', 720p)
# 1 reboot으로 채널별 다른 설정 동시 검증.
# Resolution: 720p (1280x720, 30fps)
# Active channels: [3]
# i2c addrs: [(3, '0x3c')]
# CPU range: gst_range=[0, 30] (1ch × 720p)
# Thermal: warn=88°C, max=93°C (base 동일)
# 검증: ROTATION/AE_CTRL/AE_GAIN/AWB_CTRL/EXP_TIME/BITRATE/FPS/
#       file_integrity/per-ch cam_state/duration/CPU/thermal
# stabilize_sec=75 (60s 녹화 + 15s buffer)
# 자동 생성: /tmp/gen_multi_cases.py (1회용 scaffolding, 폐기됨)
name: '[multi] 1ch 1ch_3 720p'
description: '1-channel "1ch_3" combination at 720p with channel-unique settings'
tags: [multi, comprehensive]

setup:

  edgeconf_changes:
    .VHL_CAM.cam_width: 1280
    .VHL_CAM.cam_height: 720
    .VHL_CAM.fps: 30
    .VHL_CAM.recording_time: 1
    .VHL_CAM.muxer: mp4
    .VHL_CAM.capture.enable: false
    .VHL_CAM.i2c1.exp_time: 20000
    .VHL_CAM.i2c2.ch0.enable: false
    .VHL_CAM.i2c2.ch1.enable: false
    .VHL_CAM.i2c1.ch2.enable: false
    .VHL_CAM.i2c1.ch3.enable: true
    .VHL_CAM.i2c1.ch3.vflip: false
    .VHL_CAM.i2c1.ch3.hflip: false
    .VHL_CAM.i2c1.ch3.ae_on: false
    .VHL_CAM.i2c1.ch3.ae_gain: 512
    .VHL_CAM.i2c1.ch3.bps:
      - 2048
      - 2048
    .VHL_CAM.i2c1.ch3.awb: "d75"
  reboot_after: true
  stabilize_sec: 120

checks:
  cam_state:
    dir: /tmp/cam_state
    expected_state: healthy
    max_streak: 0
  recording:
    expected_channels: 1
  cpu:
    gst_range: [0, 120]
  thermal:
    warn_temp_c: 88
    max_temp_c: 93
  custom_commands:
  - name: ch3 ROTATION (vflip=false, hflip=false)
    command: i2ctransfer -f -y 1 w2@0x3c 0x10 0x0c r2 2>/dev/null | tr -d ' '
    expected: '0x000x00'
    on_fail: ch3 ROTATION 미반영
  - name: ch3 AE_CTRL (ae_on=false)
    command: i2ctransfer -f -y 1 w2@0x3c 0x50 0x02 r2 2>/dev/null | tr -d ' '
    expected: '0x020x90'
    on_fail: ch3 AE_CTRL 미반영
  - name: ch3 AWB_CTRL (awb=d75)
    command: i2ctransfer -f -y 1 w2@0x3c 0x51 0x00 r2 2>/dev/null | tr -d ' '
    expected: '0x110x56'
    on_fail: ch3 AWB_CTRL 미반영
  - name: ch3 AE_GAIN (gain=512, manual mode)
    command: i2ctransfer -f -y 1 w2@0x3c 0x50 0x06 r2 2>/dev/null | tr -d ' '
    expected: '0x020x00'
    on_fail: ch3 AE_GAIN 미반영
  - name: bus1 EXP_TIME (20000us)
    command: i2ctransfer -f -y 1 w2@0x3c 0x50 0x0c r4 2>/dev/null | tr -d ' '
    expected: '0x000x000x4e0x20'
    on_fail: bus1 EXP_TIME 미반영
  - name: ch3 cam_state error count
    command: |-
      F=/tmp/cam_state/channels/ch3_error
      [ ! -f $F ] && echo FAIL:NO_FILE && exit 0
      E=$(cat $F 2>/dev/null | tr -d ' \n')
      [ -z "$E" ] || [ "$E" = "0" ] || [ "$E" = "false" ] && echo OK || echo FAIL:err=$E
    expected: 'OK'
    on_fail: 'ch3 에러 카운트 발생'
  - name: ch3 cam_state last_ok freshness (<30s)
    command: |-
      F=/tmp/cam_state/channels/ch3_last_ok
      [ ! -f $F ] && echo FAIL:NO_FILE && exit 0
      L=$(cat $F 2>/dev/null | tr -d ' \n')
      [ -z "$L" ] && echo FAIL:EMPTY || echo OK
    expected: 'OK'
    on_fail: 'ch3 last_ok이 stale (frame drop 또는 채널 죽음)'
  - name: ch3 BITRATE (~2048kbps ±20%, file-delta 5s)
    command: |-
      F=$(find /dev/shm/recordings /mnt/sd_cam -name '*-ch3.mp4' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)
      [ -z "$F" ] && echo FAIL:NO_FILE && exit 0
      BR=$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of csv=p=0 "$F" 2>/dev/null)
      [ -z "$BR" ] && echo FAIL:NO_BR && exit 0
      K=$((BR / 1000)); [ $K -ge 1638 ] && [ $K -le 2457 ] && echo OK || echo FAIL:${K}kbps
    expected: 'OK'
    on_fail: 'ch3 실측 bitrate 범위(1638~2457kbps) 벗어남'
  - name: ch3 파일 무결성 (codec=h264, 1280x720, .mp4)
    command: |-
      F=$(find /dev/shm/recordings /mnt/sd_cam -name '*-ch3.mp4' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)
      [ -z "$F" ] && echo FAIL:NO_FILE && exit 0
      EXT="${F##*.}"
      [ "$EXT" != "mp4" ] && echo FAIL:ext=$EXT && exit 0
      P=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=nw=1 "$F" 2>/dev/null)
      echo "$P" | grep -qE '^codec_name=h264$' || (echo FAIL:codec_$(echo "$P" | grep codec_name) && exit 0)
      echo "$P" | grep -qE '^width=1280$' || (echo FAIL:width_$(echo "$P" | grep width) && exit 0)
      echo "$P" | grep -qE '^height=720$' || (echo FAIL:height_$(echo "$P" | grep height) && exit 0)
      echo OK
    expected: 'OK'
    on_fail: 'ch3 파일 무결성 (codec/dim/ext) 미일치'
  - name: ch3 duration (~60s ±5s)
    command: |-
      F=$(find /dev/shm/recordings /mnt/sd_cam -name '*-ch3.mp4' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)
      [ -z "$F" ] && echo FAIL:NO_FILE && exit 0
      D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F" 2>/dev/null | cut -d. -f1)
      [ -z "$D" ] && echo FAIL:NO_DUR && exit 0
      LO=$(( 60 - 5 )); HI=$(( 60 + 5 ))
      [ $D -ge $LO ] && [ $D -le $HI ] && echo OK || echo FAIL:dur=${D}s
    expected: 'OK'
    on_fail: 'ch3 녹화 길이 60s ±5s 벗어남'
  - name: dmesg max9296_fsync fps (expected 30)
    command: |-
      F=$(dmesg 2>/dev/null | grep -oE 'max9296_fsync fps : [0-9]+' | grep -oE '[0-9]+$' | sort -u | tr '\n' ',' | sed 's/,$//')
      [ -z "$F" ] && echo FAIL:NO_DMESG && exit 0
      [ "$F" = "30" ] && echo OK || echo FAIL:got=$F
    expected: 'OK'
    on_fail: 'dmesg max9296_fsync fps 30와 다름'
