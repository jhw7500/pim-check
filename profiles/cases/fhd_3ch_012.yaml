# FHD 3채널 (ch0+ch1+ch2) — smoke 통합 케이스
# i2c2 dual (ch0+ch1) + i2c1 single (ch2) — 다양한 bus 조합 + 30fps + multi-axis
name: "FHD 3채널 (ch0+ch1+ch2)"
description: "fhd × ch0+ch1+ch2 × 30fps + i2c reg + fps/bps + srt 통합"
tags: [smoke, camera]

setup:
  edgeconf_changes:
    ".VHL_CAM.cam_width": 1920
    ".VHL_CAM.cam_height": 1080
    ".VHL_CAM.fps": 30
    ".VHL_CAM.recording_time": 1
    ".VHL_CAM.muxer": mp4
    ".VHL_CAM.capture.enable": false
    ".VHL_CAM.i2c2.exp_time": 20000
    ".VHL_CAM.i2c1.exp_time": 25000
    ".VHL_CAM.i2c2.ch0.enable": true
    ".VHL_CAM.i2c2.ch1.enable": true
    ".VHL_CAM.i2c1.ch2.enable": true
    ".VHL_CAM.i2c1.ch3.enable": false
    ".VHL_CAM.i2c2.ch0.vflip": false
    ".VHL_CAM.i2c2.ch0.hflip": true
    ".VHL_CAM.i2c2.ch0.ae_on": false
    ".VHL_CAM.i2c2.ch0.ae_gain": 8192
    ".VHL_CAM.i2c2.ch0.awb": "auto"
    ".VHL_CAM.i2c2.ch0.bps":
      - 1024
      - 1024
    ".VHL_CAM.i2c2.ch1.vflip": false
    ".VHL_CAM.i2c2.ch1.hflip": false
    ".VHL_CAM.i2c2.ch1.ae_on": true
    ".VHL_CAM.i2c2.ch1.awb": "d65"
    ".VHL_CAM.i2c2.ch1.bps":
      - 2048
      - 2048
    ".VHL_CAM.i2c1.ch2.vflip": true
    ".VHL_CAM.i2c1.ch2.hflip": false
    ".VHL_CAM.i2c1.ch2.ae_on": true
    ".VHL_CAM.i2c1.ch2.awb": "off"
    ".VHL_CAM.i2c1.ch2.bps":
      - 4096
      - 4096
    ".VHL_CAM.i2c2.ch0.led_flash.enable": false
    ".VHL_CAM.i2c2.ch0.led_flash.wiper": 10
    ".VHL_CAM.i2c2.ch1.led_flash.enable": true
    ".VHL_CAM.i2c2.ch1.led_flash.wiper": 30
    ".VHL_CAM.i2c1.ch2.led_flash.enable": false
    ".VHL_CAM.i2c1.ch2.led_flash.wiper": 50
  ord_vcm_changes:
    .VCM.srt_enable: true
  reboot_after: true
  stabilize_sec: 200

checks:
  cpu:
    gst_range: [5, 340]
  recording:
    expected_channels: 3
  custom_commands:
    # === i2c register ===
    - name: ch0 ROTATION (vflip=F hflip=T → 0x0001)
      command: i2ctransfer -f -y 2 w2@0x11 0x10 0x0c r2 2>/dev/null | tr -d ' '
      expected: '0x000x01'
    - name: ch1 ROTATION (vflip=F hflip=F → 0x0000)
      command: i2ctransfer -f -y 2 w2@0x12 0x10 0x0c r2 2>/dev/null | tr -d ' '
      expected: '0x000x00'
    - name: ch2 ROTATION (vflip=T hflip=F → 0x0002)
      command: i2ctransfer -f -y 1 w2@0x3c 0x10 0x0c r2 2>/dev/null | tr -d ' '
      expected: '0x000x02'
    - name: ch0 AE_CTRL (ae_on=false)
      command: i2ctransfer -f -y 2 w2@0x11 0x50 0x02 r2 2>/dev/null | tr -d ' '
      expected: '0x020x90'
    - name: ch1 AE_CTRL (ae_on=true)
      command: i2ctransfer -f -y 2 w2@0x12 0x50 0x02 r2 2>/dev/null | tr -d ' '
      expected: '0x020x99'
    - name: ch2 AE_CTRL (ae_on=true)
      command: i2ctransfer -f -y 1 w2@0x3c 0x50 0x02 r2 2>/dev/null | tr -d ' '
      expected: '0x020x99'
    - name: ch0 AWB_CTRL (auto)
      command: i2ctransfer -f -y 2 w2@0x11 0x51 0x00 r2 2>/dev/null | tr -d ' '
      expected: '0x110x5f'
    - name: ch1 AWB_CTRL (d65)
      command: i2ctransfer -f -y 2 w2@0x12 0x51 0x00 r2 2>/dev/null | tr -d ' '
      expected: '0x110x55'
    - name: ch2 AWB_CTRL (off)
      command: i2ctransfer -f -y 1 w2@0x3c 0x51 0x00 r2 2>/dev/null | tr -d ' '
      expected: '0x110x50'
    - name: bus2 EXP_TIME (20000us = 0x4e20)
      command: i2ctransfer -f -y 2 w2@0x11 0x50 0x0c r4 2>/dev/null | tr -d ' '
      expected: '0x000x000x4e0x20'
    - name: bus1 EXP_TIME (25000us = 0x61a8)
      command: i2ctransfer -f -y 1 w2@0x3c 0x50 0x0c r4 2>/dev/null | tr -d ' '
      expected: '0x000x000x610xa8'
    - name: dmesg max9296_fsync fps (expected 30)
      command: "dmesg 2>/dev/null | grep -oE 'max9296_fsync fps : [0-9]+' | grep -oE '[0-9]+$' | sort -u | tr '\\n' ',' | sed 's/,$//'"
      expected: '30'
      on_fail: dmesg max9296_fsync fps 30과 다름
    - name: ch0 led_flash (F/10)
      command: jq -r '.VHL_CAM.i2c2.ch0.led_flash | "\(.enable)|\(.wiper)"' /root/shared_v/edgeconf_pim.json
      expected: 'false|10'
    - name: ch1 led_flash (T/30)
      command: jq -r '.VHL_CAM.i2c2.ch1.led_flash | "\(.enable)|\(.wiper)"' /root/shared_v/edgeconf_pim.json
      expected: 'true|30'
    - name: ch2 led_flash (F/50)
      command: jq -r '.VHL_CAM.i2c1.ch2.led_flash | "\(.enable)|\(.wiper)"' /root/shared_v/edgeconf_pim.json
      expected: 'false|50'
    # === ffprobe fps × 3ch ===
    - name: ch0 mp4 fps == 30 (±0.5)
      command: "EX=$(jq -r '.VHL_CAM.fps' /root/shared_v/edgeconf_pim.json); BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recording -name \"*${SESS}*-ch0.mp4\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$F\" ] && FR=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$FR\" | awk -F/ -v ex=\"$EX\" '{n=$1/$2; if (n>=ex-0.5 && n<=ex+0.5) print \"OK\"; else printf \"FAIL:%.1f_ex=%s\\n\", n, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch1 mp4 fps == 30 (±0.5)
      command: "EX=$(jq -r '.VHL_CAM.fps' /root/shared_v/edgeconf_pim.json); BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recording -name \"*${SESS}*-ch1.mp4\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$F\" ] && FR=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$FR\" | awk -F/ -v ex=\"$EX\" '{n=$1/$2; if (n>=ex-0.5 && n<=ex+0.5) print \"OK\"; else printf \"FAIL:%.1f_ex=%s\\n\", n, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch2 mp4 fps == 30 (±0.5)
      command: "EX=$(jq -r '.VHL_CAM.fps' /root/shared_v/edgeconf_pim.json); BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recording -name \"*${SESS}*-ch2.mp4\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$F\" ] && FR=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$FR\" | awk -F/ -v ex=\"$EX\" '{n=$1/$2; if (n>=ex-0.5 && n<=ex+0.5) print \"OK\"; else printf \"FAIL:%.1f_ex=%s\\n\", n, ex}' || echo FAIL:NO_FILE"
      expected: OK
    # === ffprobe bitrate × 3ch ===
    - name: ch0 bitrate ~ 1024k (±20%)
      command: "EX=$(jq -r '.VHL_CAM.i2c2.ch0.bps[1] // 0' /root/shared_v/edgeconf_pim.json); BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recording -name \"*${SESS}*-ch0.mp4\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$F\" ] && BR=$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$BR\" | awk -v ex=\"$EX\" '{br=$1/1000; if (br>=ex*0.8 && br<=ex*1.2) print \"OK\"; else printf \"FAIL:%dkbps_ex=%dkbps\\n\", br, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch1 bitrate ~ 2048k (±20%)
      command: "EX=$(jq -r '.VHL_CAM.i2c2.ch1.bps[1] // 0' /root/shared_v/edgeconf_pim.json); BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recording -name \"*${SESS}*-ch1.mp4\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$F\" ] && BR=$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$BR\" | awk -v ex=\"$EX\" '{br=$1/1000; if (br>=ex*0.8 && br<=ex*1.2) print \"OK\"; else printf \"FAIL:%dkbps_ex=%dkbps\\n\", br, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch2 bitrate ~ 4096k (±20%)
      command: "EX=$(jq -r '.VHL_CAM.i2c1.ch2.bps[1] // 0' /root/shared_v/edgeconf_pim.json); BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recording -name \"*${SESS}*-ch2.mp4\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$F\" ] && BR=$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$BR\" | awk -v ex=\"$EX\" '{br=$1/1000; if (br>=ex*0.8 && br<=ex*1.2) print \"OK\"; else printf \"FAIL:%dkbps_ex=%dkbps\\n\", br, ex}' || echo FAIL:NO_FILE"
      expected: OK
    # === srt enable=true 실측 ===
    - name: 최근 2분 내 .srt 파일 ≥1 (srt_enable=true 실측)
      command: find /mnt/sd_cam /dev/shm/recording \( -name '*.srt' -o -name '*.srt.part' \) -mmin -2 2>/dev/null | wc -l | tr -d ' '
      expected_min: 1
    - name: ch0 mp4 duration ~ recording_time*60s (±5s)
      command: "EX=$(jq -r '.VHL_CAM.recording_time' /root/shared_v/edgeconf_pim.json); BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recording -name \"*${SESS}*-ch0.mp4\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$F\" ] && D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 \"$F\" 2>/dev/null | cut -d. -f1) && echo \"$D\" | awk -v ex=$((EX*60)) '{if ($1>=ex-5 && $1<=ex+5) print \"OK\"; else printf \"FAIL:%ds_ex=%ds\\n\", $1, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch0 mp4와 srt 동일 session prefix
      command: "M=$(find /mnt/sd_cam /dev/shm/recording -name '*-ch0.mp4' ! -name '*.part' -mmin -3 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); S=$(find /mnt/sd_cam /dev/shm/recording -name '*-data.srt' -mmin -2 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); MP=${M##*/}; MP=${MP%-ch0.mp4}; SP=${S##*/}; SP=${SP%-data.srt}; [ -n \"$MP\" ] && [ -n \"$SP\" ] && [ \"$MP\" = \"$SP\" ] && echo OK || echo \"MISMATCH mp4=$MP srt=$SP\""
      expected: OK
      on_fail: mp4와 srt가 같은 session에 생성 안 됨
    - name: ch0 mp4와 srt 종료 시간 ±5s
      command: "M=$(find /mnt/sd_cam /dev/shm/recording -name '*-ch0.mp4' ! -name '*.part' -mmin -3 -printf '%T@\\n' 2>/dev/null | sort -n | tail -1 | cut -d. -f1); S=$(find /mnt/sd_cam /dev/shm/recording -name '*-data.srt' -mmin -2 -printf '%T@\\n' 2>/dev/null | sort -n | tail -1 | cut -d. -f1); D=$((M-S)); A=${D#-}; [ \"$A\" -le 5 ] && echo OK || echo \"FAIL:diff=${D}s\""
      expected: OK
    # === disabled channels (ch enable=false → mp4 0건이어야 함) ===
    - name: ch3 disabled (i2c1.ch3.enable=false → mp4 0건)
      command: find /mnt/sd_cam /dev/shm/recording \( -name '*-ch3.mp4' -o -name '*-ch3.mp4.part' \) -mmin -3 2>/dev/null | wc -l | tr -d ' '
      expected: '0'
      on_fail: ch3 disabled인데 mp4 생성됨
