# Read-only ORD/VCM integration sanity. No OHT request is generated.
# This is config/process/TCP/recording-state integration, NOT proof that an
# external OHT request triggers an actual file end-to-end.
name: "Verify: ORD/VCM Integration Sanity"
description: "ORD/VCM process, configured TCP endpoints and shared recording config (read-only)"
tags: [ord, vcm, integration, read_only]

monitor:
  duration_sec: 0

checks:
  processes:
    required:
      - gstApp
      - BG_Check_for_pim
      - chk_cam_operate
      - ord
      - vcm
    optional: []  # base의 optional ord/vcm 중복을 제거 (여기서는 필수)

  custom_commands:
    - name: "ORD/VCM config parsed"
      command: >-
        jq -e '(.ORD | type == "object") and (.VCM | type == "object")'
        /root/shared_v/ord_vcm_conf.json >/dev/null 2>&1 && echo OK || echo INVALID_CONFIG
      expected: "OK"
      on_fail: "ORD/VCM 설정 파일 또는 JSON 구조 불량"

    - name: "ORD uses configured TCP endpoint"
      command: >-
        P=$(jq -er '.ORD.port_num | tonumber | select(. >= 1 and . <= 65535 and . == floor)'
        /root/shared_v/ord_vcm_conf.json 2>/dev/null) ||
        { echo INVALID_PORT; exit 0; };
        timeout 3 bash -c ": </dev/tcp/127.0.0.1/$P" 2>/dev/null &&
        echo OK || echo TCP_CONNECT_FAILED
      expected: "OK"
      on_fail: "ORD 실제 포트가 ord_vcm_conf.json 설정대로 연결되지 않음"

    - name: "VCM uses configured TCP endpoint"
      command: >-
        P=$(jq -er '.VCM.port_num | tonumber | select(. >= 1 and . <= 65535 and . == floor)'
        /root/shared_v/ord_vcm_conf.json 2>/dev/null) ||
        { echo INVALID_PORT; exit 0; };
        timeout 3 bash -c ": </dev/tcp/127.0.0.1/$P" 2>/dev/null &&
        echo OK || echo TCP_CONNECT_FAILED
      expected: "OK"
      on_fail: "VCM 실제 포트가 ord_vcm_conf.json 설정대로 연결되지 않음"

    - name: "ORD event_auto_remove agrees with camera"
      command: >-
        jq -es 'length == 2 and
        (.[0].VHL_CAM | has("event_auto_remove")) and
        (.[1].ORD | has("event_auto_remove")) and
        (.[0].VHL_CAM.event_auto_remove == .[1].ORD.event_auto_remove)'
        /root/shared_v/edgeconf_pim.json /root/shared_v/ord_vcm_conf.json
        >/dev/null 2>&1 && echo MATCH || echo MISMATCH
      expected: "MATCH"
      on_fail: "edgeconf 와 ORD event_auto_remove 불일치/누락"

    - name: "ORD disk management config valid"
      command: >-
        jq -e '.ORD.disk_manage == true and
        (.ORD.disk_limit_per | type == "number") and
        (.ORD.disk_limit_per >= 1 and .ORD.disk_limit_per <= 100)'
        /root/shared_v/ord_vcm_conf.json >/dev/null 2>&1 &&
        echo OK || echo INVALID_DISK_POLICY
      expected: "OK"
      on_fail: "ORD 디스크 관리 설정이 비활성/범위 밖"

    - name: "VCM recording config valid"
      command: >-
        jq -e '(.VCM.srt_enable | type == "boolean") and
        (.VCM.file_time_check | type == "boolean")'
        /root/shared_v/ord_vcm_conf.json >/dev/null 2>&1 &&
        echo OK || echo INVALID_VCM_CONFIG
      expected: "OK"
      on_fail: "VCM SRT/파일 시간 설정이 누락 또는 잘못된 타입"

    - name: "VCM recording-state path available"
      command: >-
        test -d /tmp/cam_state/recording && echo OK || echo NO_RECORDING_STATE
      expected: "OK"
      on_fail: "VCM 연동을 확인할 cam_state/recording 경로 없음"
