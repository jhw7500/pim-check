# 720p 4채널 모니터링
name: "720p 4채널"
description: "1280x720 4채널 테스트"

setup:
  edgeconf_changes:
    ".VHL_CAM.cam_width": 1280
    ".VHL_CAM.cam_height": 720
    ".VHL_CAM.i2c1.ch2.enable": true
    ".VHL_CAM.i2c1.ch3.enable": true
  reboot_after: true
  stabilize_sec: 30

checks:
  cpu:
    gst_range: [20, 80]
  recording:
    expected_channels: 4
    session_progress: "4/4"
