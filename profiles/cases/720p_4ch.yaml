# 720p 4채널 모니터링 (fps + bps 통합 검증)
name: "720p 4채널"
description: "1280x720 4채널 + fps/bps 실측 검증"
tags: [smoke, camera]

setup:
  edgeconf_changes:
    ".VHL_CAM.cam_width": 1280
    ".VHL_CAM.cam_height": 720
    ".VHL_CAM.fps": 30
    ".VHL_CAM.recording_time": 1
    ".VHL_CAM.muxer": mp4
    ".VHL_CAM.capture.enable": false
    ".VHL_CAM.i2c2.exp_time": 5000
    ".VHL_CAM.i2c1.exp_time": 10000
    ".VHL_CAM.i2c2.ch0.enable": true
    ".VHL_CAM.i2c2.ch1.enable": true
    ".VHL_CAM.i2c1.ch2.enable": true
    ".VHL_CAM.i2c1.ch3.enable": true
    ".VHL_CAM.i2c2.ch0.vflip": false
    ".VHL_CAM.i2c2.ch0.hflip": true
    ".VHL_CAM.i2c2.ch0.ae_on": false
    ".VHL_CAM.i2c2.ch0.ae_gain": 8192
    ".VHL_CAM.i2c2.ch0.awb": "auto"
    ".VHL_CAM.i2c2.ch1.vflip": false
    ".VHL_CAM.i2c2.ch1.hflip": false
    ".VHL_CAM.i2c2.ch1.ae_on": true
    ".VHL_CAM.i2c2.ch1.awb": "d65"
    ".VHL_CAM.i2c1.ch2.vflip": true
    ".VHL_CAM.i2c1.ch2.hflip": false
    ".VHL_CAM.i2c1.ch2.ae_on": true
    ".VHL_CAM.i2c1.ch2.awb": "off"
    ".VHL_CAM.i2c1.ch3.vflip": true
    ".VHL_CAM.i2c1.ch3.hflip": true
    ".VHL_CAM.i2c1.ch3.ae_on": false
    ".VHL_CAM.i2c1.ch3.ae_gain": 512
    ".VHL_CAM.i2c1.ch3.awb": "d75"
    ".VHL_CAM.i2c2.ch0.bps":
      - 1024
      - 1024
    ".VHL_CAM.i2c2.ch1.bps":
      - 2048
      - 2048
    ".VHL_CAM.i2c1.ch2.bps":
      - 4096
      - 4096
    ".VHL_CAM.i2c1.ch3.bps":
      - 8192
      - 8192
    ".VHL_CAM.i2c2.ch0.led_flash.enable": true
    ".VHL_CAM.i2c2.ch0.led_flash.wiper": 16
    ".VHL_CAM.i2c2.ch1.led_flash.enable": false
    ".VHL_CAM.i2c2.ch1.led_flash.wiper": 32
    ".VHL_CAM.i2c1.ch2.led_flash.enable": true
    ".VHL_CAM.i2c1.ch2.led_flash.wiper": 48
    ".VHL_CAM.i2c1.ch3.led_flash.enable": false
    ".VHL_CAM.i2c1.ch3.led_flash.wiper": 63
  ord_vcm_changes:
    .VCM.srt_enable: true
  reboot_after: true
  stabilize_sec: 200

checks:
  cpu:
    gst_range: [0, 320]
  recording:
    expected_channels: 4
  custom_commands:
    - name: ch0 mp4 fps == edgeconf fps (±0.5)
      command: "EX=$(jq -r '.VHL_CAM.fps' /root/shared_v/edgeconf_pim.json); BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recording -name \"*${SESS}*-ch0.mp4\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$F\" ] && FR=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$FR\" | awk -F/ -v ex=\"$EX\" '{n=$1/$2; if (n>=ex-0.5 && n<=ex+0.5) print \"OK\"; else printf \"FAIL:%.1f_ex=%s\\n\", n, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch1 mp4 fps == edgeconf fps (±0.5)
      command: "EX=$(jq -r '.VHL_CAM.fps' /root/shared_v/edgeconf_pim.json); BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recording -name \"*${SESS}*-ch1.mp4\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$F\" ] && FR=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$FR\" | awk -F/ -v ex=\"$EX\" '{n=$1/$2; if (n>=ex-0.5 && n<=ex+0.5) print \"OK\"; else printf \"FAIL:%.1f_ex=%s\\n\", n, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch2 mp4 fps == edgeconf fps (±0.5)
      command: "EX=$(jq -r '.VHL_CAM.fps' /root/shared_v/edgeconf_pim.json); BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recording -name \"*${SESS}*-ch2.mp4\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$F\" ] && FR=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$FR\" | awk -F/ -v ex=\"$EX\" '{n=$1/$2; if (n>=ex-0.5 && n<=ex+0.5) print \"OK\"; else printf \"FAIL:%.1f_ex=%s\\n\", n, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch3 mp4 fps == edgeconf fps (±0.5)
      command: "EX=$(jq -r '.VHL_CAM.fps' /root/shared_v/edgeconf_pim.json); BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recording -name \"*${SESS}*-ch3.mp4\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$F\" ] && FR=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$FR\" | awk -F/ -v ex=\"$EX\" '{n=$1/$2; if (n>=ex-0.5 && n<=ex+0.5) print \"OK\"; else printf \"FAIL:%.1f_ex=%s\\n\", n, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch0 bitrate ~ edgeconf bps[1] (±20%)
      command: "EX=$(jq -r '.VHL_CAM.i2c2.ch0.bps[1] // 0' /root/shared_v/edgeconf_pim.json); [ \"$EX\" = \"0\" ] && { echo OK; exit 0; }; BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recording -name \"*${SESS}*-ch0.mp4\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$F\" ] && BR=$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$BR\" | awk -v ex=\"$EX\" '{br=$1/1000; if (br>=ex*0.8 && br<=ex*1.2) print \"OK\"; else printf \"FAIL:%dkbps_ex=%dkbps\\n\", br, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch1 bitrate ~ edgeconf bps[1] (±20%)
      command: "EX=$(jq -r '.VHL_CAM.i2c2.ch1.bps[1] // 0' /root/shared_v/edgeconf_pim.json); [ \"$EX\" = \"0\" ] && { echo OK; exit 0; }; BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recording -name \"*${SESS}*-ch1.mp4\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$F\" ] && BR=$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$BR\" | awk -v ex=\"$EX\" '{br=$1/1000; if (br>=ex*0.8 && br<=ex*1.2) print \"OK\"; else printf \"FAIL:%dkbps_ex=%dkbps\\n\", br, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch2 bitrate ~ edgeconf bps[1] (±20%)
      command: "EX=$(jq -r '.VHL_CAM.i2c1.ch2.bps[1] // 0' /root/shared_v/edgeconf_pim.json); [ \"$EX\" = \"0\" ] && { echo OK; exit 0; }; BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recording -name \"*${SESS}*-ch2.mp4\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$F\" ] && BR=$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$BR\" | awk -v ex=\"$EX\" '{br=$1/1000; if (br>=ex*0.8 && br<=ex*1.2) print \"OK\"; else printf \"FAIL:%dkbps_ex=%dkbps\\n\", br, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch3 bitrate ~ edgeconf bps[1] (±20%)
      command: "EX=$(jq -r '.VHL_CAM.i2c1.ch3.bps[1] // 0' /root/shared_v/edgeconf_pim.json); [ \"$EX\" = \"0\" ] && { echo OK; exit 0; }; BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recording -name \"*${SESS}*-ch3.mp4\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$F\" ] && BR=$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$BR\" | awk -v ex=\"$EX\" '{br=$1/1000; if (br>=ex*0.8 && br<=ex*1.2) print \"OK\"; else printf \"FAIL:%dkbps_ex=%dkbps\\n\", br, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: 최근 2분 내 .srt 파일 ≥1 (srt_enable=true 실측)
      command: find /mnt/sd_cam /dev/shm/recording \( -name '*.srt' -o -name '*.srt.part' \) -mmin -2 2>/dev/null | wc -l | tr -d ' '
      expected_min: 1
      on_fail: srt_enable=true인데 .srt 파일 미생성
    # === i2c register (vflip/hflip/AE/AWB) — 4ch unique signature ===
    - name: ch0 ROTATION (FT → 0x0001)
      command: i2ctransfer -f -y 2 w2@0x11 0x10 0x0c r2 2>/dev/null | tr -d ' '
      expected: '0x000x01'
    - name: ch1 ROTATION (FF → 0x0000)
      command: i2ctransfer -f -y 2 w2@0x12 0x10 0x0c r2 2>/dev/null | tr -d ' '
      expected: '0x000x00'
    - name: ch2 ROTATION (TF → 0x0002)
      command: i2ctransfer -f -y 1 w2@0x11 0x10 0x0c r2 2>/dev/null | tr -d ' '
      expected: '0x000x02'
    - name: ch3 ROTATION (TT → 0x0003)
      command: i2ctransfer -f -y 1 w2@0x12 0x10 0x0c r2 2>/dev/null | tr -d ' '
      expected: '0x000x03'
    - name: ch0 AE_CTRL (ae=F)
      command: i2ctransfer -f -y 2 w2@0x11 0x50 0x02 r2 2>/dev/null | tr -d ' '
      expected: '0x020x90'
    - name: ch1 AE_CTRL (ae=T)
      command: i2ctransfer -f -y 2 w2@0x12 0x50 0x02 r2 2>/dev/null | tr -d ' '
      expected: '0x020x99'
    - name: ch2 AE_CTRL (ae=T)
      command: i2ctransfer -f -y 1 w2@0x11 0x50 0x02 r2 2>/dev/null | tr -d ' '
      expected: '0x020x99'
    - name: ch3 AE_CTRL (ae=F)
      command: i2ctransfer -f -y 1 w2@0x12 0x50 0x02 r2 2>/dev/null | tr -d ' '
      expected: '0x020x90'
    - name: ch0 AWB_CTRL (auto)
      command: i2ctransfer -f -y 2 w2@0x11 0x51 0x00 r2 2>/dev/null | tr -d ' '
      expected: '0x110x5f'
    - name: ch1 AWB_CTRL (d65)
      command: i2ctransfer -f -y 2 w2@0x12 0x51 0x00 r2 2>/dev/null | tr -d ' '
      expected: '0x110x55'
    - name: ch2 AWB_CTRL (off)
      command: i2ctransfer -f -y 1 w2@0x11 0x51 0x00 r2 2>/dev/null | tr -d ' '
      expected: '0x110x50'
    - name: ch3 AWB_CTRL (d75)
      command: i2ctransfer -f -y 1 w2@0x12 0x51 0x00 r2 2>/dev/null | tr -d ' '
      expected: '0x110x56'
    - name: bus2 EXP_TIME (5000us = 0x1388)
      command: i2ctransfer -f -y 2 w2@0x11 0x50 0x0c r4 2>/dev/null | tr -d ' '
      expected: '0x000x000x130x88'
    - name: bus1 EXP_TIME (10000us = 0x2710)
      command: i2ctransfer -f -y 1 w2@0x11 0x50 0x0c r4 2>/dev/null | tr -d ' '
      expected: '0x000x000x270x10'
    - name: dmesg max9296_fsync fps (expected 30)
      command: "dmesg 2>/dev/null | grep -oE 'max9296_fsync( [a-z-]+)? fps : [0-9]+' | grep -oE '[0-9]+$' | sort -u | tr '\\n' ',' | sed 's/,$//'"
      expected: '30'
      on_fail: dmesg max9296_fsync fps 30과 다름 (HW level)
    - name: ch0 led_flash (T/16)
      command: jq -r '.VHL_CAM.i2c2.ch0.led_flash | "\(.enable)|\(.wiper)"' /root/shared_v/edgeconf_pim.json
      expected: 'true|16'
    - name: ch1 led_flash (F/32)
      command: jq -r '.VHL_CAM.i2c2.ch1.led_flash | "\(.enable)|\(.wiper)"' /root/shared_v/edgeconf_pim.json
      expected: 'false|32'
    - name: ch2 led_flash (T/48)
      command: jq -r '.VHL_CAM.i2c1.ch2.led_flash | "\(.enable)|\(.wiper)"' /root/shared_v/edgeconf_pim.json
      expected: 'true|48'
    - name: ch3 led_flash (F/63)
      command: jq -r '.VHL_CAM.i2c1.ch3.led_flash | "\(.enable)|\(.wiper)"' /root/shared_v/edgeconf_pim.json
      expected: 'false|63'
    - name: ch0 mp4 duration ~ recording_time*60s (±5s)
      command: "EX=$(jq -r '.VHL_CAM.recording_time' /root/shared_v/edgeconf_pim.json); BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recording -name \"*${SESS}*-ch0.mp4\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$F\" ] && D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 \"$F\" 2>/dev/null | cut -d. -f1) && echo \"$D\" | awk -v ex=$((EX*60)) '{if ($1>=ex-5 && $1<=ex+5) print \"OK\"; else printf \"FAIL:%ds_ex=%ds\\n\", $1, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch0 mp4와 srt sync (NR==2 session에서 둘 다 finalize)
      command: "BOOT=$(uptime -s); SESS=$(awk -v bt=\"$BOOT\" 'substr($0,1,19) > bt && /chk_cam_operate.sh.*completed/ && !/: 0 files/' /var/log/cantops/local0.log | awk 'NR==2' | grep -oE '[0-9]{8}_[0-9]{4}'); [ -z \"$SESS\" ] && { echo FAIL:NEED_2_FINALIZES_AFTER_BOOT; exit 0; }; M=$(find /mnt/sd_cam /dev/shm/recording -name \"*${SESS}*-ch0.mp4\" ! -name '*.part' 2>/dev/null | head -1); S=$(find /mnt/sd_cam /dev/shm/recording -name \"*${SESS}*-data.srt\" ! -name '*.part' 2>/dev/null | head -1); [ -n \"$M\" ] && [ -n \"$S\" ] && echo OK || echo \"MISMATCH sess=$SESS mp4=$M srt=$S\""
      expected: OK
      on_fail: 같은 session prefix에 mp4 또는 srt 누락 (보드 fw finalize 불일치)
