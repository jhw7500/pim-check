# 720p 4채널 모니터링 (fps + bps 통합 검증)
name: "720p 4채널"
description: "1280x720 4채널 + fps/bps 실측 검증"
tags: [smoke, camera]

setup:
  edgeconf_changes:
    ".VHL_CAM.cam_width": 1280
    ".VHL_CAM.cam_height": 720
    ".VHL_CAM.fps": 30
    ".VHL_CAM.muxer": mp4
    ".VHL_CAM.i2c2.ch0.enable": true
    ".VHL_CAM.i2c2.ch1.enable": true
    ".VHL_CAM.i2c1.ch2.enable": true
    ".VHL_CAM.i2c1.ch3.enable": true
    ".VHL_CAM.i2c2.ch0.bps":
      - 1024
      - 1024
    ".VHL_CAM.i2c2.ch1.bps":
      - 2048
      - 2048
    ".VHL_CAM.i2c1.ch2.bps":
      - 4096
      - 4096
    ".VHL_CAM.i2c1.ch3.bps":
      - 8192
      - 8192
  ord_vcm_changes:
    .VCM.srt_enable: true
  reboot_after: true
  stabilize_sec: 80

checks:
  cpu:
    gst_range: [0, 320]
  recording:
    expected_channels: 4
  custom_commands:
    - name: ch0 mp4 fps == edgeconf fps (±0.5)
      command: "EX=$(jq -r '.VHL_CAM.fps' /root/shared_v/edgeconf_pim.json); F=$(find /mnt/sd_cam /dev/shm/recording -name '*-ch0.mp4' -mmin -2 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); [ -n \"$F\" ] && FR=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$FR\" | awk -F/ -v ex=\"$EX\" '{n=$1/$2; if (n>=ex-0.5 && n<=ex+0.5) print \"OK\"; else printf \"FAIL:%.1f_ex=%s\\n\", n, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch1 mp4 fps == edgeconf fps (±0.5)
      command: "EX=$(jq -r '.VHL_CAM.fps' /root/shared_v/edgeconf_pim.json); F=$(find /mnt/sd_cam /dev/shm/recording -name '*-ch1.mp4' -mmin -2 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); [ -n \"$F\" ] && FR=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$FR\" | awk -F/ -v ex=\"$EX\" '{n=$1/$2; if (n>=ex-0.5 && n<=ex+0.5) print \"OK\"; else printf \"FAIL:%.1f_ex=%s\\n\", n, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch2 mp4 fps == edgeconf fps (±0.5)
      command: "EX=$(jq -r '.VHL_CAM.fps' /root/shared_v/edgeconf_pim.json); F=$(find /mnt/sd_cam /dev/shm/recording -name '*-ch2.mp4' -mmin -2 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); [ -n \"$F\" ] && FR=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$FR\" | awk -F/ -v ex=\"$EX\" '{n=$1/$2; if (n>=ex-0.5 && n<=ex+0.5) print \"OK\"; else printf \"FAIL:%.1f_ex=%s\\n\", n, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch3 mp4 fps == edgeconf fps (±0.5)
      command: "EX=$(jq -r '.VHL_CAM.fps' /root/shared_v/edgeconf_pim.json); F=$(find /mnt/sd_cam /dev/shm/recording -name '*-ch3.mp4' -mmin -2 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); [ -n \"$F\" ] && FR=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$FR\" | awk -F/ -v ex=\"$EX\" '{n=$1/$2; if (n>=ex-0.5 && n<=ex+0.5) print \"OK\"; else printf \"FAIL:%.1f_ex=%s\\n\", n, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch0 bitrate ~ edgeconf bps[1] (±20%)
      command: "EX=$(jq -r '.VHL_CAM.i2c2.ch0.bps[1] // 0' /root/shared_v/edgeconf_pim.json); [ \"$EX\" = \"0\" ] && { echo OK; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recording -name '*-ch0.mp4' -mmin -2 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); [ -n \"$F\" ] && BR=$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$BR\" | awk -v ex=\"$EX\" '{br=$1/1000; if (br>=ex*0.8 && br<=ex*1.2) print \"OK\"; else printf \"FAIL:%dkbps_ex=%dkbps\\n\", br, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch1 bitrate ~ edgeconf bps[1] (±20%)
      command: "EX=$(jq -r '.VHL_CAM.i2c2.ch1.bps[1] // 0' /root/shared_v/edgeconf_pim.json); [ \"$EX\" = \"0\" ] && { echo OK; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recording -name '*-ch1.mp4' -mmin -2 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); [ -n \"$F\" ] && BR=$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$BR\" | awk -v ex=\"$EX\" '{br=$1/1000; if (br>=ex*0.8 && br<=ex*1.2) print \"OK\"; else printf \"FAIL:%dkbps_ex=%dkbps\\n\", br, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch2 bitrate ~ edgeconf bps[1] (±20%)
      command: "EX=$(jq -r '.VHL_CAM.i2c1.ch2.bps[1] // 0' /root/shared_v/edgeconf_pim.json); [ \"$EX\" = \"0\" ] && { echo OK; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recording -name '*-ch2.mp4' -mmin -2 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); [ -n \"$F\" ] && BR=$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$BR\" | awk -v ex=\"$EX\" '{br=$1/1000; if (br>=ex*0.8 && br<=ex*1.2) print \"OK\"; else printf \"FAIL:%dkbps_ex=%dkbps\\n\", br, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch3 bitrate ~ edgeconf bps[1] (±20%)
      command: "EX=$(jq -r '.VHL_CAM.i2c1.ch3.bps[1] // 0' /root/shared_v/edgeconf_pim.json); [ \"$EX\" = \"0\" ] && { echo OK; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recording -name '*-ch3.mp4' -mmin -2 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); [ -n \"$F\" ] && BR=$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$BR\" | awk -v ex=\"$EX\" '{br=$1/1000; if (br>=ex*0.8 && br<=ex*1.2) print \"OK\"; else printf \"FAIL:%dkbps_ex=%dkbps\\n\", br, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: 최근 2분 내 .srt 파일 ≥1 (srt_enable=true 실측)
      command: find /mnt/sd_cam /dev/shm/recording \( -name '*.srt' -o -name '*.srt.part' \) -mmin -2 2>/dev/null | wc -l | tr -d ' '
      expected_min: 1
      on_fail: srt_enable=true인데 .srt 파일 미생성
