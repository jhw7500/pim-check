# FHD 4채널 고부하 테스트 (fps + bps 통합 검증)
name: "FHD 4채널 모니터링"
description: "1920x1080 4채널 고부하 + fps/bps 실측 검증 (VPU 1080@60p 초과 케이스)"
tags: [smoke, camera, stress]

setup:
  edgeconf_changes:
    ".VHL_CAM.cam_width": 1920
    ".VHL_CAM.cam_height": 1080
    ".VHL_CAM.fps": 15
    ".VHL_CAM.recording_time": 1
    ".VHL_CAM.muxer": mp4
    ".VHL_CAM.capture.enable": false
    ".VHL_CAM.i2c2.exp_time": 33000
    ".VHL_CAM.i2c1.exp_time": 50000
    ".VHL_CAM.i2c2.ch0.enable": true
    ".VHL_CAM.i2c2.ch1.enable": true
    ".VHL_CAM.i2c1.ch2.enable": true
    ".VHL_CAM.i2c1.ch3.enable": true
    ".VHL_CAM.i2c2.ch0.vflip": false
    ".VHL_CAM.i2c2.ch0.hflip": true
    ".VHL_CAM.i2c2.ch0.ae_on": false
    ".VHL_CAM.i2c2.ch0.ae_gain": 8192
    ".VHL_CAM.i2c2.ch0.awb": "auto"
    ".VHL_CAM.i2c2.ch1.vflip": false
    ".VHL_CAM.i2c2.ch1.hflip": false
    ".VHL_CAM.i2c2.ch1.ae_on": true
    ".VHL_CAM.i2c2.ch1.awb": "d65"
    ".VHL_CAM.i2c1.ch2.vflip": true
    ".VHL_CAM.i2c1.ch2.hflip": false
    ".VHL_CAM.i2c1.ch2.ae_on": true
    ".VHL_CAM.i2c1.ch2.awb": "off"
    ".VHL_CAM.i2c1.ch3.vflip": true
    ".VHL_CAM.i2c1.ch3.hflip": true
    ".VHL_CAM.i2c1.ch3.ae_on": false
    ".VHL_CAM.i2c1.ch3.ae_gain": 512
    ".VHL_CAM.i2c1.ch3.awb": "d75"
    ".VHL_CAM.i2c2.ch0.bps":
      - 1024
      - 1024
    ".VHL_CAM.i2c2.ch1.bps":
      - 2048
      - 2048
    ".VHL_CAM.i2c1.ch2.bps":
      - 4096
      - 4096
    ".VHL_CAM.i2c1.ch3.bps":
      - 8192
      - 8192
    ".VHL_CAM.i2c2.ch0.led_flash.enable": true
    ".VHL_CAM.i2c2.ch0.led_flash.wiper": 16
    ".VHL_CAM.i2c2.ch0.led_flash.flash_delay": 0
    ".VHL_CAM.i2c2.ch1.led_flash.enable": false
    ".VHL_CAM.i2c2.ch1.led_flash.wiper": 32
    ".VHL_CAM.i2c2.ch1.led_flash.flash_delay": 5
    ".VHL_CAM.i2c1.ch2.led_flash.enable": true
    ".VHL_CAM.i2c1.ch2.led_flash.wiper": 48
    ".VHL_CAM.i2c1.ch2.led_flash.flash_delay": 10
    ".VHL_CAM.i2c1.ch3.led_flash.enable": false
    ".VHL_CAM.i2c1.ch3.led_flash.wiper": 63
    ".VHL_CAM.i2c1.ch3.led_flash.flash_delay": 15
  ord_vcm_changes:
    .VCM.srt_enable: true
  reboot_after: true
  stabilize_sec: 100

checks:
  cpu:
    gst_range: [20, 380]
  thermal:
    warn_temp_c: 82
  recording:
    expected_channels: 4
  custom_commands:
    - name: ch0 mp4 fps == edgeconf fps (±0.5)
      command: "EX=$(jq -r '.VHL_CAM.fps' /root/shared_v/edgeconf_pim.json); F=$(find /mnt/sd_cam /dev/shm/recording -name '*-ch0.mp4' -mmin -2 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); [ -n \"$F\" ] && FR=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$FR\" | awk -F/ -v ex=\"$EX\" '{n=$1/$2; if (n>=ex-0.5 && n<=ex+0.5) print \"OK\"; else printf \"FAIL:%.1f_ex=%s\\n\", n, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch1 mp4 fps == edgeconf fps (±0.5)
      command: "EX=$(jq -r '.VHL_CAM.fps' /root/shared_v/edgeconf_pim.json); F=$(find /mnt/sd_cam /dev/shm/recording -name '*-ch1.mp4' -mmin -2 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); [ -n \"$F\" ] && FR=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$FR\" | awk -F/ -v ex=\"$EX\" '{n=$1/$2; if (n>=ex-0.5 && n<=ex+0.5) print \"OK\"; else printf \"FAIL:%.1f_ex=%s\\n\", n, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch2 mp4 fps == edgeconf fps (±0.5)
      command: "EX=$(jq -r '.VHL_CAM.fps' /root/shared_v/edgeconf_pim.json); F=$(find /mnt/sd_cam /dev/shm/recording -name '*-ch2.mp4' -mmin -2 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); [ -n \"$F\" ] && FR=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$FR\" | awk -F/ -v ex=\"$EX\" '{n=$1/$2; if (n>=ex-0.5 && n<=ex+0.5) print \"OK\"; else printf \"FAIL:%.1f_ex=%s\\n\", n, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch3 mp4 fps == edgeconf fps (±0.5)
      command: "EX=$(jq -r '.VHL_CAM.fps' /root/shared_v/edgeconf_pim.json); F=$(find /mnt/sd_cam /dev/shm/recording -name '*-ch3.mp4' -mmin -2 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); [ -n \"$F\" ] && FR=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$FR\" | awk -F/ -v ex=\"$EX\" '{n=$1/$2; if (n>=ex-0.5 && n<=ex+0.5) print \"OK\"; else printf \"FAIL:%.1f_ex=%s\\n\", n, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch0 bitrate ~ edgeconf bps[1] (±20%)
      command: "EX=$(jq -r '.VHL_CAM.i2c2.ch0.bps[1] // 0' /root/shared_v/edgeconf_pim.json); [ \"$EX\" = \"0\" ] && { echo OK; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recording -name '*-ch0.mp4' -mmin -2 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); [ -n \"$F\" ] && BR=$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$BR\" | awk -v ex=\"$EX\" '{br=$1/1000; if (br>=ex*0.8 && br<=ex*1.2) print \"OK\"; else printf \"FAIL:%dkbps_ex=%dkbps\\n\", br, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch1 bitrate ~ edgeconf bps[1] (±20%)
      command: "EX=$(jq -r '.VHL_CAM.i2c2.ch1.bps[1] // 0' /root/shared_v/edgeconf_pim.json); [ \"$EX\" = \"0\" ] && { echo OK; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recording -name '*-ch1.mp4' -mmin -2 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); [ -n \"$F\" ] && BR=$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$BR\" | awk -v ex=\"$EX\" '{br=$1/1000; if (br>=ex*0.8 && br<=ex*1.2) print \"OK\"; else printf \"FAIL:%dkbps_ex=%dkbps\\n\", br, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch2 bitrate ~ edgeconf bps[1] (±20%)
      command: "EX=$(jq -r '.VHL_CAM.i2c1.ch2.bps[1] // 0' /root/shared_v/edgeconf_pim.json); [ \"$EX\" = \"0\" ] && { echo OK; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recording -name '*-ch2.mp4' -mmin -2 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); [ -n \"$F\" ] && BR=$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$BR\" | awk -v ex=\"$EX\" '{br=$1/1000; if (br>=ex*0.8 && br<=ex*1.2) print \"OK\"; else printf \"FAIL:%dkbps_ex=%dkbps\\n\", br, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch3 bitrate ~ edgeconf bps[1] (±20%)
      command: "EX=$(jq -r '.VHL_CAM.i2c1.ch3.bps[1] // 0' /root/shared_v/edgeconf_pim.json); [ \"$EX\" = \"0\" ] && { echo OK; exit 0; }; F=$(find /mnt/sd_cam /dev/shm/recording -name '*-ch3.mp4' -mmin -2 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); [ -n \"$F\" ] && BR=$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of csv=p=0 \"$F\" 2>/dev/null) && echo \"$BR\" | awk -v ex=\"$EX\" '{br=$1/1000; if (br>=ex*0.8 && br<=ex*1.2) print \"OK\"; else printf \"FAIL:%dkbps_ex=%dkbps\\n\", br, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: 최근 2분 내 .srt 파일 ≥1 (srt_enable=true 실측)
      command: find /mnt/sd_cam /dev/shm/recording \( -name '*.srt' -o -name '*.srt.part' \) -mmin -2 2>/dev/null | wc -l | tr -d ' '
      expected_min: 1
      on_fail: srt_enable=true인데 .srt 파일 미생성
    # === i2c register (vflip/hflip/AE/AWB) — 4ch unique signature ===
    - name: ch0 ROTATION (FT → 0x0001)
      command: i2ctransfer -f -y 2 w2@0x11 0x10 0x0c r2 2>/dev/null | tr -d ' '
      expected: '0x000x01'
    - name: ch1 ROTATION (FF → 0x0000)
      command: i2ctransfer -f -y 2 w2@0x12 0x10 0x0c r2 2>/dev/null | tr -d ' '
      expected: '0x000x00'
    - name: ch2 ROTATION (TF → 0x0002)
      command: i2ctransfer -f -y 1 w2@0x11 0x10 0x0c r2 2>/dev/null | tr -d ' '
      expected: '0x000x02'
    - name: ch3 ROTATION (TT → 0x0003)
      command: i2ctransfer -f -y 1 w2@0x12 0x10 0x0c r2 2>/dev/null | tr -d ' '
      expected: '0x000x03'
    - name: ch0 AE_CTRL (ae=F)
      command: i2ctransfer -f -y 2 w2@0x11 0x50 0x02 r2 2>/dev/null | tr -d ' '
      expected: '0x020x90'
    - name: ch1 AE_CTRL (ae=T)
      command: i2ctransfer -f -y 2 w2@0x12 0x50 0x02 r2 2>/dev/null | tr -d ' '
      expected: '0x020x99'
    - name: ch2 AE_CTRL (ae=T)
      command: i2ctransfer -f -y 1 w2@0x11 0x50 0x02 r2 2>/dev/null | tr -d ' '
      expected: '0x020x99'
    - name: ch3 AE_CTRL (ae=F)
      command: i2ctransfer -f -y 1 w2@0x12 0x50 0x02 r2 2>/dev/null | tr -d ' '
      expected: '0x020x90'
    - name: ch0 AWB_CTRL (auto)
      command: i2ctransfer -f -y 2 w2@0x11 0x51 0x00 r2 2>/dev/null | tr -d ' '
      expected: '0x110x5f'
    - name: ch1 AWB_CTRL (d65)
      command: i2ctransfer -f -y 2 w2@0x12 0x51 0x00 r2 2>/dev/null | tr -d ' '
      expected: '0x110x55'
    - name: ch2 AWB_CTRL (off)
      command: i2ctransfer -f -y 1 w2@0x11 0x51 0x00 r2 2>/dev/null | tr -d ' '
      expected: '0x110x50'
    - name: ch3 AWB_CTRL (d75)
      command: i2ctransfer -f -y 1 w2@0x12 0x51 0x00 r2 2>/dev/null | tr -d ' '
      expected: '0x110x56'
    - name: bus2 EXP_TIME (33000us = 0x80e8)
      command: i2ctransfer -f -y 2 w2@0x11 0x50 0x0c r4 2>/dev/null | tr -d ' '
      expected: '0x000x000x800xe8'
    - name: bus1 EXP_TIME (50000us = 0xc350)
      command: i2ctransfer -f -y 1 w2@0x11 0x50 0x0c r4 2>/dev/null | tr -d ' '
      expected: '0x000x000xc30x50'
    - name: dmesg max9296_fsync fps (expected 15)
      command: "dmesg 2>/dev/null | grep -oE 'max9296_fsync fps : [0-9]+' | grep -oE '[0-9]+$' | sort -u | tr '\\n' ',' | sed 's/,$//'"
      expected: '15'
      on_fail: dmesg max9296_fsync fps 15와 다름
    - name: ch0 led_flash (T/16/delay=0)
      command: jq -r '.VHL_CAM.i2c2.ch0.led_flash | "\(.enable)|\(.wiper)|\(.flash_delay)"' /root/shared_v/edgeconf_pim.json
      expected: 'true|16|0'
    - name: ch1 led_flash (F/32/delay=5)
      command: jq -r '.VHL_CAM.i2c2.ch1.led_flash | "\(.enable)|\(.wiper)|\(.flash_delay)"' /root/shared_v/edgeconf_pim.json
      expected: 'false|32|5'
    - name: ch2 led_flash (T/48/delay=10)
      command: jq -r '.VHL_CAM.i2c1.ch2.led_flash | "\(.enable)|\(.wiper)|\(.flash_delay)"' /root/shared_v/edgeconf_pim.json
      expected: 'true|48|10'
    - name: ch3 led_flash (F/63/delay=15)
      command: jq -r '.VHL_CAM.i2c1.ch3.led_flash | "\(.enable)|\(.wiper)|\(.flash_delay)"' /root/shared_v/edgeconf_pim.json
      expected: 'false|63|15'
    - name: ch0 mp4 duration ~ recording_time*60s (±5s)
      command: "EX=$(jq -r '.VHL_CAM.recording_time' /root/shared_v/edgeconf_pim.json); F=$(find /mnt/sd_cam /dev/shm/recording -name '*-ch0.mp4' -mmin -2 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); [ -n \"$F\" ] && D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 \"$F\" 2>/dev/null | cut -d. -f1) && echo \"$D\" | awk -v ex=$((EX*60)) '{if ($1>=ex-5 && $1<=ex+5) print \"OK\"; else printf \"FAIL:%ds_ex=%ds\\n\", $1, ex}' || echo FAIL:NO_FILE"
      expected: OK
    - name: ch0 mp4와 srt 동일 session prefix
      command: "M=$(find /mnt/sd_cam /dev/shm/recording -name '*-ch0.mp4' -mmin -2 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); S=$(find /mnt/sd_cam /dev/shm/recording -name '*-data.srt' -mmin -2 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); MP=${M##*/}; MP=${MP%-ch0.mp4}; SP=${S##*/}; SP=${SP%-data.srt}; [ -n \"$MP\" ] && [ -n \"$SP\" ] && [ \"$MP\" = \"$SP\" ] && echo OK || echo \"MISMATCH mp4=$MP srt=$SP\""
      expected: OK
      on_fail: mp4와 srt가 같은 session에 생성 안 됨
    - name: ch0 mp4와 srt 종료 시간 ±2s
      command: "M=$(find /mnt/sd_cam /dev/shm/recording -name '*-ch0.mp4' -mmin -2 -printf '%T@\\n' 2>/dev/null | sort -n | tail -1 | cut -d. -f1); S=$(find /mnt/sd_cam /dev/shm/recording -name '*-data.srt' -mmin -2 -printf '%T@\\n' 2>/dev/null | sort -n | tail -1 | cut -d. -f1); D=$((M-S)); A=${D#-}; [ \"$A\" -le 2 ] && echo OK || echo \"FAIL:diff=${D}s\""
      expected: OK
