# FHD 4채널 고부하 테스트
name: "FHD 4채널 모니터링"
description: "1920x1080 4채널 고부하 테스트"

setup:
  edgeconf_changes:
    ".VHL_CAM.cam_width": 1920
    ".VHL_CAM.cam_height": 1080
    ".VHL_CAM.i2c1.ch2.enable": true
    ".VHL_CAM.i2c1.ch3.enable": true
  reboot_after: true
  stabilize_sec: 60

checks:
  cpu:
    gst_range: [50, 95]
  thermal:
    warn_temp_c: 82
  recording:
    expected_channels: 4
    session_progress: "4/4"
