# Multi-channel unique-settings (3ch '3ch_012', 720p)
# 1 reboot으로 채널별 다른 설정 동시 검증.
# Resolution: 720p (1280x720, 30fps)
# Active channels: [0, 1, 2]
# i2c addrs: [(0, '0x11'), (1, '0x12'), (2, '0x3c')]
# CPU range: gst_range=[10, 70] (3ch × 720p)
# Thermal: warn=88°C, max=93°C (base 동일)
# 검증: ROTATION/AE_CTRL/AE_GAIN/AWB_CTRL/EXP_TIME/BITRATE/FPS/
#       file_integrity/per-ch cam_state/duration/CPU/thermal
# stabilize_sec=75 (60s 녹화 + 15s buffer)
# 자동 생성: /tmp/gen_multi_cases.py (1회용 scaffolding, 폐기됨)
name: '[multi] 3ch 3ch_012 720p'
description: '3-channel "3ch_012" combination at 720p with channel-unique settings'
tags: [multi, comprehensive]

setup:
  edgeconf_changes:
    .VHL_CAM.cam_width: 1280
    .VHL_CAM.cam_height: 720
    .VHL_CAM.fps: 30
    .VHL_CAM.recording_time: 1
    .VHL_CAM.muxer: mp4
    .VHL_CAM.i2c1.exp_time: 20000
    .VHL_CAM.i2c2.exp_time: 5000
    .VHL_CAM.i2c2.ch0.enable: true
    .VHL_CAM.i2c2.ch1.enable: true
    .VHL_CAM.i2c1.ch2.enable: true
    .VHL_CAM.i2c1.ch3.enable: false
    .VHL_CAM.i2c2.ch0.vflip: false
    .VHL_CAM.i2c2.ch0.hflip: true
    .VHL_CAM.i2c2.ch0.ae_on: false
    .VHL_CAM.i2c2.ch0.ae_gain: 8192
    .VHL_CAM.i2c2.ch0.bps:
      - 1024
      - 1024
    .VHL_CAM.i2c2.ch0.awb: "auto"
    .VHL_CAM.i2c2.ch1.vflip: true
    .VHL_CAM.i2c2.ch1.hflip: false
    .VHL_CAM.i2c2.ch1.ae_on: true
    .VHL_CAM.i2c2.ch1.ae_gain: 256
    .VHL_CAM.i2c2.ch1.bps:
      - 4096
      - 4096
    .VHL_CAM.i2c2.ch1.awb: "off"
    .VHL_CAM.i2c1.ch2.vflip: true
    .VHL_CAM.i2c1.ch2.hflip: true
    .VHL_CAM.i2c1.ch2.ae_on: true
    .VHL_CAM.i2c1.ch2.ae_gain: 256
    .VHL_CAM.i2c1.ch2.bps:
      - 8192
      - 8192
    .VHL_CAM.i2c1.ch2.awb: "d65"
  reboot_after: true
  stabilize_sec: 75

checks:
  cam_state:
    dir: /tmp/cam_state
    expected_state: healthy
    max_streak: 0
  recording:
    expected_channels: 3
    session_progress: '3/3'
  cpu:
    gst_range: [10, 70]
  thermal:
    warn_temp_c: 88
    max_temp_c: 93
  custom_commands:
  - name: ch0 ROTATION (vflip=false, hflip=true)
    command: i2ctransfer -f -y 2 w2@0x11 0x10 0x0c r2 2>/dev/null | tr -d ' '
    expected: '0x000x01'
    on_fail: ch0 ROTATION 미반영
  - name: ch0 AE_CTRL (ae_on=false)
    command: i2ctransfer -f -y 2 w2@0x11 0x50 0x02 r2 2>/dev/null | tr -d ' '
    expected: '0x020x90'
    on_fail: ch0 AE_CTRL 미반영
  - name: ch0 AWB_CTRL (awb=auto)
    command: i2ctransfer -f -y 2 w2@0x11 0x51 0x00 r2 2>/dev/null | tr -d ' '
    expected: '0x110x5f'
    on_fail: ch0 AWB_CTRL 미반영
  - name: ch0 AE_GAIN (gain=8192, manual mode)
    command: i2ctransfer -f -y 2 w2@0x11 0x50 0x06 r2 2>/dev/null | tr -d ' '
    expected: '0x200x00'
    on_fail: ch0 AE_GAIN 미반영
  - name: ch1 ROTATION (vflip=true, hflip=false)
    command: i2ctransfer -f -y 2 w2@0x12 0x10 0x0c r2 2>/dev/null | tr -d ' '
    expected: '0x000x02'
    on_fail: ch1 ROTATION 미반영
  - name: ch1 AE_CTRL (ae_on=true)
    command: i2ctransfer -f -y 2 w2@0x12 0x50 0x02 r2 2>/dev/null | tr -d ' '
    expected: '0x020x99'
    on_fail: ch1 AE_CTRL 미반영
  - name: ch1 AWB_CTRL (awb=off)
    command: i2ctransfer -f -y 2 w2@0x12 0x51 0x00 r2 2>/dev/null | tr -d ' '
    expected: '0x110x50'
    on_fail: ch1 AWB_CTRL 미반영
  - name: ch2 ROTATION (vflip=true, hflip=true)
    command: i2ctransfer -f -y 1 w2@0x3c 0x10 0x0c r2 2>/dev/null | tr -d ' '
    expected: '0x000x03'
    on_fail: ch2 ROTATION 미반영
  - name: ch2 AE_CTRL (ae_on=true)
    command: i2ctransfer -f -y 1 w2@0x3c 0x50 0x02 r2 2>/dev/null | tr -d ' '
    expected: '0x020x99'
    on_fail: ch2 AE_CTRL 미반영
  - name: ch2 AWB_CTRL (awb=d65)
    command: i2ctransfer -f -y 1 w2@0x3c 0x51 0x00 r2 2>/dev/null | tr -d ' '
    expected: '0x110x55'
    on_fail: ch2 AWB_CTRL 미반영
  - name: bus1 EXP_TIME (20000us)
    command: i2ctransfer -f -y 1 w2@0x3c 0x50 0x0c r4 2>/dev/null | tr -d ' '
    expected: '0x000x000x4e0x20'
    on_fail: bus1 EXP_TIME 미반영
  - name: bus2 EXP_TIME (5000us)
    command: i2ctransfer -f -y 2 w2@0x11 0x50 0x0c r4 2>/dev/null | tr -d ' '
    expected: '0x000x000x130x88'
    on_fail: bus2 EXP_TIME 미반영
  - name: ch0 cam_state error count
    command: |-
      F=/tmp/cam_state/channels/ch0_error
      [ ! -f $F ] && echo FAIL:NO_FILE && exit 0
      E=$(cat $F 2>/dev/null | tr -d ' \n')
      [ -z "$E" ] || [ "$E" = "0" ] && echo OK || echo FAIL:err=$E
    expected: 'OK'
    on_fail: 'ch0 에러 카운트 발생'
  - name: ch0 cam_state last_ok freshness (<30s)
    command: |-
      F=/tmp/cam_state/channels/ch0_last_ok
      [ ! -f $F ] && echo FAIL:NO_FILE && exit 0
      L=$(cat $F 2>/dev/null | tr -d ' \n')
      [ -z "$L" ] && echo FAIL:EMPTY && exit 0
      N=$(date +%s); D=$((N - L))
      [ $D -lt 30 ] && echo OK || echo FAIL:stale_${D}s
    expected: 'OK'
    on_fail: 'ch0 last_ok이 stale (frame drop 또는 채널 죽음)'
  - name: ch1 cam_state error count
    command: |-
      F=/tmp/cam_state/channels/ch1_error
      [ ! -f $F ] && echo FAIL:NO_FILE && exit 0
      E=$(cat $F 2>/dev/null | tr -d ' \n')
      [ -z "$E" ] || [ "$E" = "0" ] && echo OK || echo FAIL:err=$E
    expected: 'OK'
    on_fail: 'ch1 에러 카운트 발생'
  - name: ch1 cam_state last_ok freshness (<30s)
    command: |-
      F=/tmp/cam_state/channels/ch1_last_ok
      [ ! -f $F ] && echo FAIL:NO_FILE && exit 0
      L=$(cat $F 2>/dev/null | tr -d ' \n')
      [ -z "$L" ] && echo FAIL:EMPTY && exit 0
      N=$(date +%s); D=$((N - L))
      [ $D -lt 30 ] && echo OK || echo FAIL:stale_${D}s
    expected: 'OK'
    on_fail: 'ch1 last_ok이 stale (frame drop 또는 채널 죽음)'
  - name: ch2 cam_state error count
    command: |-
      F=/tmp/cam_state/channels/ch2_error
      [ ! -f $F ] && echo FAIL:NO_FILE && exit 0
      E=$(cat $F 2>/dev/null | tr -d ' \n')
      [ -z "$E" ] || [ "$E" = "0" ] && echo OK || echo FAIL:err=$E
    expected: 'OK'
    on_fail: 'ch2 에러 카운트 발생'
  - name: ch2 cam_state last_ok freshness (<30s)
    command: |-
      F=/tmp/cam_state/channels/ch2_last_ok
      [ ! -f $F ] && echo FAIL:NO_FILE && exit 0
      L=$(cat $F 2>/dev/null | tr -d ' \n')
      [ -z "$L" ] && echo FAIL:EMPTY && exit 0
      N=$(date +%s); D=$((N - L))
      [ $D -lt 30 ] && echo OK || echo FAIL:stale_${D}s
    expected: 'OK'
    on_fail: 'ch2 last_ok이 stale (frame drop 또는 채널 죽음)'
  - name: ch0 BITRATE (~1024kbps ±20%, file-delta 5s)
    command: |-
      F=$(find /dev/shm/recordings /mnt/sd_cam -name '*-ch0.mp4' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)
      [ -z "$F" ] && echo FAIL:NO_FILE && exit 0
      S1=$(stat -c %s "$F" 2>/dev/null); sleep 5; S2=$(stat -c %s "$F" 2>/dev/null)
      K=$(( (S2 - S1) * 8 / 5 / 1000 )); [ $K -ge 819 ] && [ $K -le 1228 ] && echo OK || echo FAIL:${K}kbps
    expected: 'OK'
    on_fail: 'ch0 실측 bitrate 범위(819~1228kbps) 벗어남'
  - name: ch1 BITRATE (~4096kbps ±20%, file-delta 5s)
    command: |-
      F=$(find /dev/shm/recordings /mnt/sd_cam -name '*-ch1.mp4' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)
      [ -z "$F" ] && echo FAIL:NO_FILE && exit 0
      S1=$(stat -c %s "$F" 2>/dev/null); sleep 5; S2=$(stat -c %s "$F" 2>/dev/null)
      K=$(( (S2 - S1) * 8 / 5 / 1000 )); [ $K -ge 3276 ] && [ $K -le 4915 ] && echo OK || echo FAIL:${K}kbps
    expected: 'OK'
    on_fail: 'ch1 실측 bitrate 범위(3276~4915kbps) 벗어남'
  - name: ch2 BITRATE (~8192kbps ±20%, file-delta 5s)
    command: |-
      F=$(find /dev/shm/recordings /mnt/sd_cam -name '*-ch2.mp4' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)
      [ -z "$F" ] && echo FAIL:NO_FILE && exit 0
      S1=$(stat -c %s "$F" 2>/dev/null); sleep 5; S2=$(stat -c %s "$F" 2>/dev/null)
      K=$(( (S2 - S1) * 8 / 5 / 1000 )); [ $K -ge 6553 ] && [ $K -le 9830 ] && echo OK || echo FAIL:${K}kbps
    expected: 'OK'
    on_fail: 'ch2 실측 bitrate 범위(6553~9830kbps) 벗어남'
  - name: ch0 파일 무결성 (codec=h264, 1280x720, .mp4)
    command: |-
      F=$(find /dev/shm/recordings /mnt/sd_cam -name '*-ch0.*' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)
      [ -z "$F" ] && echo FAIL:NO_FILE && exit 0
      EXT="${F##*.}"
      [ "$EXT" != "mp4" ] && echo FAIL:ext=$EXT && exit 0
      P=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=nw=1 "$F" 2>/dev/null)
      echo "$P" | grep -qE '^codec_name=h264$' || (echo FAIL:codec_$(echo "$P" | grep codec_name) && exit 0)
      echo "$P" | grep -qE '^width=1280$' || (echo FAIL:width_$(echo "$P" | grep width) && exit 0)
      echo "$P" | grep -qE '^height=720$' || (echo FAIL:height_$(echo "$P" | grep height) && exit 0)
      echo OK
    expected: 'OK'
    on_fail: 'ch0 파일 무결성 (codec/dim/ext) 미일치'
  - name: ch1 파일 무결성 (codec=h264, 1280x720, .mp4)
    command: |-
      F=$(find /dev/shm/recordings /mnt/sd_cam -name '*-ch1.*' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)
      [ -z "$F" ] && echo FAIL:NO_FILE && exit 0
      EXT="${F##*.}"
      [ "$EXT" != "mp4" ] && echo FAIL:ext=$EXT && exit 0
      P=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=nw=1 "$F" 2>/dev/null)
      echo "$P" | grep -qE '^codec_name=h264$' || (echo FAIL:codec_$(echo "$P" | grep codec_name) && exit 0)
      echo "$P" | grep -qE '^width=1280$' || (echo FAIL:width_$(echo "$P" | grep width) && exit 0)
      echo "$P" | grep -qE '^height=720$' || (echo FAIL:height_$(echo "$P" | grep height) && exit 0)
      echo OK
    expected: 'OK'
    on_fail: 'ch1 파일 무결성 (codec/dim/ext) 미일치'
  - name: ch2 파일 무결성 (codec=h264, 1280x720, .mp4)
    command: |-
      F=$(find /dev/shm/recordings /mnt/sd_cam -name '*-ch2.*' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)
      [ -z "$F" ] && echo FAIL:NO_FILE && exit 0
      EXT="${F##*.}"
      [ "$EXT" != "mp4" ] && echo FAIL:ext=$EXT && exit 0
      P=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=nw=1 "$F" 2>/dev/null)
      echo "$P" | grep -qE '^codec_name=h264$' || (echo FAIL:codec_$(echo "$P" | grep codec_name) && exit 0)
      echo "$P" | grep -qE '^width=1280$' || (echo FAIL:width_$(echo "$P" | grep width) && exit 0)
      echo "$P" | grep -qE '^height=720$' || (echo FAIL:height_$(echo "$P" | grep height) && exit 0)
      echo OK
    expected: 'OK'
    on_fail: 'ch2 파일 무결성 (codec/dim/ext) 미일치'
  - name: ch0 duration (~60s ±5s)
    command: |-
      F=$(find /dev/shm/recordings /mnt/sd_cam -name '*-ch0.mp4' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)
      [ -z "$F" ] && echo FAIL:NO_FILE && exit 0
      D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F" 2>/dev/null | cut -d. -f1)
      [ -z "$D" ] && echo FAIL:NO_DUR && exit 0
      LO=$(( 60 - 5 )); HI=$(( 60 + 5 ))
      [ $D -ge $LO ] && [ $D -le $HI ] && echo OK || echo FAIL:dur=${D}s
    expected: 'OK'
    on_fail: 'ch0 녹화 길이 60s ±5s 벗어남'
  - name: ch1 duration (~60s ±5s)
    command: |-
      F=$(find /dev/shm/recordings /mnt/sd_cam -name '*-ch1.mp4' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)
      [ -z "$F" ] && echo FAIL:NO_FILE && exit 0
      D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F" 2>/dev/null | cut -d. -f1)
      [ -z "$D" ] && echo FAIL:NO_DUR && exit 0
      LO=$(( 60 - 5 )); HI=$(( 60 + 5 ))
      [ $D -ge $LO ] && [ $D -le $HI ] && echo OK || echo FAIL:dur=${D}s
    expected: 'OK'
    on_fail: 'ch1 녹화 길이 60s ±5s 벗어남'
  - name: ch2 duration (~60s ±5s)
    command: |-
      F=$(find /dev/shm/recordings /mnt/sd_cam -name '*-ch2.mp4' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)
      [ -z "$F" ] && echo FAIL:NO_FILE && exit 0
      D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F" 2>/dev/null | cut -d. -f1)
      [ -z "$D" ] && echo FAIL:NO_DUR && exit 0
      LO=$(( 60 - 5 )); HI=$(( 60 + 5 ))
      [ $D -ge $LO ] && [ $D -le $HI ] && echo OK || echo FAIL:dur=${D}s
    expected: 'OK'
    on_fail: 'ch2 녹화 길이 60s ±5s 벗어남'
  - name: dmesg max9296_fsync fps (expected 30)
    command: |-
      F=$(dmesg 2>/dev/null | grep -oE 'max9296_fsync fps : [0-9]+' | grep -oE '[0-9]+$' | sort -u | tr '\n' ',' | sed 's/,$//')
      [ -z "$F" ] && echo FAIL:NO_DMESG && exit 0
      [ "$F" = "30" ] && echo OK || echo FAIL:got=$F
    expected: 'OK'
    on_fail: 'dmesg max9296_fsync fps 30와 다름'
