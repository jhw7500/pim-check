# mux ts 변형 sanity — mpegts container 회귀 보호
# 720p_2ch 동일 설정 + muxer=ts만 변경. ffprobe로 ts container 확인.
name: "mux ts smoke"
description: "muxer=ts 분기 (mpegts) — ts container 회귀 보호"
tags: [smoke, mux]

setup:
  edgeconf_changes:
    ".VHL_CAM.cam_width": 1280
    ".VHL_CAM.cam_height": 720
    ".VHL_CAM.fps": 30
    ".VHL_CAM.muxer": ts
    ".VHL_CAM.i2c2.ch0.enable": true
    ".VHL_CAM.i2c2.ch1.enable": false
    ".VHL_CAM.i2c1.ch2.enable": false
    ".VHL_CAM.i2c1.ch3.enable": false
    ".VHL_CAM.i2c2.ch0.bps":
      - 1024
      - 1024
  reboot_after: true
  stabilize_sec: 80

checks:
  cpu:
    gst_range: [0, 200]
  recording:
    expected_channels: 1
  custom_commands:
    - name: ts 파일 생성 (직전 2분)
      command: find /mnt/sd_cam /dev/shm/recording -name '*-ch0.ts' -mmin -2 2>/dev/null | head -1 | wc -l
      expected_min: 1
      on_fail: ts 파일 미생성
    - name: ts 파일 format = mpegts
      command: "F=$(find /mnt/sd_cam /dev/shm/recording -name '*-ch0.ts' -mmin -2 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); [ -n \"$F\" ] && ffprobe -v error -show_entries format=format_name -of csv=p=0 \"$F\" 2>/dev/null || echo NO_FILE"
      expected: mpegts
      on_fail: ts 파일이 mpegts 컨테이너가 아님
    - name: ch0 ts fps == edgeconf fps (±0.5)
      command: "EX=$(jq -r '.VHL_CAM.fps' /root/shared_v/edgeconf_pim.json); F=$(find /mnt/sd_cam /dev/shm/recording -name '*-ch0.ts' -mmin -2 -printf '%T@ %p\\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); [ -n \"$F\" ] && FR=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 \"$F\" 2>/dev/null | head -1) && echo \"$FR\" | awk -F/ -v ex=\"$EX\" '{n=$1/$2; if (n>=ex-0.5 && n<=ex+0.5) print \"OK\"; else printf \"FAIL:%.1f_ex=%s\\n\", n, ex}' || echo FAIL:NO_FILE"
      expected: OK
      on_fail: ch0 ts fps 불일치
