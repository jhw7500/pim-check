# gstApp + ORD + VCM 재시작 복구 검증. 반드시 독점 보드 lease로 실행.
# 장애 주입은 setup에서 단 한 번만 수행한다. custom_commands는 읽기 전용이다.
# 이전 run이 비정상 종료해 anchor가 남았다면 덮어쓰거나 재주입하지 않는다.
name: "process restart smoke (gstApp+ord+vcm)"
description: "세 프로세스의 강제 종료·자동 재시작·독립 복구 사후조건 검증"
tags: [smoke, process, watchdog, injection]

monitor:
  duration_sec: 0

setup:
  # smoke Plan의 case_retry=1, verify_retry 반복 수집에서도 재주입하지 않는다.
  single_injection: true
  inject_command: >-
    S=/tmp/pim_restart_smoke_before; R=/tmp/pim_restart_smoke_state;
    rm -f "$R";
    if [ -e "$S" ]; then echo STALE_MARKER > "$R"; exit 0; fi;
    G=$(pgrep -x gstApp | head -1); O=$(pgrep -x ord | head -1); V=$(pgrep -x vcm | head -1);
    if [ -z "$G" ] || [ -z "$O" ] || [ -z "$V" ]; then
      echo PRECONDITION_FAILED > "$R"; exit 0;
    fi;
    if ! printf '%s %s %s\n' "$G" "$O" "$V" > "$S"; then
      echo ANCHOR_FAILED > "$R"; exit 0;
    fi;
    pkill -9 -x gstApp; pkill -9 -x ord; pkill -9 -x vcm;
    sleep 60;
    G2=$(pgrep -x gstApp | head -1); O2=$(pgrep -x ord | head -1); V2=$(pgrep -x vcm | head -1);
    if [ -n "$G2" ] && [ -n "$O2" ] && [ -n "$V2" ] &&
       [ "$G" != "$G2" ] && [ "$O" != "$O2" ] && [ "$V" != "$V2" ]; then
      echo INJECT_VERIFIED > "$R";
    else
      echo AUTO_RECOVERY_FAILED > "$R";
    fi

checks:
  cam_state:
    dir: /tmp/cam_state
    expected_state: healthy
    max_streak: 0
  # 강제 종료 중 snapshot의 stale/prepare 전이는 검사의 대상이 아니다.
  cam_health:
    path: null
  frame_flow:
    path: null
  max9296_abi:
    expected_version: null
  custom_commands:
    - name: "3 process 재시작 PID 교체 증거"
      command: "cat /tmp/pim_restart_smoke_state 2>/dev/null || echo NO_INJECTION_STATE"
      expected: "INJECT_VERIFIED"
      on_fail: "초기 PID 대비 세 프로세스의 재기동 확인 실패 / stale marker"

    - name: "재시작 후 gstApp+ord+vcm 모두 실행"
      command: >-
        M=""; for p in gstApp ord vcm; do
          P=$(pgrep -x "$p" | head -1);
          [ -n "$P" ] && [ -r "/proc/$P/stat" ] &&
          [ "$(awk '{print $3}' "/proc/$P/stat")" != Z ] || M="$M $p";
        done;
        [ -z "$M" ] && echo ALL_RUNNING || echo "DOWN:$M"
      expected: "ALL_RUNNING"
      on_fail: "재시작 후 일부 프로세스 없음 / zombie"

    - name: "재시작 후 cam_state healthy"
      command: "cat /tmp/cam_state/state 2>/dev/null || echo NO_STATE"
      expected: "healthy"
      on_fail: "재시작 후 cam_state healthy 복귀 실패"

    - name: "재시작 후 ord 포트 리슨 (10007)"
      command: >-
        P=$(jq -er '.ORD.port_num | tonumber | select(. >= 1 and . <= 65535)'
        /root/shared_v/ord_vcm_conf.json 2>/dev/null) || { echo 0; exit 0; };
        ss -H -tln 2>/dev/null | grep -Ec ":$P[[:space:]]" || true
      expected_min: 1
      on_fail: "ORD 설정 포트 리슨 없음"

    - name: "재시작 후 vcm 포트 리슨 (10009)"
      command: >-
        P=$(jq -er '.VCM.port_num | tonumber | select(. >= 1 and . <= 65535)'
        /root/shared_v/ord_vcm_conf.json 2>/dev/null) || { echo 0; exit 0; };
        ss -H -tln 2>/dev/null | grep -Ec ":$P[[:space:]]" || true
      expected_min: 1
      on_fail: "VCM 설정 포트 리슨 없음"

teardown:
  # gstApp만 배포된 공식 복구 명령 사용. ORD/VCM 미복구 시 임의 서비스
  # 재시작·재부팅하지 않는다. watchdog 복귀를 잠깐 대기한 뒤 불확실 상태면 STOP.
  recovery_command: >-
    S=/tmp/pim_restart_smoke_before; R=/tmp/pim_restart_smoke_state;
    [ -r "$S" ] || { echo RECOVERY_DEFERRED; exit 0; };
    case "$(cat "$R" 2>/dev/null)" in
      INJECT_VERIFIED|AUTO_RECOVERY_FAILED) ;;
      *) echo RECOVERY_DEFERRED; exit 0 ;;
    esac;
    if ! pgrep -x gstApp >/dev/null; then
      /opt/pim/bin/cam-recoveryctl request gstapp_restart --source pim-check --reason process-restart-smoke-cleanup --wait 120;
    fi;
    echo RECOVERY_ATTEMPTED
  # OK이면 이 케이스의 marker도 해제. STALE이면 판단없이 지우지 않으며
  # 후속 케이스 실행을 차단한다(수동 확인 필요).
  # PID 이후 카메라/포트가 늦게 준비될 수 있어 전체 사후조건을 최대 6회 확인한다.
  recovery_verify_command: >-
    S=/tmp/pim_restart_smoke_before; R=/tmp/pim_restart_smoke_state;
    [ -r "$R" ] && [ "$(cat "$R")" != "STALE_MARKER" ] || { echo FAIL; exit 0; };
    for i in 1 2 3 4 5 6; do
      M=""; for p in gstApp ord vcm; do
        P=$(pgrep -x "$p" | head -1);
        [ -n "$P" ] && [ -r "/proc/$P/stat" ] &&
        [ "$(awk '{print $3}' "/proc/$P/stat")" != Z ] || M="$M $p";
      done;
      OP=$(jq -er '.ORD.port_num | tonumber | select(. >= 1 and . <= 65535)' /root/shared_v/ord_vcm_conf.json 2>/dev/null);
      VP=$(jq -er '.VCM.port_num | tonumber | select(. >= 1 and . <= 65535)' /root/shared_v/ord_vcm_conf.json 2>/dev/null);
      if [ -z "$M" ] && [ "$(cat /tmp/cam_state/state 2>/dev/null)" = healthy ] &&
         [ -n "$OP" ] && [ -n "$VP" ] &&
         ss -H -tln 2>/dev/null | grep -Eq ":$OP[[:space:]]" &&
         ss -H -tln 2>/dev/null | grep -Eq ":$VP[[:space:]]"; then
        rm -f "$S" "$R" && echo OK || echo FAIL;
        exit 0;
      fi;
      [ "$i" -lt 6 ] && sleep 5;
    done;
    echo FAIL
