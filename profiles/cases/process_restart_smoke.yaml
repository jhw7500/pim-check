# gstApp 강제 종료 후 chk_cam_operate 자동 재시작 sanity
# reboot 없이 빠른 회귀 보호 (~1분)
name: "process restart smoke"
description: "pkill gstApp → chk_cam_operate가 30s 안에 재시작 → cam_state healthy 복귀"
tags: [smoke, process]

checks:
  cam_state:
    dir: /tmp/cam_state
    expected_state: healthy
    max_streak: 0
  custom_commands:
    - name: 사전 gstApp 실행 확인
      command: pgrep -x gstApp > /dev/null && echo RUNNING || echo STOPPED
      expected: RUNNING
      on_fail: gstApp 사전 미실행
    - name: gstApp 강제 종료 + 60s 대기 (cam_state 복구 시간 포함)
      command: pkill -9 -x gstApp; sleep 60; pgrep -x gstApp > /dev/null && echo RESTARTED || echo NOT_RESTARTED
      expected: RESTARTED
      on_fail: chk_cam_operate가 gstApp 자동 재시작 못 함
    - name: 재시작 후 cam_state healthy 또는 recovering (degraded 아님)
      command: cat /tmp/cam_state/state
      expected: healthy
      on_fail: 재시작 후 cam_state degraded 잔존
