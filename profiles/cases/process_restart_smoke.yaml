# gstApp + ord + vcm 일괄 강제 종료 후 자동 재시작 sanity
# reboot 없이 chk_cam_operate + 시스템 watchdog 동시 검증
name: "process restart smoke (gstApp+ord+vcm)"
description: "pkill gstApp/ord/vcm → 60s 안에 자동 재시작 + 포트 리슨"
tags: [smoke, process, watchdog]

monitor:
  duration_sec: 0

checks:
  cam_state:
    dir: /tmp/cam_state
    expected_state: healthy
    max_streak: 0
  # gstApp 을 60초 pkill 하는 주입 케이스 — kill 구간의 producer stale/prepare
  # 과도 상태는 주입 효과지 결함이 아니므로 두 체크를 끈다 (fault_gstapp_crash 동일).
  cam_health:
    path: null
  max9296_abi:
    expected_version: null
  custom_commands:
    - name: 사전 gstApp+ord+vcm 동시 실행
      command: pgrep -x gstApp >/dev/null && pgrep -x ord >/dev/null && pgrep -x vcm >/dev/null && echo ALL_RUNNING || echo SOMEONE_DOWN
      expected: ALL_RUNNING
      on_fail: gstApp/ord/vcm 중 하나 사전 미실행
    - name: 3 process 일괄 강제 종료 + 60s 대기
      command: pkill -9 -x gstApp; pkill -9 -x ord; pkill -9 -x vcm; sleep 60; pgrep -x gstApp >/dev/null && pgrep -x ord >/dev/null && pgrep -x vcm >/dev/null && echo ALL_RESTARTED || echo SOMEONE_NOT_RESTARTED
      expected: ALL_RESTARTED
      on_fail: gstApp/ord/vcm 중 하나 자동 재시작 못 함 (watchdog 회귀)
    - name: 재시작 후 cam_state healthy
      command: cat /tmp/cam_state/state
      expected: healthy
      on_fail: 재시작 후 cam_state degraded 잔존
    - name: 재시작 후 ord 포트 리슨 (10007)
      command: P=$(jq '.ORD.port_num' /root/shared_v/ord_vcm_conf.json); ss -tlnp 2>/dev/null | grep -c ":$P " || true
      expected_min: 1
      on_fail: ord 포트 미리슨
    - name: 재시작 후 vcm 포트 리슨 (10009)
      command: P=$(jq '.VCM.port_num' /root/shared_v/ord_vcm_conf.json); ss -tlnp 2>/dev/null | grep -c ":$P " || true
      expected_min: 1
      on_fail: vcm 포트 미리슨
