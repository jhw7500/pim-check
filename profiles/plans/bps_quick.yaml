# bps_quick.yaml — script-wrapper plan
#
# 이 plan은 plan engine으로 실행하지 않는다.
# hw-verify-plan workflow가 plan name == "bps_quick"일 때
# run_bps_quick.py를 직접 호출하도록 분기 처리되어 있다.
#
# yaml 자체의 역할:
#   1. workflow_dispatch UI choice 정합성 (선택지에만 있고 yaml 없으면 lint 실패)
#   2. metadata 문서화 (사람이 plan 의도/범위 한눈에 파악)
#   3. plan.load_plan() lint 통과 (workflow의 lint step 호환)
#
# 실제 검증 정의: run_bps_quick.py
#   - hw_gate BPS adapter가 ch0(i2c-2 bus)에서 1024 / 2048 / 4096 / 8192 kbps를
#     독립 transaction으로 측정
#   - 각 setpoint: full fixture apply → reboot/read-back → finalized MP4 ffprobe
#     measurement → exact snapshot restore → reboot/hash verification
#   - committed baselines/hw-baseline.json의 target rule(설정값 대비)과 calibrated
#     median baseline rule을 중앙 평가한다. exit 0 또는 단일 ±10% 비교만으로 PASS가
#     되지 않는다.
#
# 검증 의도: 인코더 비트레이트 설정이 실제 출력에 정확히 반영되는지
# 결정적으로 회귀 감시. 인코더 회귀(nightly bps 24건의 진짜 원인) 검출용
# sanity check.
#
# 결과 파일 (workflow root 기준):
#   - bps_quick_results.json
#
# 소요: fixture stabilization 및 4회 reboot/restore cycle에 따라 달라진다.

name: "BPS Quick (인코더 비트레이트 빠른 검증)"
description: |
  ch0에서 4단계 bps(1024/2048/4096/8192 kbps)를 순차 적용하여
  실제 인코더 출력 비트레이트를 ffprobe로 측정한다. 각 setpoint는
  fixture 적용 → reboot/read-back → 측정 → 정확한 snapshot 복원 →
  reboot/hash verification을 거친다. committed target rule과 calibrated
  median baseline rule이 중앙 verdict를 결정한다.

  Script-wrapper plan — 실제 실행은 run_bps_quick.py가 담당하며
  plan engine은 미사용.
version: 1

cases:
  regression:
    # plan engine 미경유 — workflow 분기로 run_bps_quick.py 직접 실행.
    # 아래 selector는 lint 통과 목적의 placeholder.
    - _external_run_bps_quick

execution:
  stop_on_fail: false        # 4 bps 모두 돌려 회귀 패턴 파악
  case_retry: 0              # 외부 스크립트 내부에서 자체 처리
  reboot_wait_sec: 60        # script-wrapper lint placeholder; adapter가 reboot/readiness를 소유

gate:
  threshold_pass_rate: 1.0   # script-wrapper lint placeholder; committed hw baseline이 실제 policy
  allow_known_issue: false

# reports는 workflow root의 bps_quick_results.json을 그대로 업로드
# (plan engine 미경유 → reports/bps_quick/ 디렉터리는 생성되지 않음)
