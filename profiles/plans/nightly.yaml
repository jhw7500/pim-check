# nightly.yaml — 야간 전수 회귀 검증 (종합 plan)
#
# 용도: 매일 밤 cron 또는 push 트리거로 실행되는 전수 회귀 셋.
#       6개 기존 러너의 검증 범위를 한 plan으로 통합. 8-12시간 소요 추정.
#
# 종합 대상 (기존 러너 → 본 plan 매핑):
#   ✓ run_comprehensive_verify.py → 4채널 × 4 setting × 2 res (96)
#   ✓ run_smart_verify.py         → bps + ord_disk + cap (부분, 9 combos는 미표현)
#   ✓ run_mixed_combo_verify.py   → 2ch/3ch/4ch 조합 (부분)
#   ✓ run_channel_verify.py       → vflip + ae (32)
#   ✓ run_bps_quick.py            → bps (3, ch0만)
#   ⊘ run_failed_retry.py         → execution.case_retry로 대체

name: "Nightly Full Regression"
description: |
  야간 전수 회귀 — 6개 기존 러너의 검증 범위 통합 (~177 cases).
  실패해도 끝까지 돌려서 패턴 파악 (stop_on_fail=false).
  결과는 다음 릴리스 baseline 후보로 사용 가능.

version: 1

cases:
  regression:
    # ── 정상 동작 모드 (3, fps+bps 통합) ──
    - 720p_2ch
    - fhd_2ch_03
    - fhd_3ch_012
    - 720p_4ch
    - fhd_4ch

    # ── smoke 보강 sanity (4) ──
    - process_restart_smoke

    # ── 시스템/HW sanity (2) ──
    - board_hw_check
    - board_error_detect

    # ── Config 무결성 (4) ──
    - config_integrity
    - config_edgeconf_camera
    - config_edgeconf_network
    - config_ord_vcm

    # ── Multi-channel unique-settings (8 combos × 2 res = 16 cases) ──
    # 채널별 vflip/hflip/ae/awb/bps/exp_time 동시 검증 (channel isolation)
    - "multi_*"

    # ── ISP register: 단일 토글 전수 (회귀 detail용, 4채널 × 2해상도 × 4설정 = 64) ──
    - "gen_720p_ch*_vflip_*"
    - "gen_720p_ch*_hflip_*"
    - "gen_720p_ch*_ae_*"
    - "gen_720p_ch*_awb_*"
    - "gen_fhd_ch*_vflip_*"
    - "gen_fhd_ch*_hflip_*"
    - "gen_fhd_ch*_ae_*"
    - "gen_fhd_ch*_awb_*"

    # ── 채널 조합 (i2c mode 검증) ──
    - "gen_720p_0ch"
    - "gen_720p_1ch_*"
    - "gen_720p_2ch_*"
    - "gen_720p_3ch*"
    - "gen_720p_4ch*"

    # ── BPS/FPS는 multi 16건 + smoke 보강으로 흡수 (deprecated 32 yaml) ──

    # ── Capture / ord_disk / muxer / recording_time ──
    - "gen_720p_cap_*"
    - "gen_fhd_cap_*"
    - "gen_ord_disk_*"
    - "gen_fhd_mux_*"
    - "gen_fhd_rec*"

  delta: []   # nightly는 전수 — delta 사용 안 함

execution:
  stop_on_fail: false           # 야간은 끝까지 돌려서 패턴 데이터 확보
  case_retry: 2                 # 일시 SSH/HW 노이즈 흡수
  retry_wait_sec: 90
  reboot_wait_sec: 300
  wait_between_cases: 5         # 안정화 마진
  # monitor_until_pass 미사용: nightly 는 baseline 생성용 지속검증 gate.
  # 첫 통과 스냅샷에서 끊으면 후반 drift 를 놓쳐 baseline 신뢰도가 떨어진다.

gate:
  threshold_pass_rate: 0.98     # 야간은 98% 허용 (HW 노이즈 마진)
  allow_known_issue: true
  # baseline_ref 없음 — nightly는 baseline 생성용 (다음 plan이 이걸 baseline으로 사용)

reports:
  - format: html
    path: reports/nightly/{timestamp}.html
  - format: junit
    path: reports/nightly/{timestamp}.xml
  - format: json
    path: reports/nightly/{timestamp}.json
  - format: markdown_summary
    path: reports/nightly/{timestamp}.md

# 운영 노트:
#   - 첫 실행 후 결과 검토하여 reports/nightly/baselines/v{N}.json으로 promote
#   - hw-verify GHA에 nightly cron 추가 (v1.1)
#   - 실행 시간이 8시간을 넘으면 case 수 축소 또는 병렬화 검토
