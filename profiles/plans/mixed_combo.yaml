# mixed_combo.yaml — run_mixed_combo_verify.py 마이그레이션
#
# 원본: run_mixed_combo_verify.py (315줄)
#   - 4 mode 시나리오: ch1+ch3 cross-bus, ch0+ch2 cross-bus, ch0+ch1 same-bus dual, quad
#   - 각 시나리오에서 채널별 서로 다른 (vflip/hflip/ae/awb) 조합(A/B/C/D) 주입
#   - i2c 모드 진입 사전 검증 (i2cdetect)
#   - 채널 누설/덮어쓰기 검증
#
# 동등성:
#   ✓ 가능: i2c 모드 검증은 generated의 gen_720p_2ch_{cross,same_bus,i2c1}에 포함
#   ✗ 한계: "채널마다 서로 다른 설정 동시 주입"은 generated 케이스 1개당 단일 설정만 토글.
#           원본의 (ch0=A, ch1=B, ch2=C, ch3=D 동시) 패턴은 case YAML 1개로 표현 안 됨.
#           v1은 i2c 모드 검증 + 단일 토글 cases만 묶어 부분 마이그레이션.
#           full mixed-combo는 v1.2에서 case schema 확장 (multi-channel-override) 후 지원.

name: "Mixed Combo Verify (partial)"
description: |
  채널 조합별 i2c 모드 진입 + 단일 설정 토글 검증.
  원본 run_mixed_combo_verify.py의 부분 마이그레이션 (full coverage는 v1.2).

version: 1

cases:
  regression:
    # i2c 모드 진입 검증 (cross-bus single, same-bus dual, quad)
    - "gen_720p_2ch_cross"        # ch0+ch2 cross-bus single
    - "gen_720p_2ch_same_bus"     # ch0+ch1 same-bus dual
    - "gen_720p_2ch_i2c1"         # ch2+ch3 i2c-1 dual
    - "gen_720p_4ch"              # quad (모든 4채널)
    - "gen_720p_3ch"
    - "gen_720p_3ch_no_ch0"

  delta:
    # 단일 설정 토글 (cross/dual mode에서 vflip/hflip/ae/awb 누설 간접 검증)
    - "gen_720p_ch*_vflip_on"
    - "gen_720p_ch*_hflip_on"
    - "gen_720p_ch*_ae_off"
    - "gen_720p_ch*_awb_off"

execution:
  stop_on_fail: false
  case_retry: 1                 # i2c 검증은 일시 실패 가능 — 1회 retry
  retry_wait_sec: 30
  reboot_wait_sec: 300
  wait_between_cases: 5

gate:
  threshold_pass_rate: 1.0
  allow_known_issue: true

reports:
  - format: html
    path: reports/mixed_combo/{timestamp}.html
  - format: json
    path: reports/mixed_combo/{timestamp}.json

# v1 한계 (full migration까지의 gap):
#   - "ch0=A + ch1=B + ch2=C + ch3=D 동시 주입" 패턴 미표현
#     → schema.yaml + generator.py 확장으로 multi-override generated 케이스 추가 필요
#   - 원본의 12 검증 (4 mode × 3 register) → 현 plan은 case별 단일 검증
