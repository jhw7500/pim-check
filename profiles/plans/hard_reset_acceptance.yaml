name: "Camera Hard Reset Acceptance"
description: |
  Validate daemon-owned 4ch 720p -> 1ch FHD camera recovery, then check the
  owner and hard-reset request history BEFORE the ORD/VCM reboot downgrade.
  A hardware-reset acceptance run fails closed if required history is missing.
version: 1

cases:
  regression:
    - multi_4ch_720p
  delta:
    - multi_1ch_0_fhd
    - camera_reset_postcheck
    - 720p_2ch

execution:
  reset_mode: camera_hard
  stop_on_fail: true
  case_retry: 0
  retry_wait_sec: 0
  reboot_wait_sec: 300
  wait_between_cases: 0
  monitor_until_pass: true

gate:
  threshold_pass_rate: 1.0
  allow_known_issue: false

reports:
  - format: json
    path: reports/hard_reset_acceptance/{timestamp}.json
  - format: markdown_summary
    path: reports/hard_reset_acceptance/{timestamp}.md
